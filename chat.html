<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FamilyChat Private - Mensajería Familiar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-modal {
            background: rgba(10, 15, 30, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            height: 100dvh;
            width: 100vw;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-[100dvh] w-screen overflow-hidden flex flex-col justify-between select-none">

    <!-- APP CONTAINER -->
    <div id="app" class="relative w-full h-[100dvh] flex flex-col overflow-hidden">

        <!-- SCREEN 1: LOGIN / SELECT PROFILE -->
        <div id="loginScreen" class="absolute inset-0 z-50 flex flex-col items-center justify-center p-4 bg-slate-950 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 overflow-y-auto">
            <div class="max-w-md w-full glass-panel rounded-2xl p-6 shadow-2xl border border-slate-800 text-center">
                <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-cyan-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-users text-3xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white mb-1">FamilyChat Private</h1>
                <p class="text-slate-400 text-sm mb-6">Selecciona tu perfil para ingresar</p>

                <div id="usersGrid" class="grid grid-cols-2 gap-3 mb-6"></div>

                <button onclick="showCreateUserModal()" class="w-full py-2.5 px-4 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-sm font-medium border border-slate-700/60 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus text-indigo-400"></i> Agregar integrante
                </button>
            </div>
        </div>

        <!-- SCREEN 2: MAIN CHAT INTERFACE -->
        <div id="chatScreen" class="hidden flex-1 flex h-[100dvh] w-full overflow-hidden relative">

            <!-- SIDEBAR: CONTACTS & GROUPS -->
            <div id="sidebar" class="w-full md:w-80 lg:w-96 glass-panel border-r border-slate-800/80 flex flex-col h-[100dvh] z-20 shrink-0 transition-all duration-300">
                <div class="p-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between shrink-0">
                    <div class="flex items-center gap-3">
                        <div id="currentUserAvatar" class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white text-base shadow-md">🧔‍♂️</div>
                        <div class="overflow-hidden">
                            <h2 id="currentUserName" class="font-bold text-slate-100 text-sm truncate">Carlos</h2>
                            <span class="text-xs text-emerald-400 flex items-center gap-1">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> En línea
                            </span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="togglePinModal()" title="Seguridad PIN" class="p-2 text-slate-400 hover:text-indigo-400 hover:bg-slate-800 rounded-lg transition">
                            <i class="fa-solid fa-key"></i>
                        </button>
                        <button onclick="switchUser()" title="Cambiar usuario" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded-lg transition">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>

                <div class="p-2 bg-slate-950/60 flex border-b border-slate-800/60 gap-1 text-xs shrink-0">
                    <button id="tabGroup" onclick="switchTab('group')" class="flex-1 py-2 rounded-lg font-medium bg-indigo-600 text-white transition flex items-center justify-center gap-2 shadow-sm">
                        <i class="fa-solid fa-people-group"></i> Grupo Familia
                    </button>
                    <button id="tabPrivate" onclick="switchTab('private')" class="flex-1 py-2 rounded-lg font-medium bg-slate-800/60 text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-lock"></i> Mensajes Privados
                    </button>
                </div>

                <div id="chatList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
            </div>

            <!-- CHAT MAIN AREA -->
            <div id="chatArea" class="hidden md:flex absolute md:relative inset-0 w-full md:w-auto flex-1 flex-col h-[100dvh] bg-slate-950 z-30 overflow-hidden">

                <!-- Header -->
                <div id="chatHeader" class="p-3.5 glass-panel border-b border-slate-800/80 flex items-center justify-between z-10 shrink-0">
                    <div class="flex items-center gap-3">
                        <button onclick="closeMobileChat()" class="md:hidden p-2 text-slate-300 hover:text-white rounded-lg bg-slate-800/80 active:scale-95 transition">
                            <i class="fa-solid fa-arrow-left text-base"></i>
                        </button>
                        <div id="targetAvatar" class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white shadow-md">👥</div>
                        <div>
                            <h3 id="targetName" class="font-bold text-slate-100 text-sm">Chat Familiar</h3>
                            <p id="targetStatus" class="text-xs text-slate-400">Conectado a Google Sheets</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="syncWithCloud()" title="Sincronizar" class="p-2 text-slate-400 hover:text-indigo-400 hover:bg-slate-800/60 rounded-lg transition">
                            <i id="syncIcon" class="fa-solid fa-rotate"></i>
                        </button>
                    </div>
                </div>

                <!-- Messages -->
                <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px]"></div>

                <!-- Previews -->
                <div id="imagePreviewContainer" class="hidden px-4 py-2 bg-slate-900 border-t border-slate-800 flex items-center justify-between shrink-0">
                    <div class="flex items-center gap-3">
                        <img id="imagePreview" src="" class="w-12 h-12 object-cover rounded-lg border border-slate-700">
                        <span class="text-xs text-slate-300">Imagen lista para enviar</span>
                    </div>
                    <button onclick="cancelImageUpload()" class="p-1 text-slate-400 hover:text-rose-400">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div id="recordingBar" class="hidden px-4 py-3 bg-rose-950/40 border-t border-rose-900/50 flex items-center justify-between animate-pulse shrink-0">
                    <div class="flex items-center gap-3 text-rose-400">
                        <div class="w-3 h-3 rounded-full bg-rose-500 animate-ping"></div>
                        <span class="text-xs font-semibold">Grabando nota de voz...</span>
                        <span id="recordingTimer" class="text-xs font-mono bg-rose-900/60 px-2 py-0.5 rounded text-rose-200">00:00</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="cancelRecording()" class="px-3 py-1 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">Cancelar</button>
                        <button onclick="stopAndSendVoice()" class="px-3 py-1 text-xs rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-medium flex items-center gap-1 shadow">
                            <i class="fa-solid fa-paper-plane"></i> Enviar
                        </button>
                    </div>
                </div>

                <!-- Emoji Picker -->
                <div id="emojiPicker" class="absolute bottom-16 left-4 z-40 hidden w-72 h-64 glass-modal rounded-2xl p-3 shadow-2xl border border-slate-700/80 flex-col transition-all duration-200 scale-95 opacity-0">
                    <div class="flex border-b border-slate-700/60 pb-2 mb-2 gap-1 overflow-x-auto text-xs">
                        <button onclick="filterEmojis('smileys')" class="px-2 py-1 bg-indigo-600 text-white rounded">😀</button>
                        <button onclick="filterEmojis('gestures')" class="px-2 py-1 bg-slate-800 text-slate-300 rounded">👍</button>
                        <button onclick="filterEmojis('hearts')" class="px-2 py-1 bg-slate-800 text-slate-300 rounded">❤️</button>
                        <button onclick="filterEmojis('food')" class="px-2 py-1 bg-slate-800 text-slate-300 rounded">🍕</button>
                        <button onclick="filterEmojis('objects')" class="px-2 py-1 bg-slate-800 text-slate-300 rounded">🎉</button>
                    </div>
                    <div id="emojiGrid" class="flex-1 grid grid-cols-6 gap-1 overflow-y-auto text-xl p-1 text-center cursor-pointer"></div>
                </div>

                <!-- Fixed Footer Input Bar -->
                <div class="p-3 glass-panel border-t border-slate-800/80 flex items-center gap-2 z-20 shrink-0 mb-safe">
                    <button onclick="toggleEmojiPicker(event)" class="p-2.5 text-slate-400 hover:text-indigo-400 rounded-xl hover:bg-slate-800/80 transition">
                        <i class="fa-regular fa-face-smile text-lg"></i>
                    </button>

                    <label class="p-2.5 text-slate-400 hover:text-indigo-400 rounded-xl hover:bg-slate-800/80 transition cursor-pointer">
                        <i class="fa-solid fa-image text-lg"></i>
                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                    </label>

                    <input type="text" id="messageInput" placeholder="Escribe un mensaje..." 
                        onkeydown="if(event.key === 'Enter') sendMessage()"
                        class="flex-1 bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">

                    <button id="micBtn" onclick="startRecording()" class="p-2.5 text-slate-400 hover:text-rose-400 rounded-xl hover:bg-slate-800/80 transition">
                        <i class="fa-solid fa-microphone text-lg"></i>
                    </button>
                    <button id="sendBtn" onclick="sendMessage()" class="p-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- Modals -->
    <div id="createUserModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
        <div class="max-w-xs w-full glass-modal rounded-2xl p-5 border border-slate-700">
            <h3 class="text-base font-bold text-white mb-3">Agregar Familiar</h3>
            <input type="text" id="newUserName" placeholder="Nombre" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white mb-3 focus:outline-none focus:border-indigo-500">
            <div class="flex justify-end gap-2">
                <button onclick="hideCreateUserModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-xs text-slate-300">Cancelar</button>
                <button onclick="createNewUser()" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-xs font-medium text-white">Guardar</button>
            </div>
        </div>
    </div>

    <div id="pinModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
        <div class="max-w-xs w-full glass-modal rounded-2xl p-5 border border-slate-700 text-center">
            <h3 class="text-base font-bold text-white mb-1">Configurar PIN</h3>
            <p class="text-xs text-slate-400 mb-4">Protege el acceso a tus chats</p>
            <input type="password" maxlength="4" id="pinInput" placeholder="PIN de 4 dígitos" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-center text-lg tracking-widest text-white mb-4 focus:outline-none focus:border-indigo-500">
            <div class="flex justify-center gap-2">
                <button onclick="togglePinModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-xs text-slate-300">Cancelar</button>
                <button onclick="savePin()" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-xs font-medium text-white">Guardar</button>
            </div>
        </div>
    </div>

    <div id="imageModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md" onclick="closeImageModal()">
        <img id="fullImage" src="" class="max-w-full max-h-full rounded-2xl shadow-2xl object-contain">
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby4ssw0UvXkbo7vovqvvubK7Aws8pVdc4C16C6cflDiBEMWU59sJB77LbeNsvz8QDlKuQ/exec';

        const DEFAULT_USERS = [
            { id: 'carlos', name: 'Carlos', role: 'Padre', avatar: '🧔‍♂️', color: 'bg-blue-600', pin: '' },
            { id: 'claudia', name: 'Claudia', role: 'Madre', avatar: '👩‍🦰', color: 'bg-rose-600', pin: '' },
            { id: 'melissa', name: 'Melissa', role: 'Hija', avatar: '👧', color: 'bg-purple-600', pin: '' },
            { id: 'cindy', name: 'Cindy', role: 'Hija', avatar: '👧', color: 'bg-amber-600', pin: '' },
            { id: 'heysel', name: 'Heysel', role: 'Hija', avatar: '👧', color: 'bg-emerald-600', pin: '' }
        ];

        const EMOJI_CATEGORIES = {
            smileys: ['😀','😂','😊','😍','😎','🥰','😉','🥳','🤔','🤩','😴','😭','😌','🤗','🙏','👍'],
            gestures: ['👍','👎','👏','🙌','🤝','👊','✌️','🤞','🤙','👋','💪','🫶','❤️','💖'],
            hearts: ['❤️','💖','💙','💚','💛','💜','🧡','🖤','🤍','❣️','💕','💞','💓'],
            food: ['🍕','🍔','🍟','🌭','🍿','🌮','🍱','🍦','🍩','🎂','☕️','🧃','🥤'],
            objects: ['🎉','🎊','🎈','🎁','⭐','🌟','🔥','💯','⚡️','📱','📷','🎧','🏆']
        };

        let users = [];
        let messages = [];
        let currentUser = null;
        let activeTab = 'group'; 
        let activeTargetId = 'group'; 
        let pendingImageData = null;
        let syncInterval = null;

        let mediaRecorder = null;
        let audioChunks = [];
        let recordStartTime = null;
        let recordTimerInterval = null;

        window.onload = () => {
            loadUsers();
            renderUserGrid();
            syncWithCloud();
            syncInterval = setInterval(syncWithCloud, 4000);

            document.addEventListener('click', (e) => {
                const picker = document.getElementById('emojiPicker');
                const emojiBtn = e.target.closest('button[onclick*="toggleEmojiPicker"]');
                if (picker && !picker.contains(e.target) && !emojiBtn) {
                    closeEmojiPicker();
                }
            });
        };

        function loadUsers() {
            const saved = localStorage.getItem('fc_users');
            if (saved) {
                try { users = JSON.parse(saved); } catch(e) { users = DEFAULT_USERS; }
            } else {
                users = DEFAULT_USERS;
                saveUsers();
            }
        }

        function saveUsers() {
            localStorage.setItem('fc_users', JSON.stringify(users));
        }

        async function syncWithCloud() {
            const syncIcon = document.getElementById('syncIcon');
            if(syncIcon) syncIcon.classList.add('fa-spin');

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                if (data.status === "success" && Array.isArray(data.messages)) {
                    messages = data.messages;
                    if (currentUser) {
                        renderMessages();
                        renderChatList();
                    }
                }
            } catch (error) {
                console.log('Error de sincronización:', error);
            } finally {
                if(syncIcon) syncIcon.classList.remove('fa-spin');
            }
        }

        async function postMessageToCloud(msg) {
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "sendMessage", message: msg })
                });
                setTimeout(syncWithCloud, 1000);
            } catch (error) {
                console.log('Error al enviar mensaje:', error);
            }
        }

        function renderUserGrid() {
            const grid = document.getElementById('usersGrid');
            grid.innerHTML = users.map(user => `
                <div onclick="selectUser('${user.id}')" class="glass-panel hover:bg-slate-800/80 p-3.5 rounded-xl border border-slate-800 hover:border-indigo-500/50 cursor-pointer transition text-center group">
                    <div class="w-12 h-12 ${user.color} rounded-full flex items-center justify-center text-xl mx-auto mb-2 shadow-md group-hover:scale-105 transition-transform">
                        ${user.avatar}
                    </div>
                    <div class="font-semibold text-slate-100 text-sm truncate">${user.name}</div>
                    <div class="text-[10px] text-slate-400">${user.pin ? '🔒 Con PIN' : user.role || 'Familia'}</div>
                </div>
            `).join('');
        }

        function selectUser(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;

            if (user.pin) {
                const enteredPin = prompt(`Ingrese el PIN de acceso para ${user.name}:`);
                if (enteredPin !== user.pin) {
                    alert('PIN incorrecto');
                    return;
                }
            }

            currentUser = user;
            document.getElementById('currentUserName').innerText = user.name;
            document.getElementById('currentUserAvatar').innerText = user.avatar;
            document.getElementById('currentUserAvatar').className = `w-10 h-10 rounded-full flex items-center justify-center text-lg shadow-md ${user.color}`;

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');

            renderChatList();
            openChat('group');
        }

        function switchUser() {
            currentUser = null;
            document.getElementById('chatScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function showCreateUserModal() { document.getElementById('createUserModal').classList.remove('hidden'); }
        function hideCreateUserModal() { document.getElementById('createUserModal').classList.add('hidden'); }

        function createNewUser() {
            const nameInput = document.getElementById('newUserName');
            const name = nameInput.value.trim();
            if (!name) return;

            const newUser = {
                id: 'user_' + Date.now(),
                name: name,
                role: 'Familia',
                avatar: '👤',
                color: 'bg-indigo-600',
                pin: ''
            };

            users.push(newUser);
            saveUsers();
            renderUserGrid();
            nameInput.value = '';
            hideCreateUserModal();
        }

        function togglePinModal() {
            const modal = document.getElementById('pinModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('pinInput').value = currentUser.pin || '';
            }
        }

        function savePin() {
            const pin = document.getElementById('pinInput').value.trim();
            currentUser.pin = pin;
            saveUsers();
            renderUserGrid();
            togglePinModal();
            alert('PIN guardado correctamente');
        }

        function switchTab(tab) {
            activeTab = tab;
            const btnGroup = document.getElementById('tabGroup');
            const btnPrivate = document.getElementById('tabPrivate');

            if (tab === 'group') {
                btnGroup.className = "flex-1 py-2 rounded-lg font-medium bg-indigo-600 text-white transition flex items-center justify-center gap-2 shadow-sm";
                btnPrivate.className = "flex-1 py-2 rounded-lg font-medium bg-slate-800/60 text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-2";
            } else {
                btnPrivate.className = "flex-1 py-2 rounded-lg font-medium bg-indigo-600 text-white transition flex items-center justify-center gap-2 shadow-sm";
                btnGroup.className = "flex-1 py-2 rounded-lg font-medium bg-slate-800/60 text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-2";
            }

            renderChatList();
        }

        function renderChatList() {
            const list = document.getElementById('chatList');
            if (activeTab === 'group') {
                list.innerHTML = `
                    <div onclick="openChat('group')" class="p-3 rounded-xl ${activeTargetId === 'group' ? 'bg-indigo-600/20 border border-indigo-500/40' : 'hover:bg-slate-800/50'} cursor-pointer transition flex items-center gap-3">
                        <div class="w-11 h-11 bg-gradient-to-tr from-indigo-500 to-cyan-400 rounded-full flex items-center justify-center text-white text-lg shadow-md">👥</div>
                        <div class="flex-1 overflow-hidden">
                            <h4 class="font-bold text-slate-200 text-sm truncate">Chat Familiar</h4>
                            <p class="text-xs text-slate-400 truncate">Mensajes grupales</p>
                        </div>
                    </div>
                `;
            } else {
                const otherUsers = users.filter(u => u.id !== currentUser.id);
                list.innerHTML = otherUsers.map(u => {
                    const unreadCount = getUnreadCountFor(u.id);
                    return `
                        <div onclick="openChat('${u.id}')" class="p-3 rounded-xl ${activeTargetId === u.id ? 'bg-indigo-600/20 border border-indigo-500/40' : 'hover:bg-slate-800/50'} cursor-pointer transition flex items-center justify-between">
                            <div class="flex items-center gap-3 overflow-hidden">
                                <div class="w-11 h-11 ${u.color} rounded-full flex items-center justify-center text-white text-lg shadow-md">${u.avatar}</div>
                                <div class="overflow-hidden">
                                    <h4 class="font-bold text-slate-200 text-sm truncate">${u.name}</h4>
                                    <p class="text-xs text-slate-400 truncate">Chat Privado</p>
                                </div>
                            </div>
                            ${unreadCount > 0 ? `<span class="bg-indigo-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">${unreadCount}</span>` : ''}
                        </div>
                    `;
                }).join('');
            }
        }

        function getUnreadCountFor(targetUserId) {
            return messages.filter(m => m.isPrivate && m.senderId === targetUserId && m.receiverId === currentUser.id && !m.read).length;
        }

        function openChat(targetId) {
            activeTargetId = targetId;
            renderChatList();

            const chatArea = document.getElementById('chatArea');
            chatArea.classList.remove('hidden');

            const headerName = document.getElementById('targetName');
            const headerAvatar = document.getElementById('targetAvatar');
            const headerStatus = document.getElementById('targetStatus');

            if (targetId === 'group') {
                headerName.innerText = "Chat Familiar";
                headerAvatar.innerText = "👥";
                headerAvatar.className = "w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center text-white shadow-md";
                headerStatus.innerText = "Conectado a Google Sheets";
            } else {
                const targetUser = users.find(u => u.id === targetId);
                headerName.innerText = targetUser.name;
                headerAvatar.innerText = targetUser.avatar;
                headerAvatar.className = `w-10 h-10 rounded-full ${targetUser.color} flex items-center justify-center text-white shadow-md`;
                headerStatus.innerText = "Mensaje directo privado";
            }

            renderMessages();
        }

        function closeMobileChat() {
            document.getElementById('chatArea').classList.add('hidden');
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            const currentFilteredMessages = messages.filter(m => {
                if (activeTargetId === 'group') {
                    return !m.isPrivate;
                } else {
                    return m.isPrivate && ((m.senderId === currentUser.id && m.receiverId === activeTargetId) || (m.senderId === activeTargetId && m.receiverId === currentUser.id));
                }
            });

            currentFilteredMessages.forEach(msg => {
                const isMe = msg.senderId === currentUser.id;
                const sender = users.find(u => u.id === msg.senderId) || { name: 'Familiar', avatar: '👤', color: 'bg-slate-700' };

                const msgDiv = document.createElement('div');
                msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1`;

                let contentHtml = '';

                if (msg.text) {
                    contentHtml += `<p class="text-sm leading-relaxed">${escapeHtml(msg.text)}</p>`;
                }

                if (msg.image) {
                    contentHtml += `<img src="${msg.image}" onclick="openImageModal('${msg.image}')" class="max-w-xs max-h-60 rounded-lg cursor-pointer hover:opacity-90 transition mt-1 border border-slate-700/50">`;
                }

                if (msg.audio) {
                    contentHtml += `
                        <div class="flex items-center gap-2 mt-1 bg-slate-900/60 p-2 rounded-lg border border-slate-700/40">
                            <audio controls src="${msg.audio}" class="h-8 max-w-[200px]"></audio>
                        </div>
                    `;
                }

                msgDiv.innerHTML = `
                    <div class="flex items-end gap-2 max-w-[85%] ${isMe ? 'flex-row-reverse' : 'flex-row'}">
                        <div class="w-7 h-7 rounded-full ${sender.color} flex items-center justify-center text-xs text-white shrink-0 shadow">
                            ${sender.avatar}
                        </div>
                        <div class="p-3 rounded-2xl ${isMe ? 'bg-indigo-600 text-white rounded-br-xs' : 'glass-panel text-slate-100 rounded-bl-xs border border-slate-800'} shadow-md">
                            ${!isMe && activeTargetId === 'group' ? `<div class="text-[11px] font-bold text-indigo-400 mb-1">${sender.name}</div>` : ''}
                            ${contentHtml}
                            <div class="text-[9px] ${isMe ? 'text-indigo-200' : 'text-slate-400'} text-right mt-1">${msg.time}</div>
                        </div>
                    </div>
                `;

                container.appendChild(msgDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text && !pendingImageData) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newMsg = {
                id: 'msg_' + Date.now(),
                senderId: currentUser.id,
                receiverId: activeTargetId === 'group' ? null : activeTargetId,
                isPrivate: activeTargetId !== 'group',
                text: text,
                image: pendingImageData,
                audio: null,
                time: timeStr,
                read: false
            };

            messages.push(newMsg);
            renderMessages();
            postMessageToCloud(newMsg);

            input.value = '';
            cancelImageUpload();
            closeEmojiPicker();
        }

        function toggleEmojiPicker(e) {
            e.stopPropagation();
            const picker = document.getElementById('emojiPicker');
            if (picker.classList.contains('hidden')) {
                picker.classList.remove('hidden');
                setTimeout(() => {
                    picker.classList.remove('scale-95', 'opacity-0');
                    picker.classList.add('scale-100', 'opacity-100');
                }, 10);
                filterEmojis('smileys');
            } else {
                closeEmojiPicker();
            }
        }

        function closeEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            if (!picker) return;
            picker.classList.remove('scale-100', 'opacity-100');
            picker.classList.add('scale-95', 'opacity-0');
            setTimeout(() => picker.classList.add('hidden'), 150);
        }

        function filterEmojis(category) {
            const grid = document.getElementById('emojiGrid');
            const list = EMOJI_CATEGORIES[category] || EMOJI_CATEGORIES.smileys;
            grid.innerHTML = list.map(emoji => `<span onclick="insertEmoji('${emoji}')" class="hover:bg-slate-800 p-1 rounded transition select-none">${emoji}</span>`).join('');
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            const start = input.selectionStart || input.value.length;
            const end = input.selectionEnd || input.value.length;
            
            input.value = input.value.substring(0, start) + emoji + input.value.substring(end);
            input.focus();
            input.setSelectionRange(start + emoji.length, start + emoji.length);
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                pendingImageData = e.target.result;
                document.getElementById('imagePreview').src = pendingImageData;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function cancelImageUpload() {
            pendingImageData = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        function openImageModal(src) {
            document.getElementById('fullImage').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        async function startRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Tu navegador no soporta grabación de audio');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.start();
                recordStartTime = Date.now();

                document.getElementById('recordingBar').classList.remove('hidden');
                recordTimerInterval = setInterval(updateRecordingTimer, 1000);
            } catch (err) {
                alert('No se pudo acceder al micrófono');
            }
        }

        function updateRecordingTimer() {
            const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            document.getElementById('recordingTimer').innerText = `${mins}:${secs}`;
        }

        function cancelRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            clearInterval(recordTimerInterval);
            document.getElementById('recordingBar').classList.add('hidden');
        }

        function stopAndSendVoice() {
            if (!mediaRecorder) return;

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onloadend = () => {
                    const audioBase64 = reader.result;
                    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    const newMsg = {
                        id: 'msg_' + Date.now(),
                        senderId: currentUser.id,
                        receiverId: activeTargetId === 'group' ? null : activeTargetId,
                        isPrivate: activeTargetId !== 'group',
                        text: '',
                        image: null,
                        audio: audioBase64,
                        time: timeStr,
                        read: false
                    };

                    messages.push(newMsg);
                    renderMessages();
                    postMessageToCloud(newMsg);
                };
                reader.readAsDataURL(audioBlob);
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            };

            mediaRecorder.stop();
            clearInterval(recordTimerInterval);
            document.getElementById('recordingBar').classList.add('hidden');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
