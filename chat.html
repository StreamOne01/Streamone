<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FamilyChat Private - Mensajería Familiar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-modal {
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        html, body {
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            background-color: #020617;
        }

        /* Safe padding for mobile bottom bar */
        .pb-safe {
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
        }
    </style>
</head>
<body class="text-slate-100 font-sans select-none flex flex-col justify-between">

    <!-- APP CONTAINER -->
    <div id="app" class="relative w-full h-[100dvh] flex flex-col overflow-hidden">

        <!-- SCREEN 1: LOGIN / SELECT PROFILE -->
        <div id="loginScreen" class="absolute inset-0 z-50 flex flex-col items-center justify-center p-4 bg-slate-950 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 overflow-y-auto">
            <div class="max-w-md w-full glass-modal rounded-3xl p-6 shadow-2xl border border-slate-800 text-center">
                <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-cyan-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-users text-3xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white mb-1">FamilyChat Private</h1>
                <p class="text-slate-400 text-sm mb-6">Selecciona tu perfil para ingresar</p>

                <div id="usersGrid" class="grid grid-cols-2 gap-3 mb-6"></div>

                <button onclick="showCreateUserModal()" class="w-full py-3 px-4 rounded-2xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-sm font-medium border border-slate-700/60 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus text-indigo-400"></i> Agregar integrante
                </button>
            </div>
        </div>

        <!-- SCREEN 2: MAIN CHAT INTERFACE (VERTICAL MOBILE FULLSCREEN) -->
        <div id="chatScreen" class="hidden absolute inset-0 flex flex-col h-[100dvh] w-full overflow-hidden bg-slate-950">

            <!-- TOP HEADER WITH DROPDOWN MENU -->
            <div class="glass-panel px-3 py-2.5 flex items-center justify-between z-30 shrink-0 shadow-lg">
                <div class="flex items-center gap-2.5 overflow-hidden">
                    <div id="currentHeaderAvatar" class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm shadow-md bg-blue-600 shrink-0">🧔‍♂️</div>
                    <div class="overflow-hidden">
                        <div class="flex items-center gap-1.5">
                            <h2 id="currentHeaderName" class="font-bold text-slate-100 text-sm truncate">Carlos</h2>
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
                        </div>
                        <p id="activeChatSubtitle" class="text-[10px] text-indigo-400 font-medium truncate">Chat Familiar</p>
                    </div>
                </div>

                <div class="flex items-center gap-1.5 shrink-0">
                    <button onclick="toggleDropdownMenu(event)" class="px-2.5 py-1.5 bg-slate-800/90 hover:bg-slate-700 rounded-xl text-xs font-semibold text-slate-200 border border-slate-700/80 transition flex items-center gap-1.5 shadow">
                        <i class="fa-solid fa-bars text-indigo-400"></i> <span>Chats</span>
                    </button>
                    <button onclick="syncWithCloud()" title="Sincronizar" class="p-2 text-slate-400 hover:text-indigo-400 rounded-xl transition">
                        <i id="syncIcon" class="fa-solid fa-rotate text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- DROPDOWN MENU PANEL -->
            <div id="dropdownMenu" class="absolute top-14 right-2 z-40 hidden w-64 glass-modal rounded-2xl p-2.5 shadow-2xl border border-slate-700 flex-col gap-1.5 transition-all duration-200">
                <div class="text-[10px] font-bold text-slate-400 px-2 py-0.5 uppercase tracking-wider">Conversaciones</div>
                <div id="dropdownChatList" class="flex flex-col gap-1 max-h-60 overflow-y-auto"></div>
                <div class="border-t border-slate-800 pt-2 mt-1 flex justify-between gap-1">
                    <button onclick="togglePinModal()" class="flex-1 py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl flex items-center justify-center gap-1">
                        <i class="fa-solid fa-key text-indigo-400"></i> PIN
                    </button>
                    <button onclick="switchUser()" class="flex-1 py-1.5 px-2 bg-rose-950/60 hover:bg-rose-900/60 text-rose-300 text-xs rounded-xl flex items-center justify-center gap-1 border border-rose-900/40">
                        <i class="fa-solid fa-right-from-bracket"></i> Salir
                    </button>
                </div>
            </div>

            <!-- MESSAGES CONTAINER -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto p-3 space-y-3 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px]"></div>

            <!-- PREVIEWS -->
            <div id="imagePreviewContainer" class="hidden px-3 py-1.5 bg-slate-900 border-t border-slate-800 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                    <img id="imagePreview" src="" class="w-10 h-10 object-cover rounded-lg border border-slate-700">
                    <span class="text-xs text-slate-300">Imagen lista</span>
                </div>
                <button onclick="cancelImageUpload()" class="p-1 text-slate-400 hover:text-rose-400">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div id="recordingBar" class="hidden px-3 py-2 bg-rose-950/50 border-t border-rose-900/50 flex items-center justify-between animate-pulse shrink-0">
                <div class="flex items-center gap-2 text-rose-400">
                    <div class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></div>
                    <span class="text-xs font-semibold">Grabando...</span>
                    <span id="recordingTimer" class="text-xs font-mono bg-rose-900/60 px-1.5 py-0.5 rounded text-rose-200">00:00</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <button onclick="cancelRecording()" class="px-2.5 py-1 text-xs rounded-lg bg-slate-800 text-slate-300">Cancelar</button>
                    <button onclick="stopAndSendVoice()" class="px-2.5 py-1 text-xs rounded-lg bg-rose-600 text-white font-medium shadow">Enviar</button>
                </div>
            </div>

            <!-- EMOJI PICKER POPUP -->
            <div id="emojiPicker" class="absolute bottom-16 left-2 z-40 hidden w-64 h-56 glass-modal rounded-2xl p-2.5 shadow-2xl border border-slate-700/80 flex-col">
                <div class="flex border-b border-slate-700/60 pb-1.5 mb-1.5 gap-1 overflow-x-auto text-xs">
                    <button onclick="filterEmojis('smileys')" class="px-2 py-1 bg-indigo-600 text-white rounded">😀</button>
                    <button onclick="filterEmojis('gestures')" class="px-2 py-1 bg-slate-800 text-slate-300 rounded">👍</button>
                    <button onclick="filterEmojis('hearts')" class="px-2 py-1 bg-slate-800 text-slate-300 rounded">❤️</button>
                    <button onclick="filterEmojis('food')" class="px-2 py-1 bg-slate-800 text-slate-300 rounded">🍕</button>
                    <button onclick="filterEmojis('objects')" class="px-2 py-1 bg-slate-800 text-slate-300 rounded">🎉</button>
                </div>
                <div id="emojiGrid" class="flex-1 grid grid-cols-5 gap-1 overflow-y-auto text-lg p-1 text-center cursor-pointer"></div>
            </div>

            <!-- COMPACT FOOTER INPUT BAR (100% VISIBLE SEND BUTTON) -->
            <div class="glass-panel px-2 py-2 flex items-center gap-1.5 z-20 shrink-0 pb-safe border-t border-slate-800/80">
                <button onclick="toggleEmojiPicker(event)" class="p-2 text-slate-400 hover:text-indigo-400 rounded-lg hover:bg-slate-800/60 shrink-0">
                    <i class="fa-regular fa-face-smile text-base"></i>
                </button>

                <label class="p-2 text-slate-400 hover:text-indigo-400 rounded-lg hover:bg-slate-800/60 shrink-0 cursor-pointer">
                    <i class="fa-solid fa-image text-base"></i>
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                </label>

                <input type="text" id="messageInput" placeholder="Escribe..." 
                    onkeydown="if(event.key === 'Enter') sendMessage()"
                    class="flex-1 min-w-0 bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">

                <button id="micBtn" onclick="startRecording()" class="p-2 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-800/60 shrink-0">
                    <i class="fa-solid fa-microphone text-base"></i>
                </button>
                
                <!-- Enviar button strictly pinned & visible -->
                <button id="sendBtn" onclick="sendMessage()" class="p-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-xl shadow-lg shadow-indigo-600/30 shrink-0 flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </div>

        </div>

    </div>

    <!-- MODALS -->
    <div id="createUserModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
        <div class="max-w-xs w-full glass-modal rounded-3xl p-5 border border-slate-700">
            <h3 class="text-base font-bold text-white mb-3">Agregar Familiar</h3>
            <input type="text" id="newUserName" placeholder="Nombre" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-3.5 py-2.5 text-sm text-white mb-3 focus:outline-none focus:border-indigo-500">
            <div class="flex justify-end gap-2">
                <button onclick="hideCreateUserModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 text-xs text-slate-300">Cancelar</button>
                <button onclick="createNewUser()" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-xs font-medium text-white">Guardar</button>
            </div>
        </div>
    </div>

    <div id="pinModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
        <div class="max-w-xs w-full glass-modal rounded-3xl p-5 border border-slate-700 text-center">
            <h3 class="text-base font-bold text-white mb-1">Configurar PIN</h3>
            <p class="text-xs text-slate-400 mb-4">Protege tus chats privados</p>
            <input type="password" maxlength="4" id="pinInput" placeholder="PIN de 4 dígitos" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-3 py-2.5 text-center text-lg tracking-widest text-white mb-4 focus:outline-none focus:border-indigo-500">
            <div class="flex justify-center gap-2">
                <button onclick="togglePinModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 text-xs text-slate-300">Cancelar</button>
                <button onclick="savePin()" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-xs font-medium text-white">Guardar</button>
            </div>
        </div>
    </div>

    <div id="imageModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md" onclick="closeImageModal()">
        <img id="fullImage" src="" class="max-w-full max-h-full rounded-2xl shadow-2xl object-contain">
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby4ssw0UvXkbo7vovqvvubK7Aws8pVdc4C16C6cflDiBEMWU59sJB77LbeNsvz8QDlKuQ/exec';

        const DEFAULT_USERS = [
            { id: 'carlos', name: 'Carlos', role: 'Padre', avatar: '🧔‍♂️', color: 'bg-blue-600', pin: '' },
            { id: 'claudia', name: 'Claudia', role: 'Madre', avatar: '👩‍🦰', color: 'bg-rose-600', pin: '' },
            { id: 'melissa', name: 'Melissa', role: 'Hija', avatar: '👧', color: 'bg-purple-600', pin: '' },
            { id: 'cindy', name: 'Cindy', role: 'Hija', avatar: '👧', color: 'bg-amber-600', pin: '' },
            { id: 'heysel', name: 'Heysel', role: 'Hija', avatar: '👧', color: 'bg-emerald-600', pin: '' }
        ];

        const EMOJI_CATEGORIES = {
            smileys: ['😀','😂','😊','😍','😎','🥰','😉','🥳','🤔','🤩','😴','😭','😌','🤗','🙏','👍'],
            gestures: ['👍','👎','👏','🙌','🤝','👊','✌️','🤞','🤙','👋','💪','🫶','❤️','💖'],
            hearts: ['❤️','💖','💙','💚','💛','💜','🧡','🖤','🤍','❣️','💕','💞','💓'],
            food: ['🍕','🍔','🍟','🌭','🍿','🌮','🍱','🍦','🍩','🎂','☕️','🧃','🥤'],
            objects: ['🎉','🎊','🎈','🎁','⭐','🌟','🔥','💯','⚡️','📱','📷','🎧','🏆']
        };

        let users = [];
        let messages = [];
        let currentUser = null;
        let activeTargetId = 'group'; 
        let pendingImageData = null;
        let syncInterval = null;

        let mediaRecorder = null;
        let audioChunks = [];
        let recordStartTime = null;
        let recordTimerInterval = null;

        window.onload = () => {
            loadUsers();
            renderUserGrid();
            syncWithCloud();
            syncInterval = setInterval(syncWithCloud, 4000);

            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('dropdownMenu');
                const menuBtn = e.target.closest('button[onclick*="toggleDropdownMenu"]');
                if (dropdown && !dropdown.contains(e.target) && !menuBtn) {
                    dropdown.classList.add('hidden');
                }

                const picker = document.getElementById('emojiPicker');
                const emojiBtn = e.target.closest('button[onclick*="toggleEmojiPicker"]');
                if (picker && !picker.contains(e.target) && !emojiBtn) {
                    picker.classList.add('hidden');
                }
            });
        };

        function loadUsers() {
            const saved = localStorage.getItem('fc_users');
            if (saved) {
                try { users = JSON.parse(saved); } catch(e) { users = DEFAULT_USERS; }
            } else {
                users = DEFAULT_USERS;
                saveUsers();
            }
        }

        function saveUsers() {
            localStorage.setItem('fc_users', JSON.stringify(users));
        }

        async function syncWithCloud() {
            const syncIcon = document.getElementById('syncIcon');
            if(syncIcon) syncIcon.classList.add('fa-spin');

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                if (data.status === "success" && Array.isArray(data.messages)) {
                    messages = data.messages;
                    if (currentUser) {
                        renderMessages();
                        renderDropdownChatList();
                    }
                }
            } catch (error) {
                console.log('Error de sincronización:', error);
            } finally {
                if(syncIcon) syncIcon.classList.remove('fa-spin');
            }
        }

        async function postMessageToCloud(msg) {
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "sendMessage", message: msg })
                });
                setTimeout(syncWithCloud, 1000);
            } catch (error) {
                console.log('Error al enviar mensaje:', error);
            }
        }

        function renderUserGrid() {
            const grid = document.getElementById('usersGrid');
            grid.innerHTML = users.map(user => `
                <div onclick="selectUser('${user.id}')" class="glass-panel hover:bg-slate-800/80 p-3.5 rounded-2xl border border-slate-800 hover:border-indigo-500/50 cursor-pointer transition text-center group">
                    <div class="w-12 h-12 ${user.color} rounded-full flex items-center justify-center text-xl mx-auto mb-2 shadow-md group-hover:scale-105 transition-transform">
                        ${user.avatar}
                    </div>
                    <div class="font-semibold text-slate-100 text-sm truncate">${user.name}</div>
                    <div class="text-[10px] text-slate-400">${user.pin ? '🔒 Con PIN' : user.role || 'Familia'}</div>
                </div>
            `).join('');
        }

        function selectUser(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;

            if (user.pin) {
                const enteredPin = prompt(`Ingrese el PIN de acceso para ${user.name}:`);
                if (enteredPin !== user.pin) {
                    alert('PIN incorrecto');
                    return;
                }
            }

            currentUser = user;
            document.getElementById('currentHeaderName').innerText = user.name;
            document.getElementById('currentHeaderAvatar').innerText = user.avatar;
            document.getElementById('currentHeaderAvatar').className = `w-9 h-9 rounded-full flex items-center justify-center text-white text-sm shadow-md shrink-0 ${user.color}`;

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');

            openChat('group');
        }

        function switchUser() {
            currentUser = null;
            document.getElementById('chatScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function showCreateUserModal() { document.getElementById('createUserModal').classList.remove('hidden'); }
        function hideCreateUserModal() { document.getElementById('createUserModal').classList.add('hidden'); }

        function createNewUser() {
            const nameInput = document.getElementById('newUserName');
            const name = nameInput.value.trim();
            if (!name) return;

            const newUser = {
                id: 'user_' + Date.now(),
                name: name,
                role: 'Familia',
                avatar: '👤',
                color: 'bg-indigo-600',
                pin: ''
            };

            users.push(newUser);
            saveUsers();
            renderUserGrid();
            nameInput.value = '';
            hideCreateUserModal();
        }

        function togglePinModal() {
            const modal = document.getElementById('pinModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('pinInput').value = currentUser.pin || '';
            }
        }

        function savePin() {
            const pin = document.getElementById('pinInput').value.trim();
            currentUser.pin = pin;
            saveUsers();
            renderUserGrid();
            togglePinModal();
            alert('PIN guardado correctamente');
        }

        function toggleDropdownMenu(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('dropdownMenu');
            dropdown.classList.toggle('hidden');
            if (!dropdown.classList.contains('hidden')) {
                renderDropdownChatList();
            }
        }

        function renderDropdownChatList() {
            const list = document.getElementById('dropdownChatList');
            let html = `
                <div onclick="openChat('group')" class="p-2 rounded-xl ${activeTargetId === 'group' ? 'bg-indigo-600/30 border border-indigo-500/50' : 'hover:bg-slate-800/60'} cursor-pointer transition flex items-center gap-2.5">
                    <div class="w-7 h-7 bg-gradient-to-tr from-indigo-500 to-cyan-400 rounded-full flex items-center justify-center text-white text-xs shadow shrink-0">👥</div>
                    <div class="flex-1 overflow-hidden">
                        <h4 class="font-bold text-slate-100 text-xs truncate">Chat Familiar</h4>
                        <p class="text-[9px] text-slate-400">Grupo general</p>
                    </div>
                </div>
            `;

            const otherUsers = users.filter(u => u.id !== currentUser.id);
            otherUsers.forEach(u => {
                const unread = messages.filter(m => m.isPrivate && m.senderId === u.id && m.receiverId === currentUser.id && !m.read).length;
                html += `
                    <div onclick="openChat('${u.id}')" class="p-2 rounded-xl ${activeTargetId === u.id ? 'bg-indigo-600/30 border border-indigo-500/50' : 'hover:bg-slate-800/60'} cursor-pointer transition flex items-center justify-between">
                        <div class="flex items-center gap-2.5 overflow-hidden">
                            <div class="w-7 h-7 ${u.color} rounded-full flex items-center justify-center text-white text-xs shadow shrink-0">${u.avatar}</div>
                            <div class="overflow-hidden">
                                <h4 class="font-bold text-slate-100 text-xs truncate">${u.name}</h4>
                                <p class="text-[9px] text-slate-400">Chat Privado</p>
                            </div>
                        </div>
                        ${unread > 0 ? `<span class="bg-indigo-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full">${unread}</span>` : ''}
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        function openChat(targetId) {
            activeTargetId = targetId;
            document.getElementById('dropdownMenu').classList.add('hidden');

            const subtitle = document.getElementById('activeChatSubtitle');

            if (targetId === 'group') {
                subtitle.innerText = "Chat Familiar (Grupo)";
            } else {
                const targetUser = users.find(u => u.id === targetId);
                subtitle.innerText = `Privado con ${targetUser.name}`;
            }

            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            const currentFilteredMessages = messages.filter(m => {
                if (activeTargetId === 'group') {
                    return !m.isPrivate;
                } else {
                    return m.isPrivate && ((m.senderId === currentUser.id && m.receiverId === activeTargetId) || (m.senderId === activeTargetId && m.receiverId === currentUser.id));
                }
            });

            currentFilteredMessages.forEach(msg => {
                const isMe = msg.senderId === currentUser.id;
                const sender = users.find(u => u.id === msg.senderId) || { name: 'Familiar', avatar: '👤', color: 'bg-slate-700' };

                const msgDiv = document.createElement('div');
                msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1`;

                let contentHtml = '';
                if (msg.text) {
                    contentHtml += `<p class="text-sm leading-relaxed">${escapeHtml(msg.text)}</p>`;
                }
                if (msg.image) {
                    contentHtml += `<img src="${msg.image}" onclick="openImageModal('${msg.image}')" class="max-w-xs max-h-56 rounded-xl cursor-pointer hover:opacity-90 transition mt-1 border border-slate-700/50">`;
                }
                if (msg.audio) {
                    contentHtml += `
                        <div class="flex items-center gap-2 mt-1 bg-slate-900/60 p-2 rounded-xl border border-slate-700/40">
                            <audio controls src="${msg.audio}" class="h-8 max-w-[180px]"></audio>
                        </div>
                    `;
                }

                msgDiv.innerHTML = `
                    <div class="flex items-end gap-1.5 max-w-[90%] ${isMe ? 'flex-row-reverse' : 'flex-row'}">
                        <div class="w-6 h-6 rounded-full ${sender.color} flex items-center justify-center text-[10px] text-white shrink-0 shadow">
                            ${sender.avatar}
                        </div>
                        <div class="p-2.5 rounded-2xl ${isMe ? 'bg-indigo-600 text-white rounded-br-xs' : 'glass-panel text-slate-100 rounded-bl-xs border border-slate-800'} shadow-md">
                            ${!isMe && activeTargetId === 'group' ? `<div class="text-[10px] font-bold text-indigo-400 mb-0.5">${sender.name}</div>` : ''}
                            ${contentHtml}
                            <div class="text-[9px] ${isMe ? 'text-indigo-200' : 'text-slate-400'} text-right mt-1">${msg.time}</div>
                        </div>
                    </div>
                `;

                container.appendChild(msgDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text && !pendingImageData) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newMsg = {
                id: 'msg_' + Date.now(),
                senderId: currentUser.id,
                receiverId: activeTargetId === 'group' ? null : activeTargetId,
                isPrivate: activeTargetId !== 'group',
                text: text,
                image: pendingImageData,
                audio: null,
                time: timeStr,
                read: false
            };

            messages.push(newMsg);
            renderMessages();
            postMessageToCloud(newMsg);

            input.value = '';
            cancelImageUpload();
            closeEmojiPicker();
        }

        function toggleEmojiPicker(e) {
            e.stopPropagation();
            const picker = document.getElementById('emojiPicker');
            picker.classList.toggle('hidden');
            if (!picker.classList.contains('hidden')) {
                filterEmojis('smileys');
            }
        }

        function closeEmojiPicker() {
            document.getElementById('emojiPicker').classList.add('hidden');
        }

        function filterEmojis(category) {
            const grid = document.getElementById('emojiGrid');
            const list = EMOJI_CATEGORIES[category] || EMOJI_CATEGORIES.smileys;
            grid.innerHTML = list.map(emoji => `<span onclick="insertEmoji('${emoji}')" class="hover:bg-slate-800 p-1 rounded transition select-none">${emoji}</span>`).join('');
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            const start = input.selectionStart || input.value.length;
            const end = input.selectionEnd || input.value.length;
            
            input.value = input.value.substring(0, start) + emoji + input.value.substring(end);
            input.focus();
            input.setSelectionRange(start + emoji.length, start + emoji.length);
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                pendingImageData = e.target.result;
                document.getElementById('imagePreview').src = pendingImageData;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function cancelImageUpload() {
            pendingImageData = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        function openImageModal(src) {
            document.getElementById('fullImage').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        async function startRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Tu navegador no soporta grabación de audio');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.start();
                recordStartTime = Date.now();

                document.getElementById('recordingBar').classList.remove('hidden');
                recordTimerInterval = setInterval(updateRecordingTimer, 1000);
            } catch (err) {
                alert('No se pudo acceder al micrófono');
            }
        }

        function updateRecordingTimer() {
            const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            document.getElementById('recordingTimer').innerText = `${mins}:${secs}`;
        }

        function cancelRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            clearInterval(recordTimerInterval);
            document.getElementById('recordingBar').classList.add('hidden');
        }

        function stopAndSendVoice() {
            if (!mediaRecorder) return;

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onloadend = () => {
                    const audioBase64 = reader.result;
                    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    const newMsg = {
                        id: 'msg_' + Date.now(),
                        senderId: currentUser.id,
                        receiverId: activeTargetId === 'group' ? null : activeTargetId,
                        isPrivate: activeTargetId !== 'group',
                        text: '',
                        image: null,
                        audio: audioBase64,
                        time: timeStr,
                        read: false
                    };

                    messages.push(newMsg);
                    renderMessages();
                    postMessageToCloud(newMsg);
                };
                reader.readAsDataURL(audioBlob);
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            };

            mediaRecorder.stop();
            clearInterval(recordTimerInterval);
            document.getElementById('recordingBar').classList.add('hidden');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
