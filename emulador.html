<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TRINCHERAS HANDHELD - 60FPS Turbo Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100svh;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      font-family: 'Outfit', sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .console-casing {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      max-width: 920px;
      max-height: min(100svh, 450px);
      background: linear-gradient(135deg, #3b5bdb 0%, #2b3990 60%, #1e2563 100%);
      box-shadow: 
        inset 0 3px 6px rgba(255, 255, 255, 0.4),
        inset 0 -6px 12px rgba(0, 0, 0, 0.7),
        0 20px 40px rgba(0, 0, 0, 0.8);
      border: 3px solid #1a2252;
      border-radius: 0;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      position: relative;
      transform: translateZ(0);
      will-change: transform;
    }

    @media (min-width: 650px) {
      .console-casing {
        border-radius: 36px;
        height: auto;
        aspect-ratio: 16 / 7.2;
        max-height: 500px;
        padding: 12px 18px;
      }
    }

    .lcd-font {
      font-family: 'Press Start 2P', monospace;
    }

    .shoulder-trigger {
      background: linear-gradient(180deg, #4c6ef5 0%, #2b3990 100%);
      border: 2px solid #1a2252;
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.4), 0 3px 6px rgba(0,0,0,0.5);
    }
    .shoulder-trigger:active, .shoulder-trigger.pressed {
      transform: translateY(2px);
    }

    .lcd-frame {
      background: #0b0f19;
      border: 3px solid #151b2b;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.9);
      border-radius: 12px;
    }

    .lcd-screen {
      background-color: #000;
      position: relative;
    }

    .glass-glare {
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.01) 40%, transparent 40%);
      pointer-events: none;
    }

    .switch-btn {
      background: linear-gradient(145deg, #f8f9fa, #e9ecef);
      color: #343a40;
      box-shadow: 
        0 3px 0 #adb5bd,
        0 5px 8px rgba(0, 0, 0, 0.35),
        inset 0 2px 2px rgba(255, 255, 255, 0.8);
      transition: transform 0.03s ease;
      border: 1px solid #ced4da;
    }
    .switch-btn:active, .switch-btn.pressed {
      transform: translateY(2px);
      box-shadow: 
        0 1px 0 #adb5bd,
        0 2px 4px rgba(0, 0, 0, 0.3),
        inset 0 1px 1px rgba(0, 0, 0, 0.2);
    }

    .analog-stick {
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e9ecef 60%, #ced4da 100%);
      border: 2px solid #adb5bd;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.8);
      touch-action: none;
      will-change: transform;
    }
    .analog-stick:active, .analog-stick.pressed {
      transform: scale(0.92);
    }

    .sys-btn {
      background: linear-gradient(145deg, #2b3548, #182030);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 2px 0 #0d121c, 0 3px 5px rgba(0,0,0,0.4);
      color: #e2e8f0;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.5px;
      transition: transform 0.03s ease;
    }
    .sys-btn:active, .sys-btn.pressed {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0d121c;
    }

    #emulator-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transform: translateZ(0);
    }
  </style>
</head>
<body>

  <!-- Consola Principal Horizontal Optimizada -->
  <div class="console-casing select-none">
    
    <!-- Gatillos Superiores L & R -->
    <div class="w-full flex justify-between px-6 -mt-4 mb-1">
      <button id="btn-l" data-key="q" class="shoulder-trigger w-24 h-5 rounded-t-lg text-[9px] font-black text-white/90">L</button>
      <button id="btn-r" data-key="e" class="shoulder-trigger w-24 h-5 rounded-t-lg text-[9px] font-black text-white/90">R</button>
    </div>

    <!-- Cuerpo Central -->
    <div class="flex items-center justify-between w-full h-full gap-2 sm:gap-4">
      
      <!-- ZONA IZQUIERDA: Joystick Funcional + D-Pad -->
      <div class="flex flex-col items-center justify-around w-[110px] sm:w-[140px] h-full py-0.5">
        <button id="stick-left" class="analog-stick w-10 h-10 sm:w-13 sm:h-13 rounded-full flex items-center justify-center cursor-pointer relative">
          <div class="w-5 h-5 bg-gray-300 rounded-full shadow-inner pointer-events-none"></div>
        </button>

        <!-- D-Pad -->
        <div class="relative w-24 h-24 sm:w-28 sm:h-28 flex items-center justify-center">
          <button id="btn-up" data-key="ArrowUp" class="switch-btn absolute top-0 w-8 h-8 sm:w-9 sm:h-9 rounded-md flex items-center justify-center text-xs font-bold">▲</button>
          <button id="btn-left" data-key="ArrowLeft" class="switch-btn absolute left-0 w-8 h-8 sm:w-9 sm:h-9 rounded-md flex items-center justify-center text-xs font-bold">◄</button>
          <div class="w-8 h-8 bg-transparent"></div>
          <button id="btn-right" data-key="ArrowRight" class="switch-btn absolute right-0 w-8 h-8 sm:w-9 sm:h-9 rounded-md flex items-center justify-center text-xs font-bold">►</button>
          <button id="btn-down" data-key="ArrowDown" class="switch-btn absolute bottom-0 w-8 h-8 sm:w-9 sm:h-9 rounded-md flex items-center justify-center text-xs font-bold">▼</button>
        </div>
      </div>

      <!-- ZONA CENTRAL: Pantalla Panorámica + Select / Start -->
      <div class="flex flex-col flex-1 h-full justify-between py-0.5">
        <div class="lcd-frame w-full flex-1 p-1.5 relative overflow-hidden flex flex-col">
          <div class="glass-glare absolute inset-0 z-20"></div>
          
          <div id="lcd-display" class="lcd-screen w-full h-full rounded flex flex-col items-center justify-center relative overflow-hidden">
            
            <!-- ROM File Picker Overlay -->
            <div id="rom-menu" class="absolute inset-0 bg-[#151b2b] flex flex-col items-center justify-center p-3 text-center z-30">
              <div class="lcd-font text-[10px] sm:text-[12px] text-blue-400 mb-1.5 font-bold uppercase tracking-wider">TRINCHERAS 60FPS</div>
              <div class="text-[9px] sm:text-[10px] text-gray-300 font-medium mb-3">Carga tu ROM para iniciar la partida</div>
              
              <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-[10px] sm:text-xs py-2 px-5 rounded-xl shadow-md uppercase tracking-wider transition">
                SELECCIONAR JUEGO
                <input type="file" id="rom-file-input" accept=".z64,.n64,.v64,.gba,.sfc,.smc,.bin,.cue,.iso,.md,.nes" class="hidden" />
              </label>
            </div>

            <!-- Emulator Container Target -->
            <div id="emulator-target" class="w-full h-full"></div>

          </div>
        </div>

        <!-- Botones Select y Start -->
        <div class="flex justify-center items-center gap-6 py-1">
          <button id="btn-select" data-key="Shift" class="sys-btn px-5 py-1 rounded-full uppercase">SELECT</button>
          <button id="btn-start" data-key="Enter" class="sys-btn px-5 py-1 rounded-full uppercase">START</button>
        </div>
      </div>

      <!-- ZONA DERECHA: Botones de Acción + Joystick Derecho Funcional -->
      <div class="flex flex-col items-center justify-around w-[110px] sm:w-[140px] h-full py-0.5">
        <!-- Botones de Acción -->
        <div class="relative w-24 h-24 sm:w-28 sm:h-28 flex items-center justify-center">
          <button id="btn-x" data-key="x" class="switch-btn absolute top-0 w-8 h-8 sm:w-9 sm:h-9 rounded-full font-black text-xs flex items-center justify-center">X</button>
          <button id="btn-y" data-key="y" class="switch-btn absolute left-0 w-8 h-8 sm:w-9 sm:h-9 rounded-full font-black text-xs flex items-center justify-center">Y</button>
          <button id="btn-a" data-key="z" class="switch-btn absolute right-0 w-8 h-8 sm:w-9 sm:h-9 rounded-full font-black text-xs flex items-center justify-center">A</button>
          <button id="btn-b" data-key="a" class="switch-btn absolute bottom-0 w-8 h-8 sm:w-9 sm:h-9 rounded-full font-black text-xs flex items-center justify-center">B</button>
        </div>

        <button id="stick-right" class="analog-stick w-10 h-10 sm:w-13 sm:h-13 rounded-full flex items-center justify-center cursor-pointer relative">
          <div class="w-5 h-5 bg-gray-300 rounded-full shadow-inner pointer-events-none"></div>
        </button>
      </div>

    </div>

    <!-- Barra Inferior -->
    <div class="w-full flex justify-between items-center px-1 pt-1 border-t border-blue-900/40 text-[8px] sm:text-[9px] text-blue-200/80 font-bold">
      <span id="status-label" class="lcd-font truncate max-w-[180px]">LISTO</span>
      <div class="flex items-center gap-2">
        <span class="tracking-widest hidden sm:inline">TURBO 60FPS</span>
        <button id="btn-reset" class="bg-red-600/80 hover:bg-red-600 text-white px-2 py-0.5 rounded text-[7px] uppercase font-extrabold cursor-pointer">Salir</button>
      </div>
    </div>

  </div>

  <script>
    const SYSTEM_MAP = {
      'z64': { core: 'n64', name: 'N64' },
      'n64': { core: 'n64', name: 'N64' },
      'v64': { core: 'n64', name: 'N64' },
      'gba': { core: 'gba', name: 'GBA' },
      'sfc': { core: 'snes', name: 'SNES' },
      'smc': { core: 'snes', name: 'SNES' },
      'bin': { core: 'psx', name: 'PS1' },
      'cue': { core: 'psx', name: 'PS1' },
      'iso': { core: 'psx', name: 'PS1' },
      'md':  { core: 'megadrive', name: 'Genesis' },
      'nes': { core: 'nes', name: 'NES' }
    };

    const romFileInput = document.getElementById('rom-file-input');
    const romMenu = document.getElementById('rom-menu');
    const target = document.getElementById('emulator-target');
    const statusLabel = document.getElementById('status-label');

    let currentGameUrl = null;
    let emulatorIframeWindow = null;

    romFileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const ext = file.name.split('.').pop().toLowerCase();
      const sysInfo = SYSTEM_MAP[ext] || { core: 'snes', name: 'Retro' };

      statusLabel.innerText = "CARGANDO...";

      if (currentGameUrl) URL.revokeObjectURL(currentGameUrl);
      currentGameUrl = URL.createObjectURL(file);

      romMenu.classList.add('hidden');
      statusLabel.innerText = file.name.substring(0, 12).toUpperCase();

      target.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.id = 'emulator-frame';
      
      // PERMISOS CLAVE DE HARDWARE PARA LIBERAR LOS 60 FPS EN LA TABLET
      iframe.setAttribute('allow', 'autoplay; fullscreen; gamepad; pointer-lock; accelerometer; gyroscope');
      iframe.setAttribute('scrolling', 'no');
      
      target.appendChild(iframe);

      const iframeDoc = iframe.contentWindow.document;
      emulatorIframeWindow = iframe.contentWindow;

      iframeDoc.open();
      iframeDoc.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <style>
                body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
                #game { width: 100%; height: 100%; }
                canvas { image-rendering: pixelated; image-rendering: crisp-edges; transform: translateZ(0); }
            </style>
        </head>
        <body>
            <div id="game"></div>
            <script>
                window.EJS_player = '#game';
                window.EJS_core = '${sysInfo.core}';
                window.EJS_gameUrl = '${currentGameUrl}';
                window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
                window.EJS_startOnLoaded = true;
                
                // Banderas de optimización nativa para evitar caídas de fotogramas
                window.EJS_mouse = false;
                window.EJS_multitouch = false;
                window.EJS_netplay = false;

                window.EJS_defaultControls = {
                    0: {
                        0: { value: 'a', value2: 'BUTTON_2' },
                        1: { value: 'y', value2: 'BUTTON_4' },
                        2: { value: 'shift', value2: 'SELECT' },
                        3: { value: 'enter', value2: 'START' },
                        4: { value: 'up arrow', value2: 'DPAD_UP' },
                        5: { value: 'down arrow', value2: 'DPAD_DOWN' },
                        6: { value: 'left arrow', value2: 'DPAD_LEFT' },
                        7: { value: 'right arrow', value2: 'DPAD_RIGHT' },
                        8: { value: 'z', value2: 'BUTTON_1' },
                        9: { value: 'x', value2: 'BUTTON_3' },
                        10: { value: 'q', value2: 'BUTTON_5' },
                        11: { value: 'e', value2: 'BUTTON_6' }
                    },
                    1: {}, 2: {}, 3: {}
                };
            <\/script>
            <script src="https://cdn.emulatorjs.org/stable/data/loader.js"><\/script>
        </body>
        </html>
      `);
      iframeDoc.close();
    });

    const BUTTON_INDEX = {
      a: 8, b: 0, x: 9, y: 1,
      ArrowUp: 4, ArrowDown: 5, ArrowLeft: 6, ArrowRight: 7,
      Enter: 3, Shift: 2, q: 10, e: 11
    };

    function sendControl(key, pressed) {
      const w = emulatorIframeWindow;
      if (!w) return false;
      try {
        const manager = w.EJS_emulator && w.EJS_emulator.gameManager;
        const index = BUTTON_INDEX[key];
        if (manager && typeof manager.simulateInput === 'function' && index !== undefined) {
          manager.simulateInput(0, index, pressed ? 1 : 0);
          return true;
        }
      } catch (err) {}
      try {
        const aliases = {
          ArrowUp: ['ArrowUp','ArrowUp',38], ArrowDown: ['ArrowDown','ArrowDown',40],
          ArrowLeft: ['ArrowLeft','ArrowLeft',37], ArrowRight: ['ArrowRight','ArrowRight',39],
          Enter: ['Enter','Enter',13], Shift: ['Shift','ShiftLeft',16],
          q: ['q','KeyQ',81], e: ['e','KeyE',69], x: ['x','KeyX',88],
          y: ['y','KeyY',89], z: ['z','KeyZ',90], a: ['a','KeyA',65]
        };
        const info = aliases[key] || [key, key, 0];
        const init = { key: info[0], code: info[1], keyCode: info[2], which: info[2], bubbles: true, cancelable: true };
        const target = w.document.activeElement || w.document.querySelector('canvas') || w.document;
        target.dispatchEvent(new w.KeyboardEvent(pressed ? 'keydown' : 'keyup', init));
        return true;
      } catch (err) { return false; }
    }

    document.querySelectorAll('[data-key]').forEach(btn => {
      const key = btn.getAttribute('data-key');
      let isPressed = false;
      const press = (e) => { if(e.cancelable) e.preventDefault(); if(isPressed) return; isPressed=true; btn.classList.add('pressed'); sendControl(key, true); };
      const release = (e) => { if(e && e.cancelable) e.preventDefault(); if(!isPressed) return; isPressed=false; btn.classList.remove('pressed'); sendControl(key, false); };
      btn.addEventListener('pointerdown', press, { passive: false });
      btn.addEventListener('pointerup', release, { passive: false });
      btn.addEventListener('pointercancel', release, { passive: false });
    });

    function setupAnalogStick(stickId, upKey, downKey, leftKey, rightKey) {
      const stick = document.getElementById(stickId);
      if (!stick) return;
      let activeXKey = null;
      let activeYKey = null;

      stick.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        stick.setPointerCapture(e.pointerId);
        stick.classList.add('pressed');
      });

      stick.addEventListener('pointermove', (e) => {
        const rect = stick.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;
        
        const maxDist = 18;
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), maxDist);
        const angle = Math.atan2(dy, dx);
        const moveX = Math.cos(angle) * dist;
        const moveY = Math.sin(angle) * dist;
        stick.style.transform = `translate3d(${moveX}px, ${moveY}px, 0) scale(0.95)`;

        const threshold = 6;
        let newXKey = null;
        let newYKey = null;

        if (dx < -threshold) newXKey = leftKey;
        else if (dx > threshold) newXKey = rightKey;

        if (dy < -threshold) newYKey = upKey;
        else if (dy > threshold) newYKey = downKey;

        if (activeXKey !== newXKey) {
          if (activeXKey) sendControl(activeXKey, false);
          activeXKey = newXKey;
          if (activeXKey) sendControl(activeXKey, true);
        }
        if (activeYKey !== newYKey) {
          if (activeYKey) sendControl(activeYKey, false);
          activeYKey = newYKey;
          if (activeYKey) sendControl(activeYKey, true);
        }
      });

      const resetStick = (e) => {
        stick.style.transform = 'translate3d(0px, 0px, 0) scale(1)';
        stick.classList.remove('pressed');
        if (activeXKey) { sendControl(activeXKey, false); activeXKey = null; }
        if (activeYKey) { sendControl(activeYKey, false); activeYKey = null; }
      };

      stick.addEventListener('pointerup', resetStick);
      stick.addEventListener('pointercancel', resetStick);
    }

    setupAnalogStick('stick-left', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight');
    setupAnalogStick('stick-right', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight');

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
      sendControl(e.key, true);
    });
    window.addEventListener('keyup', (e) => {
      sendControl(e.key, false);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (currentGameUrl) { URL.revokeObjectURL(currentGameUrl); currentGameUrl = null; }
      target.innerHTML = '';
      romMenu.classList.remove('hidden');
      statusLabel.innerText = "LISTO";
    });
  </script>
</body>
</html>
