<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamOne - Retro Battlestation</title>
    <!-- Fuentes estilo Retro/Cyberpunk -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff2a6d;
            --secondary-color: #05d9e8;
            --accent-color: #fffc00;
            --bg-dark: #050508;
            --panel-bg: rgba(12, 12, 20, 0.9);
            --border-glow: rgba(255, 42, 109, 0.5);
        }

        * { box-sizing: border-box; }
        
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 10%, #15092a 0%, #050508 80%);
            color: #f1f2f6;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }

        /* Barra superior limpia y perfectamente equilibrada */
        header {
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            border: 2px solid var(--border-glow);
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 0 20px rgba(255, 42, 109, 0.25);
            z-index: 10;
            gap: 15px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            height: 28px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 6px var(--primary-color));
        }

        .brand-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            color: var(--primary-color);
            text-shadow: 0 0 8px var(--primary-color);
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .control-group label {
            font-size: 0.7rem;
            color: var(--secondary-color);
            font-weight: 700;
            text-transform: uppercase;
        }

        .control-group select, select, .btn-action {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--secondary-color);
            color: #fff;
            padding: 5px 8px;
            border-radius: 5px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .control-group select {
            border: none;
            background: transparent;
            color: #fff;
            padding: 0;
            cursor: pointer;
        }

        .control-group select option {
            background: #12091f;
            color: #fff;
        }

        select:hover, .btn-action:hover {
            background: var(--secondary-color);
            color: #000;
            box-shadow: 0 0 8px var(--secondary-color);
        }

        .btn-action {
            border-color: var(--primary-color);
            white-space: nowrap;
        }
        
        .btn-action:hover {
            background: var(--primary-color);
            box-shadow: 0 0 8px var(--primary-color);
            color: #fff;
        }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        
        .file-upload-wrapper input[type=file] {
            position: absolute;
            left: 0; top: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
        }

        /* Gabinete Arcade Battlestation */
        .arcade-station {
            position: relative;
            width: 100%;
            max-width: 960px;
            height: 500px;
            background-color: #090514;
            background-image: url('https://images.wallpapersden.com/image/download/synthwave-retro-grid-sunset_bWVuZWSUmZqaraWkpJRmbmdlrWZlbWU.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 35px var(--border-glow);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid var(--primary-color);
            z-index: 10;
            transition: background-image 0.4s ease;
        }

        .arcade-station::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(10,5,20,0.2) 30%, rgba(5,5,8,0.9) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .arcade-station.crt-filter::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 4;
            pointer-events: none;
            opacity: 0.6;
        }

        #game-container {
            width: 680px;
            max-width: 80%;
            height: 100%;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 40px rgba(0,0,0,0.95);
            background: #000;
            border-left: 2px solid rgba(255,255,255,0.08);
            border-right: 2px solid rgba(255,255,255,0.08);
        }

        #game { width: 100%; height: 100%; }

        /* Panel inferior de información */
        .footer-info {
            width: 100%;
            max-width: 960px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-top: 10px;
            z-index: 10;
        }

        .panel-box {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 0.9rem;
        }

        .panel-box h4 {
            margin: 0 0 6px 0;
            color: var(--secondary-color);
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gamepad-indicator {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            color: #a4b0be;
        }
        .gamepad-indicator.active {
            background: #2ed573;
            color: #000;
            font-weight: 700;
        }

        .shortcuts-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .shortcut-chip {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 2px 6px;
            border-radius: 4px;
            color: #dfe4ea;
            font-size: 0.8rem;
        }
        .shortcut-chip b { color: var(--accent-color); }

        /* Controles táctiles móviles optimizados */
        .touch-controls {
            display: none;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            margin-top: auto;
            z-index: 10;
        }

        .d-pad { position: relative; width: 110px; height: 110px; }
        .btn-touch {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-touch:active { background: var(--primary-color); }
        .d-btn { position: absolute; width: 38px; height: 38px; border-radius: 8px; font-size: 1rem; }
        .d-up { top: 0; left: 36px; }
        .d-down { bottom: 0; left: 36px; }
        .d-left { top: 36px; left: 0; }
        .d-right { top: 36px; right: 0; }
        
        .action-pad { display: grid; grid-template-columns: repeat(2, 48px); gap: 8px; }
        .action-btn { width: 48px; height: 48px; background: rgba(255, 42, 109, 0.4); border-color: var(--primary-color); }
        
        .center-controls { display: flex; flex-direction: column; gap: 6px; }
        .small-btn { width: 48px; height: 22px; border-radius: 10px; font-size: 0.55rem; background: rgba(255,255,255,0.1); }

        @media (max-width: 850px) {
            header { flex-direction: column; align-items: stretch; gap: 10px; }
            .header-controls { justify-content: space-between; flex-wrap: wrap; }
            .footer-info { grid-template-columns: 1fr; }
            .arcade-station { height: 360px; }
        }
    </style>
</head>
<body>

    <!-- Marquesina / Panel Superior Organizado -->
    <header>
        <div class="brand-container">
            <img src="https://github.com/StreamOne01/Streamone/blob/main/ChatGPT%20Image%2020%20sept%202026,%2018_31_02.png?raw=true" alt="StreamOne Logo" class="brand-logo">
            <span class="brand-title">BATTLESTATION</span>
        </div>
        
        <div class="header-controls">
            <!-- Selector de Consola -->
            <div class="control-group">
                <label for="consoleSelect">Consola</label>
                <select id="consoleSelect">
                    <option value="snes" selected>SNES</option>
                    <option value="gba">GBA</option>
                    <option value="nes">NES</option>
                    <option value="segaMD">Genesis</option>
                    <option value="gb">Game Boy</option>
                    <option value="psx">PSX</option>
                    <option value="n64">N64</option>
                    <option value="arcade">Arcade</option>
                </select>
            </div>

            <!-- Selector de Estilo RGB / Gabinete -->
            <div class="control-group">
                <label for="themeSelect">Estilo</label>
                <select id="themeSelect">
                    <option value="synthwave" selected>Synthwave</option>
                    <option value="cyberpunk">Cyberpunk</option>
                    <option value="arcadeclassic">Classic</option>
                    <option value="matrix">Matrix</option>
                </select>
            </div>

            <button class="btn-action" id="crtToggleBtn" title="Activar/Desactivar líneas CRT">📺 CRT</button>

            <div class="file-upload-wrapper">
                <button class="btn-action">📂 ROM</button>
                <input type="file" id="romFile">
            </div>

            <button class="btn-action" id="fullscreenBtn">⛶ Pantalla</button>
        </div>
    </header>

    <!-- Estación de Juego -->
    <div class="arcade-station crt-filter" id="arcadeStation">
        <div id="game-container">
            <div id="game"></div>
        </div>
    </div>

    <!-- Panel inferior de información -->
    <div class="footer-info">
        <div class="panel-box">
            <h4>⌨️ Atajos de Control Rápido</h4>
            <div class="shortcuts-grid">
                <div class="shortcut-chip">Mover: <b>Flechas</b></div>
                <div class="shortcut-chip">Acción A: <b>Z</b></div>
                <div class="shortcut-chip">Acción B: <b>X</b></div>
                <div class="shortcut-chip">Start: <b>Enter</b></div>
                <div class="shortcut-chip">Select: <b>Shift</b></div>
            </div>
        </div>
        <div class="panel-box">
            <h4>🎮 Gamepad USB / Bluetooth</h4>
            <div style="margin-top: 6px;">
                <span class="gamepad-indicator" id="gamepadStatus">Desconectado</span>
            </div>
        </div>
    </div>

    <!-- Controles táctiles móviles -->
    <div class="touch-controls" id="touchControls">
        <div class="d-pad">
            <div class="btn-touch d-btn d-up" data-key="ArrowUp">⬆️</div>
            <div class="btn-touch d-btn d-left" data-key="ArrowLeft">⬅️</div>
            <div class="btn-touch d-btn d-right" data-key="ArrowRight">➡️</div>
            <div class="btn-touch d-btn d-down" data-key="ArrowDown">⬇️</div>
        </div>
        <div class="center-controls">
            <div class="btn-touch small-btn" data-key="ShiftRight">SELECT</div>
            <div class="btn-touch small-btn" data-key="Enter">START</div>
        </div>
        <div class="action-pad">
            <div class="btn-touch action-btn" data-key="KeyX">B</div>
            <div class="btn-touch action-btn" data-key="KeyZ">A</div>
        </div>
    </div>

    <!-- Configuración inicial del emulador -->
    <script>
        let currentCore = "snes";
        let currentGameUrl = "Kirby 3.sfc";

        window.EJS_player = "#game";
        window.EJS_core = currentCore;
        window.EJS_gameUrl = currentGameUrl;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_gamepad = true;
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

    <script>
        const consoleSelect = document.getElementById('consoleSelect');
        consoleSelect.addEventListener('change', (e) => {
            currentCore = e.target.value;
            alert(`Plataforma cambiada a: ${consoleSelect.options[consoleSelect.selectedIndex].text}. Por favor carga tu ROM correspondiente.`);
        });

        document.getElementById('romFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileUrl = URL.createObjectURL(file);
            document.getElementById('game').innerHTML = '';

            window.EJS_player = "#game";
            window.EJS_core = currentCore;
            window.EJS_gameUrl = fileUrl;
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            window.EJS_gamepad = true;

            const script = document.createElement('script');
            script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            document.body.appendChild(script);
        });

        const themeSelect = document.getElementById('themeSelect');
        const station = document.getElementById('arcadeStation');

        const themes = {
            synthwave: { primary: '#ff2a6d', secondary: '#05d9e8', bg: 'url("https://images.wallpapersden.com/image/download/synthwave-retro-grid-sunset_bWVuZWSUmZqaraWkpJRmbmdlrWZlbWU.jpg")' },
            cyberpunk: { primary: '#fee140', secondary: '#fa709a', bg: 'url("https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1600&auto=format&fit=crop")' },
            arcadeclassic: { primary: '#ff4757', secondary: '#2ed573', bg: 'url("https://images.wallpapersden.com/image/download/neon-arcade-room_bWplaGyUmZqaraWkpJRmbmdlrWZlbWU.jpg")' },
            matrix: { primary: '#00ff66', secondary: '#00ffff', bg: 'url("https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1600&auto=format&fit=crop")' }
        };

        themeSelect.addEventListener('change', (e) => {
            const theme = themes[e.target.value];
            if (theme) {
                document.documentElement.style.setProperty('--primary-color', theme.primary);
                document.documentElement.style.setProperty('--secondary-color', theme.secondary);
                station.style.backgroundImage = theme.bg;
            }
        });

        const crtToggleBtn = document.getElementById('crtToggleBtn');
        crtToggleBtn.addEventListener('click', () => {
            station.classList.toggle('crt-filter');
            crtToggleBtn.style.borderColor = station.classList.contains('crt-filter') ? 'var(--secondary-color)' : '#555';
        });

        const fullscreenBtn = document.getElementById('fullscreenBtn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                station.requestFullscreen().catch(err => alert(err.message));
            } else {
                document.exitFullscreen();
            }
        });

        const statusBadge = document.getElementById('gamepadStatus');
        window.addEventListener("gamepadconnected", (e) => {
            statusBadge.textContent = `Conectado: ${e.gamepad.id.slice(0, 15)}...`;
            statusBadge.classList.add('active');
        });
        window.addEventListener("gamepaddisconnected", () => {
            statusBadge.textContent = "Desconectado";
            statusBadge.classList.remove('active');
        });

        const isTouchDevice = window.matchMedia('(pointer: coarse)').matches || ('maxTouchPoints' in navigator && navigator.maxTouchPoints > 0);
        if (isTouchDevice) {
            document.getElementById('touchControls').style.display = 'flex';
        }

        function simulateKeyEvent(key, type) {
            const event = new KeyboardEvent(type, { code: key, bubbles: true, cancelable: true });
            document.dispatchEvent(event);
        }

        document.querySelectorAll('.btn-touch').forEach(button => {
            const keyCode = button.getAttribute('data-key');
            button.addEventListener('touchstart', (e) => { e.preventDefault(); simulateKeyEvent(keyCode, 'keydown'); });
            button.addEventListener('touchend', (e) => { e.preventDefault(); simulateKeyEvent(keyCode, 'keyup'); });
        });
    </script>
</body>
</html>
