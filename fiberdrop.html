<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiber Dog Track</title>
    
    <!-- Configuración de Iconos para Móviles y Pestañas (iOS / Android) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%22112%22 fill=%22%230072d2%22/><path d=%22M256 120c-53 0-96 43-96 96 0 35.3 19.3 66 48 82.5V336c0 13.3 10.7 24 24 24h48c13.3 0 24-10.7 24-24v-37.5c28.7-16.5 48-47.2 48-82.5 0-53-43-96-96-96zm0 50c25.4 0 46 20.6 46 46s-20.6 46-46 46-46-20.6-46-46 20.6-46 46-46zM140 380c-13.3 0-24 10.7-24 24s10.7 24 24 24h232c13.3 0 24-10.7 24-24s-10.7-24-24-24H140z%22 fill=%22%23ffffff%22/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%22112%22 fill=%22%230072d2%22/><path d=%22M256 120c-53 0-96 43-96 96 0 35.3 19.3 66 48 82.5V336c0 13.3 10.7 24 24 24h48c13.3 0 24-10.7 24-24v-37.5c28.7-16.5 48-47.2 48-82.5 0-53-43-96-96-96zm0 50c25.4 0 46 20.6 46 46s-20.6 46-46 46-46-20.6-46-46 20.6-46 46-46zM140 380c-13.3 0-24 10.7-24 24s10.7 24 24 24h232c13.3 0 24-10.7 24-24s-10.7-24-24-24H140z%22 fill=%22%23ffffff%22/></svg>">

    <style>
        :root {
            --bg-main: #0b1320;
            --bg-card: #0f172a;
            --accent: #0072d2;
            --accent-hover: #005bb5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .app-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #0072d2, #004d99);
            border-radius: 16px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(0, 114, 210, 0.3);
        }

        .app-logo svg {
            width: 36px;
            height: 36px;
            fill: #ffffff;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 4px;
            font-weight: 700;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        #lobbyScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            text-align: center;
        }

        .lobby-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.3);
        }

        .lobby-card h2 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .lobby-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .user-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }

        .user-banner span {
            color: var(--accent);
            font-weight: 600;
        }

        .btn-switch {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-switch:active {
            background: var(--border);
            color: var(--text-main);
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background-color: var(--bg-card);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        input[readonly] {
            background-color: #162032;
            color: var(--text-muted);
        }

        .gps-container {
            display: flex;
            gap: 8px;
        }

        .gps-container input {
            flex: 1;
        }

        .btn-gps {
            background-color: #334155;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 14px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-gps:active {
            background-color: #475569;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }

        .btn-primary:active {
            background-color: var(--accent-hover);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            font-size: 0.85rem;
        }

        .history-item strong {
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .history-item p {
            color: var(--text-muted);
            margin-top: 3px;
        }

        .btn-mapa {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: var(--success);
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 8px;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-mapa:active {
            background-color: #059669;
        }

        .item-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #1e293b;
            color: var(--text-main);
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
        }

        .btn-action:active {
            background: #334155;
        }

        .no-records {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 20px;
        }

        .loading-text {
            text-align: center;
            color: var(--accent);
            font-size: 0.85rem;
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOBBY -->
        <div id="lobbyScreen">
            <header>
                <div class="app-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                </div>
                <h1>Fiber Dog Track</h1>
                <p>Control de Infraestructura y GPS en Poste</p>
            </header>
            <div class="lobby-card">
                <h2>¿Quién trabajará hoy?</h2>
                <p>Selecciona tu nombre para ingresar al sistema de registro.</p>
                <div class="form-group" style="text-align: left;">
                    <label for="selectTecnicoLobby">Técnico Operativo</label>
                    <select id="selectTecnicoLobby">
                        <option value="">Seleccione su nombre...</option>
                        <option value="Carlos Muñoz">Carlos Muñoz</option>
                        <option value="Jorge García">Jorge García</option>
                    </select>
                </div>
                <button type="button" class="btn-primary" onclick="iniciarSesionTecnico()">Comenzar Turno</button>
            </div>
        </div>

        <!-- APP PRINCIPAL -->
        <div id="mainApp" style="display: none;">
            <header>
                <div class="app-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                </div>
                <h1>Fiber Dog Track</h1>
                <p>Control de Infraestructura y GPS en Poste</p>
            </header>

            <div class="user-banner">
                <div>Técnico: <span id="displayTecnicoActivo"></span></div>
                <button class="btn-switch" onclick="cambiarTecnico()">Cambiar</button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="cambiarTab('registro', event)">Registrar</button>
                <button class="tab-btn" onclick="cambiarTab('buscar', event)">Buscar</button>
                <button class="tab-btn" onclick="cambiarTab('lista', event)">Lista</button>
            </div>

            <!-- REGISTRO -->
            <div id="tab-registro" class="tab-content active">
                <div class="card">
                    <form id="registroForm">
                        <input type="hidden" id="editIndex" value="">
                        
                        <div class="form-group">
                            <label for="tecnico">Técnico Responsable</label>
                            <input type="text" id="tecnico" readonly>
                        </div>

                        <div class="form-group">
                            <label for="codigoCliente">Código del Cliente</label>
                            <input type="text" id="codigoCliente" required placeholder="Ej. CLI-1042">
                        </div>

                        <div class="form-group">
                            <label for="poste">Número de Poste</label>
                            <input type="text" id="poste" placeholder="Ej. P-4052">
                        </div>

                        <div class="form-group">
                            <label for="tap">Número de TAP</label>
                            <input type="text" id="tap" placeholder="Ej. TAP-04">
                        </div>

                        <div class="form-group">
                            <label for="nap">Caja NAP</label>
                            <input type="text" id="nap" placeholder="Ej. NAP-02-L4">
                        </div>

                        <div class="form-group">
                            <label for="gps">Coordenadas GPS</label>
                            <div class="gps-container">
                                <input type="text" id="gps" placeholder="Lat, Lon" readonly>
                                <button type="button" class="btn-gps" onclick="obtenerGPS()">Obtener GPS</button>
                            </div>
                        </div>

                        <button type="submit" id="btnGuardar" class="btn-primary">Guardar Registro</button>
                    </form>
                </div>
            </div>

            <!-- BUSCAR -->
            <div id="tab-buscar" class="tab-content">
                <div class="card">
                    <div class="form-group">
                        <label for="inputBuscar">Buscar por Código o Poste</label>
                        <input type="text" id="inputBuscar" placeholder="Escribe para filtrar..." oninput="filtrarRegistros()">
                    </div>
                </div>
                <div id="resultadoBusqueda" class="history-list">
                    <div class="no-records">Usa el buscador para filtrar registros.</div>
                </div>
            </div>

            <!-- LISTA GENERAL -->
            <div id="tab-lista" class="tab-content">
                <div id="historyList" class="history-list">
                    <!-- Se llenará con la nube -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxrT8yY2BRjbWlI0DktZZc6T4AZPCnXGW0HX7ytLts2-FOmbslAudnz4GY4fyam-LxNwQ/exec';

        document.addEventListener('DOMContentLoaded', () => {
            verificarSesion();
        });

        function verificarSesion() {
            const tecnicoGuardado = localStorage.getItem('tecnico_activo_fiber');
            if (tecnicoGuardado) {
                activarApp(tecnicoGuardado);
            } else {
                document.getElementById('lobbyScreen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        }

        function iniciarSesionTecnico() {
            const select = document.getElementById('selectTecnicoLobby');
            const tecnicoSeleccionado = select.value;

            if (!tecnicoSeleccionado) {
                alert('Por favor selecciona tu nombre para continuar.');
                return;
            }

            localStorage.setItem('tecnico_activo_fiber', tecnicoSeleccionado);
            activarApp(tecnicoSeleccionado);
        }

        function activarApp(nombreTecnico) {
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('displayTecnicoActivo').textContent = nombreTecnico;
            document.getElementById('tecnico').value = nombreTecnico;
            cargarRegistrosDesdeNube();
        }

        function cambiarTecnico() {
            localStorage.removeItem('tecnico_activo_fiber');
            document.getElementById('selectTecnicoLobby').value = '';
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('lobbyScreen').style.display = 'flex';
        }

        function cambiarTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            event.currentTarget.classList.add('active');

            if (tabName === 'lista' || tabName === 'buscar') {
                cargarRegistrosDesdeNube();
            }
        }

        function obtenerGPS() {
            const gpsInput = document.getElementById('gps');
            if (!navigator.geolocation) {
                alert('La geolocalización no es compatible con este navegador.');
                return;
            }

            gpsInput.value = 'Buscando satélites (alta precisión)...';

            const opcionesGPS = {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lon = position.coords.longitude.toFixed(6);
                    gpsInput.value = `${lat}, ${lon}`;
                },
                (error) => {
                    let mensaje = 'No se pudo obtener la ubicación.';
                    if (error.code === error.TIMEOUT) {
                        mensaje = 'El GPS tardó demasiado. Sal al aire libre o acércate a la calle.';
                    } else if (error.code === error.PERMISSION_DENIED) {
                        mensaje = 'Permiso de ubicación denegado en el navegador.';
                    }
                    alert(mensaje);
                    gpsInput.value = '';
                },
                opcionesGPS
            );
        }

        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const editIndex = document.getElementById('editIndex').value;
            const tecnicoActual = localStorage.getItem('tecnico_activo_fiber') || 'Carlos Muñoz';

            const nuevoRegistro = {
                id: editIndex !== "" ? JSON.parse(localStorage.getItem('registros_fiber_dog'))[editIndex].id : Date.now(),
                tecnico: tecnicoActual,
                codigoCliente: document.getElementById('codigoCliente').value,
                poste: document.getElementById('poste').value || 'N/D',
                tap: document.getElementById('tap').value || 'N/D',
                nap: document.getElementById('nap').value || 'N/D',
                gps: document.getElementById('gps').value || 'Sin coordenadas',
                fecha: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            const btnGuardar = document.getElementById('btnGuardar');
            const textoOriginal = btnGuardar.textContent;
            btnGuardar.textContent = 'Enviando a la nube...';
            btnGuardar.disabled = true;

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoRegistro)
            })
            .then(() => {
                alert(editIndex !== "" ? '¡Registro actualizado con éxito!' : '¡Registro guardado y sincronizado con éxito!');
                this.reset();
                document.getElementById('editIndex').value = "";
                document.getElementById('tecnico').value = tecnicoActual;
                document.getElementById('gps').value = '';
                btnGuardar.textContent = "Guardar Registro";
                btnGuardar.disabled = false;
                cambiarTab('lista', { currentTarget: document.querySelectorAll('.tab-btn')[2] });
            })
            .catch(err => {
                console.error("Error al enviar:", err);
                alert('Ocurrió un error al sincronizar con Google Sheets.');
                btnGuardar.textContent = textoOriginal;
                btnGuardar.disabled = false;
            });
        });

        function cargarRegistrosDesdeNube() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '<div class="loading-text">Sincronizando con la nube...</div>';

            const urlConAntiCache = `${WEB_APP_URL}?nocache=${new Date().getTime()}`;

            fetch(urlConAntiCache)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error en la respuesta del servidor');
                    }
                    return response.json();
                })
                .then(registros => {
                    localStorage.setItem('registros_fiber_dog', JSON.stringify(registros));

                    if (!registros || registros.length === 0) {
                        historyList.innerHTML = '<div class="no-records">No hay registros en la hoja de cálculo todavía.</div>';
                        return;
                    }

                    let html = '';
                    registros.forEach((reg, index) => {
                        html += renderizarItem(reg, index);
                    });
                    historyList.innerHTML = html;
                    
                    if (document.getElementById('inputBuscar').value.trim() !== '') {
                        filtrarRegistros();
                    }
                })
                .catch(err => {
                    console.error("Error al obtener datos de la nube:", err);
                    const registrosLocales = JSON.parse(localStorage.getItem('registros_fiber_dog')) || [];
                    
                    if (registrosLocales.length > 0) {
                        let html = '';
                        registrosLocales.forEach((reg, index) => {
                            html += renderizarItem(reg, index);
                        });
                        historyList.innerHTML = '<div style="color: #f59e0b; font-size: 0.75rem; text-align:center; margin-bottom: 8px;">⚠️ Modo sin conexión (Mostrando caché local)</div>' + html;
                    } else {
                        historyList.innerHTML = '<div class="no-records">No se pudo conectar a la nube y no hay registros locales.</div>';
                    }
                });
        }

        function renderizarItem(reg, index) {
            let botonMapa = '';
            if (reg.gps && reg.gps !== 'Sin coordenadas' && reg.gps.includes(',')) {
                const coords = reg.gps.replace(/\s+/g, '');
                const urlGoogleMaps = `https://www.google.com/maps/search/?api=1&query=${coords}`;
                
                botonMapa = `
                    <a href="${urlGoogleMaps}" target="_blank" class="btn-mapa">
                        📍 Abrir ruta en el Mapa
                    </a>
                `;
            }

            return `
                <div class="history-item">
                    <strong>Código: ${reg.codigoCliente}</strong>
                    <p><strong>Técnico:</strong> ${reg.tecnico}</p>
                    <p>Poste: ${reg.poste} | TAP: ${reg.tap} | NAP: ${reg.nap}</p>
                    <p>GPS: ${reg.gps}</p>
                    ${botonMapa}
                    <p><small style="color: var(--text-muted); margin-top: 6px; display: block;">${reg.fecha}</small></p>
                    <div class="item-actions">
                        <button class="btn-action" onclick="editarRegistroLocal(${index})">Editar</button>
                    </div>
                </div>
            `;
        }

        function editarRegistroLocal(index) {
            const registros = JSON.parse(localStorage.getItem('registros_fiber_dog')) || [];
            const reg = registros[index];

            document.getElementById('editIndex').value = index;
            document.getElementById('codigoCliente').value = reg.codigoCliente;
            document.getElementById('poste').value = reg.poste === 'N/D' ? '' : reg.poste;
            document.getElementById('tap').value = reg.tap === 'N/D' ? '' : reg.tap;
            document.getElementById('nap').value = reg.nap === 'N/D' ? '' : reg.nap;
            document.getElementById('gps').value = reg.gps === 'Sin coordenadas' ? '' : reg.gps;

            document.getElementById('btnGuardar').textContent = "Actualizar Registro";
            cambiarTab('registro', { currentTarget: document.querySelectorAll('.tab-btn')[0] });
        }

        function filtrarRegistros() {
            const query = document.getElementById('inputBuscar').value.trim().toLowerCase();
            const contenedor = document.getElementById('resultadoBusqueda');
            let registros = JSON.parse(localStorage.getItem('registros_fiber_dog')) || [];

            if (!query) {
                contenedor.innerHTML = '<div class="no-records">Escribe un código o poste para buscar...</div>';
                return;
            }

            if (registros.length === 0) {
                contenedor.innerHTML = '<div class="no-records">⚠️ No hay registros locales. Ve a la pestaña "Lista" para sincronizar la nube.</div>';
                return;
            }

            const filtrados = [];
            registros.forEach((reg, index) => {
                const codigo = (reg.codigoCliente || "").toString().toLowerCase();
                const poste = (reg.poste || "").toString().toLowerCase();
                const tap = (reg.tap || "").toString().toLowerCase();
                const nap = (reg.nap || "").toString().toLowerCase();

                if (codigo.includes(query) || poste.includes(query) || tap.includes(query) || nap.includes(query)) {
                    filtrados.push({ reg, index });
                }
            });

            if (filtrados.length === 0) {
                contenedor.innerHTML = `<div class="no-records">No se encontró ninguna coincidencia con "${query}".</div>`;
                return;
            }

            let html = '';
            filtrados.forEach(({ reg, index }) => {
                html += renderizarItem(reg, index);
            });
            contenedor.innerHTML = html;
        }
    </script>
</body>
</html>
