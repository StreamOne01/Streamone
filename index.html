<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stream One - Smarters Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    
    body { background-color: #0b111e; color: #ffffff; height: 100vh; overflow: hidden; }
    
    .bg-custom-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background-image: url('https://github.com/StreamOne01/Streamone/blob/main/fondo%20stream%20one.png?raw=true'); background-size: cover; background-position: center; }
    .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(11, 17, 30, 0.90) 0%, rgba(7, 11, 20, 0.95) 60%, rgba(2, 4, 10, 0.99) 100%); z-index: 2; pointer-events: none; }
    
    .view { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .hidden { display: none !important; }

    /* Login */
    .login-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 20; overflow-y: auto; }
    .login-box { background: rgba(15, 23, 42, 0.9); border: 2px solid rgba(0, 168, 232, 0.3); padding: 40px; border-radius: 24px; width: 100%; max-width: 420px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); backdrop-filter: blur(12px); text-align: center; }
    .login-title { font-size: 2rem; font-weight: 900; color: #00a8e8; text-align: center; margin-bottom: 25px; letter-spacing: 1.5px; text-shadow: 0 2px 10px rgba(0,168,232,0.3); }
    .login-subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 25px; font-weight: 600; }
    .login-btn { width: 100%; background: #00a8e8; color: #070b14; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,168,232,0.4); }
    .login-btn:hover { background: #0092c9; transform: translateY(-2px); }

    /* Lobby */
    .lobby-container { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 60px 20px 20px 20px; max-width: 1200px; margin: 0 auto; width: 100%; overflow-y: auto; }
    
    .top-bar { position: absolute; top: 12px; right: 20px; left: 20px; display: flex; align-items: center; justify-content: space-between; z-index: 20; background: rgba(15, 23, 42, 0.85); padding: 6px 14px; border-radius: 30px; border: 1px solid rgba(0,168,232,0.2); backdrop-filter: blur(8px); }
    
    .marquee-container { flex: 1; overflow: hidden; white-space: nowrap; margin: 0 15px; position: relative; }
    .marquee-text { display: inline-block; padding-left: 100%; animation: marqueeAnimation 18s linear infinite; font-size: 0.85rem; font-weight: 700; color: #00a8e8; text-shadow: 0 0 8px rgba(0,168,232,0.3); }
    
    @keyframes marqueeAnimation {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    .top-bar-right { display: flex; align-items: center; gap: 10px; }
    .user-profile-area { display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.2s; padding: 2px 8px; border-radius: 20px; }
    .user-profile-area:hover { background: rgba(0, 168, 232, 0.2); }
    .user-avatar { width: 30px; height: 30px; border-radius: 50%; background: #00a8e8; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #070b14; font-size: 1rem; }
    
    .smarters-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; }
    .card-smarters { position: relative; overflow: hidden; height: 210px; border-radius: 20px; padding: 25px; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(15, 23, 42, 0.7); border: 2px solid rgba(255,255,255,0.08); cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .card-smarters:hover { transform: translateY(-5px); border-color: #00a8e8; box-shadow: 0 15px 35px rgba(0,168,232,0.25); }
    
    .lobby-bg-slideshow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .lobby-bg-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
    .lobby-bg-slide.active { opacity: 0.35; }

    .card-icon { font-size: 2.2rem; margin-bottom: auto; z-index: 2; position: relative; }
    .loading-wrapper { transition: opacity 0.5s ease; position: relative; z-index: 2; margin-top: 8px; opacity: 1; }
    .loading-wrapper.fade-out { opacity: 0; pointer-events: none; }
    .battery-container { width: 100%; background: rgba(7, 11, 20, 0.7); border: 1px solid rgba(0,168,232,0.5); border-radius: 6px; height: 6px; overflow: hidden; }
    .battery-fill { height: 100%; width: 0%; background: #00a8e8; transition: width 0.3s linear; }
    .label { font-size: 0.75rem; color: #00a8e8; margin-top: 4px; font-weight: 600; }

    /* Vista de Canales y Reproductor */
    .content-view { padding: 15px 25px; flex: 1; display: flex; flex-direction: column; max-width: 1400px; margin: 0 auto; width: 100%; height: 100vh; overflow: hidden; }
    .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-shrink: 0; }
    .menu-icon-btn { background: rgba(0, 168, 232, 0.15); border: 1px solid #00a8e8; color: #00a8e8; width: 42px; height: 42px; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(0,168,232,0.2); }
    .menu-icon-btn:hover { background: rgba(0, 168, 232, 0.3); transform: scale(1.05); }
    .menu-line { width: 18px; height: 2.5px; background-color: #00a8e8; border-radius: 2px; }
    
    .main-content-layout { display: flex; flex-direction: column; gap: 12px; flex: 1; overflow: hidden; min-height: 0; }
    .player-container { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(0,168,232,0.3); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; flex-shrink: 0; }
    
    .video-wrapper { width: 100%; max-width: 700px; height: 200px; background-color: #000 !important; background-image: none !important; border-radius: 12px; overflow: hidden; margin-top: 6px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
    .video-wrapper video { width: 100%; height: 100%; object-fit: contain; outline: none; background: #000; }

    .sidebar-channels { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); flex: 1; min-height: 0; }
    .alphabet-bar { display: flex; overflow-x: auto; white-space: nowrap; padding: 10px; background: rgba(7, 11, 20, 0.8); gap: 8px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.05); -webkit-overflow-scrolling: touch; }
    .alphabet-bar::-webkit-scrollbar { height: 4px; }
    .alphabet-bar::-webkit-scrollbar-thumb { background: #00a8e8; border-radius: 4px; }
    .alpha-btn { background: #1e293b; border: 1px solid rgba(255,255,255,0.05); color: #cbd5e1; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; white-space: nowrap; font-size: 0.85rem; transition: all 0.2s; flex-shrink: 0; }
    .alpha-btn:hover { background: #334155; color: #fff; }
    .alpha-btn.active { background: #00a8e8; color: #070b14; border-color: #00a8e8; box-shadow: 0 0 10px rgba(0,168,232,0.4); }
    
    .channels-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; min-height: 0; }
    .channels-list::-webkit-scrollbar { width: 6px; }
    .channels-list::-webkit-scrollbar-thumb { background: rgba(0,168,232,0.3); border-radius: 4px; }
    .channel-item { padding: 14px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); cursor: pointer; border-radius: 10px; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; height: 75px; }
    .channel-item:hover { background: rgba(0, 168, 232, 0.12); border-color: rgba(0, 168, 232, 0.3); transform: translateY(-2px); }
    .channel-name { font-size: 0.92rem; font-weight: 600; color: #e2e8f0; padding-right: 10px; text-align: left; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .play-icon { background: #00a8e8; color: #070b14; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; box-shadow: 0 2px 8px rgba(0,168,232,0.3); flex-shrink: 0; }

    @media (orientation: landscape) {
      .main-content-layout { display: grid; grid-template-columns: 380px 1fr; gap: 15px; height: calc(100vh - 80px); overflow: hidden; }
      .player-container { height: 100%; justify-content: flex-start; }
      .video-wrapper { height: 200px; max-width: 100%; }
      .sidebar-channels { height: 100%; }
    }

    @media (orientation: portrait) {
      .lobby-container { justify-content: center; padding-top: 50px; }
      .smarters-grid { grid-template-columns: 1fr; max-width: 380px; margin: 0 auto; }
      .channels-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="bg-custom-container"></div>
<div class="bg-overlay"></div>

<!-- LOGIN SIMPLIFICADO (ACCESO LIBRE) -->
<div id="login-view" class="view login-container">
  <div class="login-box">
    <div class="login-title">STREAM ONE</div>
    <div class="login-subtitle">Bienvenido a la plataforma de entretenimiento</div>
    <button class="login-btn" onclick="handleLoginFree()">ENTRAR A LA APP</button>
  </div>
</div>

<!-- LOBBY -->
<div id="lobby-view" class="view hidden">
  <div class="top-bar">
    <div class="user-profile-area" onclick="logoutSession()" title="Salir">
      <div class="user-avatar" id="user-avatar-initial">S</div>
      <span style="font-size: 0.85rem; font-weight: 700; color: #e2e8f0;" id="user-name-label">Stream One</span>
    </div>

    <div class="marquee-container">
      <div class="marquee-text">📢 Espero que disfrutes cada contenido que se ha hecho para Stream One</div>
    </div>

    <div class="top-bar-right"></div>
  </div>

  <div class="lobby-container">
    <div class="smarters-grid">
      <div class="card-smarters" onclick="openSection('tv')">
        <div class="lobby-bg-slideshow" id="slideshow-tv"></div>
        <div class="card-icon">📺</div>
        <div style="position:relative; z-index:2">
          <div style="font-weight:900; font-size:1.2rem; letter-spacing: 0.5px; color: #fff;">LIVE TV</div>
          <div class="loading-wrapper" id="load-tv">
            <div class="battery-container"><div class="battery-fill" id="bat-tv"></div></div>
            <div class="label" id="txt-tv">Sincronizando...</div>
          </div>
        </div>
      </div>
      <div class="card-smarters" onclick="openSection('movies')">
        <div class="lobby-bg-slideshow" id="slideshow-movies"></div>
        <div class="card-icon">🎬</div>
        <div style="position:relative; z-index:2">
          <div style="font-weight:900; font-size:1.2rem; letter-spacing: 0.5px; color: #fff;">PELÍCULAS</div>
          <div class="loading-wrapper" id="load-movies">
            <div class="battery-container"><div class="battery-fill" id="bat-movies"></div></div>
            <div class="label" id="txt-movies">Sincronizando...</div>
          </div>
        </div>
      </div>
      <div class="card-smarters" onclick="openSection('series')">
        <div class="lobby-bg-slideshow" id="slideshow-series"></div>
        <div class="card-icon">🎥</div>
        <div style="position:relative; z-index:2">
          <div style="font-weight:900; font-size:1.2rem; letter-spacing: 0.5px; color: #fff;">SERIES</div>
          <div class="loading-wrapper" id="load-series">
            <div class="battery-container"><div class="battery-fill" id="bat-series"></div></div>
            <div class="label" id="txt-series">Sincronizando...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- REPRODUCTOR -->
<div id="content-view" class="view hidden">
  <div class="content-view">
    <div class="header-nav">
      <button class="menu-icon-btn" onclick="goBackToLobby()" title="Volver al Menú Principal">
        <div class="menu-line"></div>
        <div class="menu-line"></div>
        <div class="menu-line"></div>
      </button>
      <h2 id="section-title" style="color: #00a8e8; letter-spacing: 1.5px; font-weight: 900;">LIVE TV</h2>
      <div style="width: 42px;"></div>
    </div>

    <div class="main-content-layout">
      <div class="player-container">
        <div id="current-channel-label" style="font-weight: 700; font-size: 1.05rem; color: #00a8e8;">Selecciona un elemento para reproducir</div>
        <div class="video-wrapper" id="video-wrapper-container">
          <video id="native-video-player" controls autoplay playsinline></video>
        </div>
      </div>

      <div class="sidebar-channels">
        <div class="alphabet-bar" id="alphabet-bar"></div>
        <div class="channels-list" id="channels-list-container"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const TV_PLAYLIST_URL = 'https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/canales';
  const MOVIES_PLAYLIST_URL = 'https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/Peliculas';
  const SERIES_PLAYLIST_URL = 'https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/Series';
  
  let contentData = { tv: [], movies: [], series: [] };
  let currentSectionType = 'tv';
  let hlsInstance = null;      
  let mpegtsInstance = null;  

  const images = {
    tv: ['https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=800&q=80', 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=800&q=80'],
    movies: ['https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80', 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=800&q=80'],
    series: ['https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=800&q=80', 'https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?auto=format&fit=crop&w=800&q=80']
  };

  function handleLoginFree() {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('lobby-view').classList.remove('hidden');
    initLobbyAnimations();
  }

  function logoutSession() {
    stopVideoPlayback();
    document.getElementById('lobby-view').classList.add('hidden');
    document.getElementById('content-view').classList.add('hidden');
    document.getElementById('login-view').classList.remove('hidden');
  }

  function stopVideoPlayback() {
    const videoPlayer = document.getElementById('native-video-player');
    videoPlayer.pause();
    videoPlayer.src = "";
    
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    if (mpegtsInstance) { mpegtsInstance.unload(); mpegtsInstance.detachMediaElement(); mpegtsInstance.destroy(); mpegtsInstance = null; }

    document.getElementById('current-channel-label').innerText = "Selecciona un elemento para reproducir";
  }

  async function loadAllPlaylists() {
    try {
      if (TV_PLAYLIST_URL) {
        const resTv = await fetch(TV_PLAYLIST_URL);
        contentData.tv = parseM3U(await resTv.text());
      }
      if (MOVIES_PLAYLIST_URL) {
        const resMovies = await fetch(MOVIES_PLAYLIST_URL);
        contentData.movies = parseM3U(await resMovies.text());
      }
      if (SERIES_PLAYLIST_URL) {
        const resSeries = await fetch(SERIES_PLAYLIST_URL);
        contentData.series = parseM3U(await resSeries.text());
      }
    } catch (e) {
      console.error("Error al cargar listas:", e);
    }
  }

  function parseM3U(data) {
    const lines = data.split('\n');
    let items = [];
    let currentExtinf = "";
    
    for (let i = 0; i < lines.length; i++) {
      let line = lines[i].trim();
      if (line.startsWith('#EXTINF')) {
        currentExtinf = line;
      } else if (line.startsWith('http') || line.startsWith('rtsp') || line.startsWith('magnet')) {
        if (currentExtinf) {
          let parts = currentExtinf.split(',');
          let name = parts[parts.length - 1].trim();
          let group = "GENERAL";
          let groupMatch = currentExtinf.match(/group-title="([^"]+)"/i);
          if (groupMatch && groupMatch[1]) group = groupMatch[1].trim();

          items.push({ name: name, url: line, group: group });
          currentExtinf = "";
        }
      }
    }
    return items;
  }

  function renderCategoryBar() {
    const bar = document.getElementById('alphabet-bar');
    bar.innerHTML = '<button class="alpha-btn active" onclick="filterByCategory(\'ALL\', this)">TODOS</button>';
    const activeList = contentData[currentSectionType] || [];
    let groups = [...new Set(activeList.map(item => item.group))].sort();

    groups.forEach(group => {
      bar.innerHTML += `<button class="alpha-btn" onclick="filterByCategory('${group.replace(/'/g, "\\'")}', this)">${group}</button>`;
    });
  }

  function renderItems(groupFilter = 'ALL') {
    const container = document.getElementById('channels-list-container');
    container.innerHTML = "";
    container.scrollTop = 0;

    const activeList = contentData[currentSectionType] || [];
    const filtered = activeList.filter(item => groupFilter === 'ALL' || item.group === groupFilter);

    if (filtered.length === 0) {
      container.innerHTML = '<div style="padding: 20px; text-align: center; color: #64748b; font-weight: 600; grid-column: 1 / -1;">No hay elementos en esta categoría</div>';
      return;
    }

    filtered.forEach(item => {
      const div = document.createElement('div');
      div.className = 'channel-item';
      div.innerHTML = `<span class="channel-name">${item.name}</span> <span class="play-icon">▶ Ver</span>`;
      div.onclick = () => {
        playStream(item.url, item.name);
      };
      container.appendChild(div);
    });
  }

  function filterByCategory(group, btn) {
    document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderItems(group);
  }

  function playStream(url, name) {
    document.getElementById('current-channel-label').innerText = "Reproduciendo: " + name;

    const videoPlayer = document.getElementById('native-video-player');
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    if (mpegtsInstance) { mpegtsInstance.unload(); mpegtsInstance.detachMediaElement(); mpegtsInstance.destroy(); mpegtsInstance = null; }

    if (url.endsWith('.ts') || url.includes('.ts?')) {
      if (mpegts.getFeatureList().mseLivePlayback) {
        mpegtsInstance = mpegts.createPlayer({ type: 'mse', isLive: true, url: url });
        mpegtsInstance.attachMediaElement(videoPlayer);
        mpegtsInstance.load();
        mpegtsInstance.play().catch(err => console.error("Error TS:", err));
      } else { alert("Tu navegador no soporta MPEG-TS."); }
    }
    else if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('live') || url.includes('stream'))) {
      hlsInstance = new Hls({ maxBufferLength: 30, liveSyncDurationCount: 3, lowLatencyMode: true });
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(videoPlayer);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() { videoPlayer.play().catch(err => console.error(err)); });
    } 
    else {
      videoPlayer.src = url;
      videoPlayer.load();
      videoPlayer.play().catch(err => console.error(err));
    }
  }

  function openSection(type) {
    currentSectionType = type;
    document.getElementById('lobby-view').classList.add('hidden');
    document.getElementById('content-view').classList.remove('hidden');
    document.getElementById('section-title').innerText = { tv: 'LIVE TV', movies: 'PELÍCULAS', series: 'SERIES' }[type];
    renderCategoryBar();
    renderItems('ALL');
  }

  function goBackToLobby() {
    stopVideoPlayback();
    document.getElementById('content-view').classList.add('hidden');
    document.getElementById('lobby-view').classList.remove('hidden');
  }

  function initLobbyAnimations() {
    ['tv', 'movies', 'series'].forEach(s => {
      const cont = document.getElementById(`slideshow-${s}`);
      if (cont.children.length === 0) {
        images[s].forEach((url, i) => {
          const d = document.createElement('div');
          d.className = `lobby-bg-slide ${i === 0 ? 'active' : ''}`;
          d.style.backgroundImage = `url('${url}')`;
          cont.appendChild(d);
        });
        let idx = 0;
        setInterval(() => {
          const slides = cont.querySelectorAll('.lobby-bg-slide');
          slides[idx].classList.remove('active');
          idx = (idx + 1) % slides.length;
          slides[idx].classList.add('active');
        }, 5000);
      }
    });

    ['tv', 'movies', 'series'].forEach(s => {
      let fill = document.getElementById(`bat-${s}`);
      let txt = document.getElementById(`txt-${s}`);
      let wrapper = document.getElementById(`load-${s}`);
      let width = 0;
      let interval = setInterval(() => {
        if (width >= 100) {
          clearInterval(interval);
          txt.innerText = `${contentData[s] ? contentData[s].length : 0} Elementos`;
          // Se esconde aplicando la clase fade-out
          setTimeout(() => {
            if (wrapper) wrapper.classList.add('fade-out');
          }, 400);
        } else {
          width += 10;
          fill.style.width = width + '%';
        }
      }, 150);
    });
  }

  window.onload = async () => {
    await loadAllPlaylists();
  };
</script>

</body>
</html>
