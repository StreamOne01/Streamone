<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Stream One - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
        :root { --bg-dark: #12091f; --card-bg: rgba(45, 27, 78, 0.85); --accent-orange: #ff6600; --text-main: #ffffff; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; margin: 0; height: 100vh; overflow: hidden; }
        #login-screen, #app-container, .sub-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; }
        #login-screen { background: #1a0b2e; justify-content: center; align-items: center; z-index: 999; }
        .login-box { background: #452b75; padding: 40px; border-radius: 20px; text-align: center; }
        #app-container { display: none; flex-direction: column; padding: 20px; }
        .bottom-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: auto; padding-bottom: 40px; }
        .menu-card { background: var(--card-bg); padding: 20px; text-align: center; cursor: pointer; border-radius: 15px; }
        .sub-view { display: none; background: var(--bg-dark); z-index: 10; flex-direction: column; padding: 20px; }
        .content-layout { display: flex; flex: 1; gap: 20px; overflow: hidden; }
        .list-box { width: 300px; overflow-y: auto; }
        .item-row { padding: 15px; background: var(--card-bg); margin-bottom: 10px; cursor: pointer; border-radius: 8px; }
        video { width: 100%; height: 100%; background: #000; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #444; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>STREAM ONE</h2>
            <input type="text" id="userInput" placeholder="Usuario"><br><br>
            <input type="password" id="passInput" placeholder="Contraseña"><br><br>
            <button onclick="realizarLogin()">Ingresar</button>
        </div>
    </div>

    <div id="app-container">
        <h1>Bienvenido, <span id="logged-username"></span></h1>
        <div class="bottom-nav" id="bottom-nav-grid"></div>
    </div>

    <div id="livetv-view" class="sub-view">
        <button onclick="cerrarSubViews()">Volver</button>
        <div class="content-layout">
            <div class="list-box" id="channels-container"></div>
            <video id="videoLive" controls autoplay></video>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2bElfqnPuLh1qW-APJ9FdpSdbw4hSpDwg8BDwSyLdFSltJWhxBmxoXvoiqP4_1ND6NQ/exec';
        let channelsData = [];

        async function realizarLogin() {
            const user = document.getElementById('userInput').value;
            const res = await fetch(SCRIPT_URL);
            const users = await res.json();
            const found = users.find(u => u.usuario == user && u.estado == "ON");
            if (found) {
                document.getElementById('logged-username').innerText = found.usuario;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                construirBotonera(found.usuario);
                cargarCanales();
            } else { alert("Acceso denegado"); }
        }

        function construirBotonera(user) {
            const grid = document.getElementById('bottom-nav-grid');
            grid.innerHTML = `<div class="menu-card" onclick="abrirLiveTV()">📺 Live TV</div>`;
        }

        async function cargarCanales() {
            const res = await fetch(`${SCRIPT_URL}?action=init`);
            const json = await res.json();
            if (json.canales) {
                const lines = json.canales.split('\n');
                channelsData = [];
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF:')) {
                        channelsData.push({ title: lines[i].split(',')[1], url: lines[i+1] });
                    }
                }
                const container = document.getElementById('channels-container');
                channelsData.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'item-row';
                    div.innerText = item.title;
                    div.onclick = () => { document.getElementById('videoLive').src = item.url; };
                    container.appendChild(div);
                });
            }
        }

        function abrirLiveTV() { document.getElementById('livetv-view').style.display = 'flex'; }
        function cerrarSubViews() { document.querySelectorAll('.sub-view').forEach(v => v.style.display = 'none'); }
    </script>
</body>
</html>
