<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream One</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
        :root {
            --purple-bg: #1a0b2e;
            --purple-panel: #2d1b4e;
            --purple-card: #452b75;
            --accent-orange: #ff6600;
            --text-main: #ffffff;
            --text-dim: #b3a5c9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background: linear-gradient(135deg, #1a0b2e 0%, var(--purple-panel) 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Login */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 11, 46, 0.95);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box {
            background: var(--purple-card); padding: 40px; border-radius: 20px; text-align: center; width: 320px;
        }
        .login-box h2 { color: var(--accent-orange); margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #2d1b4e; color: white; }
        .login-box button { width: 100%; background: var(--accent-orange); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* App */
        #app-container { width: 100%; height: 100vh; display: none; }
        #sidebar { width: 300px; background: rgba(0,0,0,0.3); padding: 25px; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; }
        .menu-logo { font-size: 1.3rem; font-weight: bold; margin-bottom: 30px; color: var(--accent-orange); }
        .nav-item { background: var(--purple-card); padding: 15px 20px; margin-bottom: 10px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; display: flex; justify-content: space-between; align-items: center; }
        .nav-item:hover, .nav-item.active { border-color: var(--accent-orange); background: #5a3a96; }
        #main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .channel-card { background: var(--purple-card); padding: 15px 20px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; cursor: pointer; }
        .channel-card:hover { background: #5a3a96; border: 1px solid var(--accent-orange); }
        #player-side { width: 420px; background: rgba(0,0,0,0.4); padding: 25px; border-left: 1px solid rgba(255,255,255,0.1); }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>STREAM ONE</h2>
            <input type="text" id="userInput" placeholder="Usuario">
            <input type="password" id="passInput" placeholder="Contraseña">
            <button onclick="realizarLogin()">Ingresar</button>
        </div>
    </div>

    <div id="app-container">
        <div id="sidebar">
            <div class="menu-logo">STREAM ONE</div>
            <div class="nav-item active" onclick="location.reload()">🏠 Menú Principal</div>
            <div id="categories-container"></div>
        </div>
        <div id="main-content">
            <h1 id="title-display" style="color:var(--accent-orange); margin-bottom:20px;">Selecciona una categoría</h1>
            <div id="channels-container"></div>
        </div>
        <div id="player-side">
            <h3>Reproductor Integrado</h3>
            <div class="video-box">
                <video id="videoElement" controls autoplay></video>
            </div>
            <h4 id="playing-title">Ningún canal seleccionado</h4>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwgZNMZUmhU0_LDZ3KlR70he0gjY0fvVyh7AkCxZO_CkWxJ52OYf41CLyjquRu2hc2jJA/exec';
        let channelsData = [];
        let mpegtsPlayer = null;

        async function realizarLogin() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;

            try {
                const response = await fetch(SCRIPT_URL);
                const users = await response.json();
                const found = users.find(u => u.usuario == user && u.password == pass && u.estado == "ON");

                if (found) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app-container').style.display = 'flex';
                    loadPlaylist();
                } else {
                    alert("Acceso denegado: Usuario incorrecto o cuenta inactiva.");
                }
            } catch (e) {
                alert("Error de conexión con la base de datos.");
            }
        }

        async function loadPlaylist() {
            const response = await fetch('StreamOne.m3u');
            const data = await response.text();
            parseM3U(data);
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            let cat = "General";
            lines.forEach(line => {
                if (line.startsWith('#EXTINF:')) {
                    const match = line.match(/group-title="([^"]+)"/);
                    if (match) cat = match[1];
                    const name = line.split(',')[1];
                    channelsData.push({ title: name, category: cat, url: '' });
                } else if (line.trim() && !line.startsWith('#')) {
                    channelsData[channelsData.length - 1].url = line.trim();
                }
            });
            render();
        }

        function render() {
            const container = document.getElementById('categories-container');
            const cats = [...new Set(channelsData.map(c => c.category))];
            cats.forEach(c => {
                const div = document.createElement('div');
                div.className = 'nav-item';
                div.innerHTML = `<span>${c}</span>`;
                div.onclick = () => filter(c);
                container.appendChild(div);
            });
        }

        function filter(cat) {
            document.getElementById('title-display').innerText = cat;
            const container = document.getElementById('channels-container');
            container.innerHTML = '';
            channelsData.filter(c => c.category === cat).forEach(ch => {
                const div = document.createElement('div');
                div.className = 'channel-card';
                div.innerHTML = `<span>${ch.title}</span>`;
                div.onclick = () => play(ch);
                container.appendChild(div);
            });
        }

        function play(ch) {
            document.getElementById('playing-title').innerText = ch.title;
            const videoElement = document.getElementById('videoElement');
            if (mpegtsPlayer) mpegtsPlayer.destroy();
            if (ch.url.includes('.ts')) {
                mpegtsPlayer = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: ch.url });
                mpegtsPlayer.attachMediaElement(videoElement);
                mpegtsPlayer.load();
                mpegtsPlayer.play();
            } else {
                videoElement.src = ch.url;
            }
        }
    </script>
</body>
</html>
