<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream One Player - Secure Access</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
        :root {
            --bg-color: #070b14;
            --header-bg: #0f172a;
            --active-color: #007bff;
            --hub-hover: #ff5722;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', sans-serif; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; }

        /* --- LOGIN VIEW --- */
        #loginView { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: var(--bg-color); z-index: 100; position: fixed; width: 100%; }
        .login-card { background: var(--header-bg); padding: 40px; border-radius: 15px; border: 1px solid var(--border-color); text-align: center; width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .login-card h2 { letter-spacing: 2px; margin-bottom: 20px; color: #fff; }
        .login-card input { display: block; width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: white; outline: none; }
        .login-card input:focus { border-color: var(--active-color); }
        .login-card button { width: 100%; padding: 12px; background: var(--active-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .login-card button:hover { background: #0056b3; }

        /* --- LOBBY ATMOSFÉRICO --- */
        #lobbyView { display: none; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; position: fixed; top: 0; left: 0; width: 100%; z-index: 10; background: radial-gradient(circle at 50% 30%, #0f1c3f 0%, #070b14 70%); padding: 30px 15px; }
        .lobby-logo-title { font-size: 3rem; font-weight: 800; letter-spacing: 4px; margin-bottom: 25px; text-align: center; color: white; }
        .lobby-container { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .hub-card { width: 260px; height: 380px; border-radius: 18px; background: #0f172a; border: 2px solid rgba(255,255,255,0.15); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 30px; position: relative; overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
        .hub-card:hover { transform: translateY(-10px); border-color: var(--hub-hover); }

        /* --- VISTA INTERNA --- */
        #internalView { display: none; flex-direction: column; height: 100vh; width: 100%; }
        header { background: var(--header-bg); padding: 15px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); align-items: center; }
        main { display: grid; grid-template-columns: 260px 320px 1fr; flex-grow: 1; padding: 15px; gap: 15px; overflow: hidden; }
        .panel { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); overflow-y: auto; border-radius: 8px; }
        .list-item { padding: 14px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .list-item:hover { background: rgba(255,255,255,0.05); }
        .list-item.active { background-color: var(--active-color); }
        .video-col { display: flex; flex-direction: column; background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .player-box { width: 100%; aspect-ratio: 16/9; background: #000; }
        
        /* --- MODO MÓVIL --- */
        body.layout-mobile header { display: none; }
        body.layout-mobile main { display: flex; flex-direction: column; }
        body.layout-mobile .video-col { order: -1; }
        body.layout-mobile .epg-box { display: none; }
        .floating-back-btn { display: none; position: absolute; top: 10px; left: 10px; z-index: 50; background: rgba(0,0,0,0.7); color: white; padding: 8px 15px; border-radius: 20px; border: none; cursor: pointer; }
        body.layout-mobile .floating-back-btn { display: block; }
    </style>
</head>
<body>

    <!-- PANTALLA LOGIN -->
    <div id="loginView">
        <div class="login-card">
            <h2>STREAM ONE</h2>
            <input type="text" id="userInput" placeholder="Usuario">
            <input type="password" id="passInput" placeholder="Contraseña">
            <button onclick="validarUsuario()">ENTRAR</button>
        </div>
    </div>

    <!-- LOBBY -->
    <div id="lobbyView">
        <div class="lobby-logo-title">STREAM ONE</div>
        <div class="lobby-container">
            <div class="hub-card" onclick="openModule('LIVE TV')"><h2>LIVE TV</h2></div>
            <div class="hub-card" onclick="openModule('MOVIES')"><h2>MOVIES</h2></div>
            <div class="hub-card" onclick="openModule('SERIES')"><h2>SERIES</h2></div>
        </div>
    </div>

    <!-- VISTA INTERNA -->
    <div id="internalView">
        <button class="floating-back-btn" onclick="goBackToLobby()">⬅ Volver</button>
        <header>
            <div id="moduleTitle" style="font-weight: bold; letter-spacing: 1px;">IPTV PLAYER</div>
        </header>
        <main>
            <section class="panel" id="categoriesPanel"></section>
            <section class="panel" id="channelsPanel"></section>
            <section class="video-col">
                <div class="player-box"><video id="videoPlayer" controls autoplay playsinline style="width:100%; height:100%;"></video></div>
            </section>
        </main>
    </div>

    <script>
        // Función de autenticación conectada a tu Google Sheet a través de Apps Script
        async function validarUsuario() {
            const user = document.getElementById('userInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOjb8M8UgQ4tDhhYyPLoKHsLbw4ebx9Xb00Ij_FQt9qgPZ3iJPzcMx5uzShW5qRmGC/exec';

            if (!user || !pass) {
                alert("Por favor ingrese usuario y contraseña.");
                return;
            }

            try {
                // Indicador visual opcional de carga
                const btn = document.querySelector('.login-card button');
                btn.textContent = "VERIFICANDO...";
                btn.disabled = true;

                const response = await fetch(SCRIPT_URL);
                const validUsers = await response.json();
                
                // Búsqueda del usuario en la base de datos (validando usuario, contraseña y estado activo)
                const userFound = validUsers.find(u => 
                    String(u.usuario).trim() === user && 
                    String(u.password).trim() === pass && 
                    String(u.estado).toLowerCase().trim() === 'activo'
                );
                
                if (userFound) {
                    document.getElementById('loginView').style.display = 'none';
                    document.getElementById('lobbyView').style.display = 'flex';
                } else {
                    alert("Acceso denegado: Credenciales incorrectas o usuario inactivo.");
                }
            } catch (err) {
                console.error(err);
                alert("Error al conectar con el servidor de usuarios.");
            } finally {
                const btn = document.querySelector('.login-card button');
                btn.textContent = "ENTRAR";
                btn.disabled = false;
            }
        }

        // Detección móvil automática
        function detectarTipoDispositivo() {
            const isMobile = /Android|iPhone|iPad|iPod|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
            document.body.classList.toggle('layout-mobile', isMobile);
        }
        window.addEventListener('resize', detectarTipoDispositivo);
        document.addEventListener('DOMContentLoaded', detectarTipoDispositivo);

        function openModule(m) { 
            document.getElementById('lobbyView').style.display = 'none'; 
            document.getElementById('internalView').style.display = 'flex'; 
            document.getElementById('moduleTitle').textContent = m;
        }

        function goBackToLobby() {
            document.getElementById('internalView').style.display = 'none';
            document.getElementById('lobbyView').style.display = 'flex';
        }
    </script>
</body>
</html>
