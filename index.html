<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream One Player - Smarters Mode Complete</title>
    <!-- Librerías de reproducción HLS y MPEG-TS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
        :root {
            --bg-color: #070b14;
            --header-bg: #0f172a;
            --active-color: #007bff;
            --hub-hover: #ff5722;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- LOBBY ATMOSFÉRICO ADAPTABLE --- */
        #lobbyView {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%;
            z-index: 10;
            overflow-y: auto;
            background: radial-gradient(circle at 50% 30%, #0f1c3f 0%, #070b14 70%);
            padding: 30px 15px;
        }

        .ambient-light {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 1;
            opacity: 0.45;
            pointer-events: none;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }

        .orb-1 { width: 450px; height: 450px; background: rgba(0, 123, 255, 0.45); top: -10%; left: 15%; }
        .orb-2 { width: 400px; height: 400px; background: rgba(255, 87, 34, 0.25); bottom: -15%; right: 15%; animation-delay: -4s; }
        .orb-3 { width: 300px; height: 300px; background: rgba(147, 51, 234, 0.3); top: 40%; right: 5%; animation-delay: -8s; }

        @keyframes floatOrb {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(35px) scale(1.1); }
        }

        .grid-overlay {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }

        .lobby-logo-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-shadow: 0 0 25px rgba(0, 123, 255, 0.5), 0 4px 15px rgba(0,0,0,0.8);
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 3;
            position: relative;
            text-align: center;
        }

        .lobby-container {
            display: flex;
            gap: 25px;
            z-index: 3;
            position: relative;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .hub-card {
            width: 260px;
            height: 380px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 30px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
            background: #0f172a;
        }

        .hub-card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: var(--hub-hover);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 20px rgba(255, 87, 34, 0.4);
        }

        .card-slider {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            z-index: 1;
        }

        .card-slide {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .card-slide.active { 
            opacity: 1; 
        }

        .card-overlay {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(to top, rgba(7, 11, 20, 0.95) 25%, rgba(7, 11, 20, 0.2) 100%);
            z-index: 2;
        }

        .hub-card .content-box {
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .hub-card .icon { 
            font-size: 3rem; 
            margin-bottom: 15px; 
            text-shadow: 0 4px 10px rgba(0,0,0,0.8); 
        }

        .hub-card h2 { 
            font-size: 1.3rem; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            margin-bottom: 8px; 
            text-shadow: 0 2px 5px rgba(0,0,0,0.8); 
        }

        .hub-card .preview-hint { 
            font-size: 0.75rem; 
            color: #cbd5e1; 
            text-shadow: 0 1px 3px rgba(0,0,0,0.8); 
        }

        /* --- VISTA INTERNA (ESCRITORIO / TABLET / TV) --- */
        #internalView {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        header {
            background: var(--header-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        .app-title { 
            font-size: clamp(1rem, 2vw, 1.3rem); 
            font-weight: bold; 
            letter-spacing: 1px; 
        }

        .nav-icons span { 
            margin-left: 15px; 
            font-size: 1.2rem; 
            cursor: pointer; 
        }

        main {
            display: grid;
            grid-template-columns: 260px 320px 1fr;
            flex-grow: 1;
            padding: 15px;
            gap: 15px;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            overflow-y: auto;
            border-radius: 8px;
        }

        .list-item {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .list-item:hover { 
            background: rgba(255,255,255,0.05); 
        }

        .list-item.active { 
            background-color: var(--active-color); 
        }

        .video-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .player-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-shrink: 0;
        }

        .player-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .epg-box {
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 2px solid var(--active-color);
            border-radius: 6px;
        }

        .live-tag {
            color: white;
            background: red;
            padding: 3px 10px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        /* --- MODO MÓVIL (ESTILO IPTV SMARTERS PRO) --- */
        body.layout-mobile header {
            display: none; 
        }

        body.layout-mobile #internalView main {
            display: flex;
            flex-direction: column;
            padding: 5px;
            gap: 8px;
        }

        body.layout-mobile .video-col {
            order: -1; 
            flex: 0 0 auto;
        }

        body.layout-mobile .player-box {
            max-height: 38vh;
            border-radius: 0 0 10px 10px;
        }

        body.layout-mobile .epg-box {
            display: none; 
        }

        body.layout-mobile #categoriesPanel {
            flex: 1;
            max-height: 100%;
        }

        body.layout-mobile #channelsPanel {
            flex: 1.5;
            max-height: 100%;
        }

        body.layout-mobile .list-item {
            padding: 12px 10px;
            font-size: 0.95rem;
        }

        .floating-back-btn {
            display: none;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 50;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        body.layout-mobile .floating-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* --- BREAKPOINTS GENERALES --- */
        @media screen and (max-width: 1024px) and (min-width: 769px) {
            main {
                grid-template-columns: 220px 280px 1fr;
                padding: 10px;
                gap: 10px;
            }
        }

        @media screen and (min-width: 1600px) {
            main {
                grid-template-columns: 320px 400px 1fr;
                padding: 25px;
                gap: 25px;
            }
            body { 
                font-size: 1.15rem; 
            }
            .hub-card { 
                width: 320px; 
                height: 460px; 
            }
        }
    </style>
</head>
<body>

    <!-- LOBBY PRINCIPAL -->
    <div id="lobbyView">
        <div class="ambient-light orb-1"></div>
        <div class="ambient-light orb-2"></div>
        <div class="ambient-light orb-3"></div>
        <div class="grid-overlay"></div>

        <div class="lobby-logo-title">STREAM ONE</div>
        <div class="lobby-container">
            
            <div class="hub-card" onclick="openModule('LIVE TV')">
                <div class="card-slider" id="sliderLive">
                    <div class="card-slide active" style="background-image: url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=800&auto=format&fit=crop');"></div>
                    <div class="card-slide" style="background-image: url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=800&auto=format&fit=crop');"></div>
                    <div class="card-slide" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800&auto=format&fit=crop');"></div>
                </div>
                <div class="card-overlay"></div>
                <div class="content-box">
                    <div class="icon">⚽</div>
                    <h2>Live TV</h2>
                </div>
            </div>

            <div class="hub-card" onclick="openModule('MOVIES')">
                <div class="card-slider" id="sliderMovies">
                    <div class="card-slide active" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=800&auto=format&fit=crop');"></div>
                    <div class="card-slide" style="background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=800&auto=format&fit=crop');"></div>
                    <div class="card-slide" style="background-image: url('https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=800&auto=format&fit=crop');"></div>
                </div>
                <div class="card-overlay"></div>
                <div class="content-box">
                    <div class="icon">🍿</div>
                    <h2>Movies</h2>
                    <div class="preview-hint">Estrenos Exclusivos y Taquilleras</div>
                </div>
            </div>

            <div class="hub-card" onclick="openModule('SERIES')">
                <div class="card-slider" id="sliderSeries">
                    <div class="card-slide active" style="background-image: url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=800&auto=format&fit=crop');"></div>
                    <div class="card-slide" style="background-image: url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800&auto=format&fit=crop');"></div>
                    <div class="card-slide" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800&auto=format&fit=crop');"></div>
                </div>
                <div class="card-overlay"></div>
                <div class="content-box">
                    <div class="icon">🎬</div>
                    <h2>Series</h2>
                    <div class="preview-hint">Netflix • HBO • Disney+ • Apple & más</div>
                </div>
            </div>

        </div>
    </div>

    <!-- VISTA INTERNA -->
    <div id="internalView">
        <button class="floating-back-btn" onclick="goBackToLobby()">⬅ Volver</button>
        <header>
            <div class="app-title" id="moduleTitle">IPTV STREAM PLAYER</div>
            <div class="nav-icons">
                <span onclick="goBackToLobby()" style="cursor:pointer;" title="Volver al Lobby">🏠</span> 
                <span>↕</span> <span>🎬</span> <span>⏻</span>
            </div>
        </header>
        <main id="mainLayout">
            <!-- COLUMNA 1: CATEGORÍAS -->
            <section class="panel" id="categoriesPanel">
                <div style="padding: 20px; text-align: center; color: #888;">Cargando categorías...</div>
            </section>

            <!-- COLUMNA 2: CONTENIDO -->
            <section class="panel" id="channelsPanel">
                <div style="padding: 20px; text-align: center; color: #888;">Selecciona una categoría</div>
            </section>

            <!-- COLUMNA 3: REPRODUCTOR Y EPG -->
            <section class="video-col">
                <div class="player-box">
                    <video id="videoPlayer" controls autoplay playsinline crossorigin="anonymous"></video>
                </div>
                <div class="epg-box">
                    <div class="live-tag" id="tagType">LIVE TV</div>
                    <div id="currentChannelName" style="font-size: 1.1rem; font-weight: bold; margin-bottom: 6px;">SELECCIONA UN CONTENIDO</div>
                    <p id="currentChannelDesc" style="color: #aaa; font-size: 0.85rem;">Disfruta de la programación en Stream One</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        const M3U_URLS = {
            'LIVE TV': 'https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/canales',
            'MOVIES': 'https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/Peliculas',
            'SERIES': 'https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/Series'
        };

        let currentPlaylistData = {}; 
        let currentHls = null;
        let mpegtsInstance = null;

        // Detector automático de dispositivos y resolución para adaptar interfaz móvil tipo Smarters
        function detectarTipoDispositivo() {
            const width = window.innerWidth;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || width <= 768;
            
            document.body.classList.remove('layout-mobile', 'layout-desktop');

            if (isMobile) {
                document.body.classList.add('layout-mobile');
            } else {
                document.body.classList.add('layout-desktop');
            }
        }

        window.addEventListener('resize', detectarTipoDispositivo);
        document.addEventListener('DOMContentLoaded', detectarTipoDispositivo);

        // Animación automática de las tarjetas del lobby
        document.addEventListener("DOMContentLoaded", () => {
            ['sliderLive', 'sliderMovies', 'sliderSeries'].forEach(sliderId => {
                const slider = document.getElementById(sliderId);
                if(slider) {
                    const slides = slider.querySelectorAll('.card-slide');
                    let currentSlide = 0;
                    if(slides.length > 1) {
                        setInterval(() => {
                            slides[currentSlide].classList.remove('active');
                            currentSlide = (currentSlide + 1) % slides.length;
                            slides[currentSlide].classList.add('active');
                        }, 4000);
                    }
                }
            });
        });

        function openModule(moduleType) {
            document.getElementById('lobbyView').style.display = 'none';
            document.getElementById('internalView').style.display = 'flex';
            
            const titleEl = document.getElementById('moduleTitle');
            const tagEl = document.getElementById('tagType');
            
            if(moduleType === 'LIVE TV') {
                titleEl.innerText = "IPTV STREAM PLAYER - LIVE TV";
                tagEl.innerText = "LIVE SPORTS";
            } else if(moduleType === 'MOVIES') {
                titleEl.innerText = "IPTV STREAM PLAYER - MOVIES";
                tagEl.innerText = "MOVIE PLAYER";
            } else if(moduleType === 'SERIES') {
                titleEl.innerText = "IPTV STREAM PLAYER - SERIES";
                tagEl.innerText = "SERIES PLAYER";
            }

            loadPlaylistForModule(moduleType);
        }

        function loadPlaylistForModule(moduleType) {
            const container = document.getElementById('categoriesPanel');
            container.innerHTML = `<div style="padding: 20px; text-align: center; color: #888;">Cargando contenido...</div>`;

            const url = M3U_URLS[moduleType];

            fetch(url)
            .then(res => res.text())
            .then(data => {
                parseM3U(data);
                renderCategories();
            })
            .catch(err => {
                console.error("Error cargando la lista:", err);
                container.innerHTML = `<div style="padding: 20px; text-align: center; color: #ff4d4d;">Error al cargar datos</div>`;
            });
        }

        function parseM3U(content) {
            currentPlaylistData = {};
            const lines = content.split('\n');
            let currentCategory = "GENERAL";
            let currentName = "";
            let currentLogo = "";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let groupMatch = line.match(/group-title="([^"]*)"/);
                    if (groupMatch && groupMatch[1]) {
                        currentCategory = groupMatch[1].trim();
                    } else {
                        currentCategory = "GENERAL";
                    }

                    let logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    currentLogo = logoMatch ? logoMatch[1] : "";

                    let commaIdx = line.lastIndexOf(',');
                    if (commaIdx !== -1) {
                        currentName = line.substring(commaIdx + 1).trim();
                    }
                } else if (line && !line.startsWith('#')) {
                    let streamUrl = line;
                    if (!currentPlaylistData[currentCategory]) {
                        currentPlaylistData[currentCategory] = [];
                    }
                    currentPlaylistData[currentCategory].push({
                        name: currentName || "Sin nombre",
                        url: streamUrl,
                        logo: currentLogo
                    });
                }
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoriesPanel');
            container.innerHTML = "";

            const categories = Object.keys(currentPlaylistData);
            if (categories.length === 0) {
                container.innerHTML = `<div style="padding: 20px; text-align: center; color: #888;">No hay categorías</div>`;
                return;
            }

            categories.forEach((cat, index) => {
                const count = currentPlaylistData[cat].length;
                const div = document.createElement('div');
                div.className = `list-item ${index === 0 ? 'active' : ''}`;
                div.innerHTML = `<span>${cat}</span> <span>${count}</span>`;
                div.onclick = () => {
                    document.querySelectorAll('#categoriesPanel .list-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    renderItems(cat);
                };
                container.appendChild(div);

                if (index === 0) {
                    renderItems(cat);
                }
            });
        }

        function renderItems(category) {
            const container = document.getElementById('channelsPanel');
            container.innerHTML = "";

            const items = currentPlaylistData[category] || [];
            if (items.length === 0) {
                container.innerHTML = `<div style="padding: 20px; text-align: center; color: #888;">Sin contenido</div>`;
                return;
            }

            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `list-item ${index === 0 ? 'active' : ''}`;
                div.innerHTML = `<span>${index + 1}</span> <span>${item.name}</span>`;
                div.onclick = () => {
                    document.querySelectorAll('#channelsPanel .list-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    playStream(item);
                };
                container.appendChild(div);

                if (index === 0) {
                    playStream(item);
                }
            });
        }

        function playStream(item) {
            document.getElementById('currentChannelName').innerText = item.name;
            document.getElementById('currentChannelDesc').innerText = "Reproduciendo en página...";

            const video = document.getElementById('videoPlayer');

            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }
            if (mpegtsInstance) {
                mpegtsInstance.unload();
                mpegtsInstance.detachMediaElement();
                mpegtsInstance.destroy();
                mpegtsInstance = null;
            }

            video.pause();
            video.removeAttribute('src');
            video.load();

            const url = item.url;

            if (url.endsWith('.ts') || url.includes('.ts?')) {
                if (mpegts.getFeatureList().mseLivePlayback) {
                    mpegtsInstance = mpegts.createPlayer({ type: 'mse', isLive: true, url: url });
                    mpegtsInstance.attachMediaElement(video);
                    mpegtsInstance.load();
                    mpegtsInstance.play().catch(err => {
                        console.error("Error reproduciendo flujo TS:", err);
                        document.getElementById('currentChannelDesc').innerText = "Error al reproducir el flujo TS";
                    });
                } else {
                    document.getElementById('currentChannelDesc').innerText = "Tu navegador no soporta MPEG-TS nativo";
                }
            } else if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('m3u8'))) {
                currentHls = new Hls({ maxBufferLength: 30, liveSyncDurationCount: 3, lowLatencyMode: true });
                currentHls.loadSource(url);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(err => console.error("Error HLS:", err));
                });
                currentHls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        document.getElementById('currentChannelDesc').innerText = "Error en el flujo HLS";
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.load();
                video.play().catch(() => {});
            } else {
                video.src = url;
                video.load();
                video.play().catch(err => {
                    console.error("Error reproductor directo:", err);
                });
            }
        }

        function goBackToLobby() {
            const video = document.getElementById('videoPlayer');
            video.pause();
            video.removeAttribute('src');
            video.load();
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            if (mpegtsInstance) {
                mpegtsInstance.unload();
                mpegtsInstance.detachMediaElement();
                mpegtsInstance.destroy();
                mpegtsInstance = null;
            }
            document.getElementById('internalView').style.display = 'none';
            document.getElementById('lobbyView').style.display = 'flex';
        }
    </script>
</body>
</html>
