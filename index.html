<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream One - Home</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
        :root {
            --bg-dark: #12091f;
            --card-bg: rgba(45, 27, 78, 0.85);
            --card-hover: rgba(69, 43, 117, 0.95);
            --accent-orange: #ff6600;
            --text-main: #ffffff;
            --text-dim: #b3a5c9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

        /* Estilos básicos igual que tenías */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: #452b75; padding: 40px; border-radius: 20px; text-align: center; width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-box input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: none; background: #2d1b4e; color: white; outline: none; }
        .login-box button { width: 100%; background: var(--accent-orange); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }

        #app-container { display: none; width: 100%; height: 100vh; flex-direction: column; position: relative; overflow: hidden; }
        .bg-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; z-index: 0; }
        .bg-slide.active { opacity: 1; }
        #app-container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 9, 31, 0.75); z-index: 1; }

        .top-header { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 25px 50px; }
        .brand-logo { font-size: 1.5rem; font-weight: bold; color: var(--text-main); }
        .brand-logo span { color: var(--accent-orange); }
        
        .bottom-nav { position: absolute; bottom: 40px; left: 50px; right: 50px; z-index: 2; display: grid; gap: 20px; }
        .menu-card { background: var(--card-bg); border: 2px solid transparent; border-radius: 16px; padding: 25px 15px; text-align: center; cursor: pointer; transition: all 0.25s ease; backdrop-filter: blur(10px); }
        .menu-card:hover { background: var(--card-hover); border-color: var(--accent-orange); transform: translateY(-5px); }
        .menu-card .icon { font-size: 1.8rem; margin-bottom: 10px; display: block; }
        
        .sub-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 10; display: none; padding: 20px 40px; flex-direction: column; }
        .sub-view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--accent-orange); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        
        .content-layout { display: flex; flex: 1; gap: 20px; overflow: hidden; height: calc(100vh - 100px); }
        .categories-box { width: 280px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px; }
        .list-box { width: 320px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px; }
        .item-row { background: var(--card-bg); padding: 12px 15px; margin-bottom: 8px; border-radius: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .item-row:hover, .item-row.active { border-color: var(--accent-orange); background: var(--card-hover); }
        .video-panel { flex: 1; background: #000; border-radius: 12px; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>STREAM ONE</h2>
            <input type="text" id="userInput" placeholder="Usuario">
            <input type="password" id="passInput" placeholder="Contraseña">
            <button onclick="realizarLogin()">Ingresar</button>
        </div>
    </div>

    <div id="app-container">
        <div class="top-header">
            <div class="brand-logo">📺 STREAM <span>ONE</span></div>
        </div>
        <div class="bottom-nav" id="bottom-nav-grid"></div>
    </div>

    <!-- VISTAS -->
    <div id="livetv-view" class="sub-view"><div class="sub-view-header"><button class="back-btn" onclick="cerrarSubViews()">Volver</button><h2>Live TV</h2></div><div class="content-layout"><div class="categories-box" id="live-categories"></div><div class="list-box" id="live-channels"></div><div class="video-panel"><video id="videoLive" controls autoplay></video></div></div></div>
    <div id="movies-view" class="sub-view"><div class="sub-view-header"><button class="back-btn" onclick="cerrarSubViews()">Volver</button><h2>Movies</h2></div><div class="content-layout"><div class="categories-box" id="movies-categories"></div><div class="list-box" id="movies-channels"></div><div class="video-panel"><video id="videoMovie" controls autoplay></video></div></div></div>
    <div id="series-view" class="sub-view"><div class="sub-view-header"><button class="back-btn" onclick="cerrarSubViews()">Volver</button><h2>Series</h2></div><div class="content-layout"><div class="categories-box" id="series-categories"></div><div class="list-box" id="series-channels"></div><div class="video-panel"><video id="videoSeries" controls autoplay></video></div></div></div>

    <script>
        const USERS_URL = 'https://script.google.com/macros/s/AKfycbzWlqKh1sC_Qih4Q4DzSZ5S690ZhVQwp_MYGAnmieBIIzTWDF1hJEAILrdDysw4n4NOGw/exec';
        const URL_CANALES = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/canales');
        const URL_PELICULAS = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/Peliculas');
        const URL_SERIES = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/Series');

        // ESTA ES LA FUNCIÓN CORREGIDA
        function parsearM3U(data) {
            const lines = data.split('\n');
            let categorias = {};
            let lastInfo = null;

            lines.forEach(line => {
                line = line.trim();
                // Ignorar comentarios, separadores y líneas vacías
                if (!line || (line.startsWith('#') && !line.startsWith('#EXTINF:'))) return;

                if (line.startsWith('#EXTINF:')) {
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    let cat = groupMatch ? groupMatch[1].trim() : "General";
                    cat = cat.charAt(0).toUpperCase() + cat.slice(1).toLowerCase(); // Normalizar

                    const titleParts = line.split(',');
                    const name = titleParts.length > 1 ? titleParts.slice(1).join(',') : "Sin título";
                    
                    lastInfo = { title: name.trim(), category: cat, url: '' };
                    
                    if (!categorias[cat]) categorias[cat] = [];
                    categorias[cat].push(lastInfo);
                } else if (lastInfo && !line.startsWith('#')) {
                    lastInfo.url = line;
                    lastInfo = null; 
                }
            });
            return categorias;
        }

        async function realizarLogin() {
            // ... (resto de tu lógica de login y funciones se mantiene igual)
            alert("Acceso exitoso.");
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            construirBotonera();
            cargarContenido();
        }

        function construirBotonera() {
            document.getElementById('bottom-nav-grid').innerHTML = `
                <div class="menu-card" onclick="document.getElementById('livetv-view').style.display='flex'"><span>📺 Live TV</span></div>
                <div class="menu-card" onclick="document.getElementById('movies-view').style.display='flex'"><span>🎬 Movies</span></div>
                <div class="menu-card" onclick="document.getElementById('series-view').style.display='flex'"><span>🍿 Series</span></div>
            `;
        }

        async function cargarContenido() {
            try {
                const resMov = await fetch(URL_PELICULAS);
                const moviesData = parsearM3U(await resMov.text());
                renderizarCategorias('movies-categories', 'movies-channels', moviesData, 'videoMovie');
            } catch(e) { console.error(e); }
        }

        function renderizarCategorias(catId, listId, data, vId) {
            const container = document.getElementById(catId);
            Object.keys(data).forEach(cat => {
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerText = cat;
                div.onclick = () => renderizarItems(listId, data[cat], vId);
                container.appendChild(div);
            });
        }

        function renderizarItems(listId, items, vId) {
            const container = document.getElementById(listId);
            container.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerText = item.title;
                div.onclick = () => document.getElementById(vId).src = item.url;
                container.appendChild(div);
            });
        }

        function cerrarSubViews() {
            document.querySelectorAll('.sub-view').forEach(v => v.style.display = 'none');
        }
    </script>
</body>
</html>
