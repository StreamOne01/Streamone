<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Stream One</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
        body { background: #12091f; color: white; font-family: sans-serif; margin: 0; }
        #app-container, #login-screen { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .sub-view { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:#12091f; z-index:100; flex-direction: column; }
        .grid-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 50px; }
        .menu-card { background: #2d1b4e; padding: 30px; border-radius: 15px; cursor: pointer; text-align: center; }
        .content-layout { display: flex; flex: 1; overflow: hidden; }
        .list-box { width: 300px; overflow-y: auto; background: #1a0b2e; }
        .item-row { padding: 15px; border-bottom: 1px solid #452b75; cursor: pointer; }
        video { flex: 1; background: #000; }
    </style>
</head>
<body>

    <!-- Tu panel de acceso original sin cambios -->
    <div id="login-screen">
        <div>
            <h2>STREAM ONE</h2>
            <input type="text" id="userInput" placeholder="Usuario"><br>
            <input type="password" id="passInput" placeholder="Contraseña"><br>
            <button onclick="realizarLogin()">Ingresar</button>
        </div>
    </div>

    <!-- Home -->
    <div id="app-container" style="display:none; flex-direction:column;">
        <h1>Bienvenido</h1>
        <div class="grid-nav">
            <div class="menu-card" onclick="abrirView('livetv-view')">📺 Live TV</div>
            <div class="menu-card" onclick="abrirView('movies-view')">🎬 Movies</div>
            <div class="menu-card" onclick="abrirView('series-view')">🍿 Series</div>
        </div>
    </div>

    <!-- Vistas de contenido -->
    <div id="livetv-view" class="sub-view">
        <button onclick="cerrarViews()">Volver</button>
        <div class="content-layout">
            <div class="list-box" id="list-live"></div>
            <video id="videoLive" controls autoplay></video>
        </div>
    </div>
    <div id="movies-view" class="sub-view">
        <button onclick="cerrarViews()">Volver</button>
        <div class="content-layout">
            <div class="list-box" id="list-movies"></div>
            <video id="videoMovie" controls autoplay></video>
        </div>
    </div>
    <div id="series-view" class="sub-view">
        <button onclick="cerrarViews()">Volver</button>
        <div class="content-layout">
            <div class="list-box" id="list-series"></div>
            <video id="videoSeries" controls autoplay></video>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2bElfqnPuLh1qW-APJ9FdpSdbw4hSpDwg8BDwSyLdFSltJWhxBmxoXvoiqP4_1ND6NQ/exec';
        let activePlayer = null;

        async function realizarLogin() {
            const user = document.getElementById('userInput').value;
            const res = await fetch(SCRIPT_URL);
            const users = await res.json();
            if (users.find(u => u.usuario == user && u.estado == "ON")) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                cargarDatos();
            } else { alert("Acceso denegado"); }
        }

        async function cargarDatos() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=init`);
                const data = await res.json();
                if (data.canales) renderizar('list-live', data.canales, 'videoLive');
                if (data.peliculas) renderizar('list-movies', data.peliculas, 'videoMovie');
                if (data.series) renderizar('list-series', data.series, 'videoSeries');
            } catch(e) {
                console.error("Error al cargar los datos de las listas:", e);
            }
        }

        function renderizar(containerId, m3uData, videoId) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            const lines = m3uData.split('\n');
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const parts = line.split(',');
                    const title = parts.length > 1 ? parts[1] : "Sin nombre";
                    
                    let url = "";
                    if (lines[i + 1] && !lines[i + 1].startsWith('#')) {
                        url = lines[i + 1].trim();
                        i++;
                    }

                    if (url) {
                        const div = document.createElement('div');
                        div.className = 'item-row';
                        div.innerText = title;
                        div.onclick = () => reproducirMedia(url, videoId);
                        container.appendChild(div);
                    }
                }
            }
        }

        function reproducirMedia(url, videoId) {
            const videoElement = document.getElementById(videoId);
            
            if (activePlayer) {
                activePlayer.destroy();
                activePlayer = null;
            }

            if (url.includes('.ts') && mpegts.getFeatureList().mseLivePlayback) {
                activePlayer = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: url });
                activePlayer.attachMediaElement(videoElement);
                activePlayer.load();
                activePlayer.play().catch(e => console.error(e));
            } else {
                videoElement.src = url;
                videoElement.load();
                videoElement.play().catch(e => console.error(e));
            }
        }

        function abrirView(id) { document.getElementById(id).style.display = 'flex'; }
        function cerrarViews() { 
            document.querySelectorAll('.sub-view').forEach(v => {
                v.style.display = 'none';
                const vid = v.querySelector('video');
                if (vid) { vid.pause(); vid.src = ""; }
            }); 
        }
    </script>
</body>
</html>
