<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream One - Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
        :root {
            --purple-bg: #2d1b4e;
            --purple-card: #452b75;
            --accent-orange: #ff6600;
            --text-main: #ffffff;
            --text-dim: #b3a5c9;
        }

        body {
            background: linear-gradient(135deg, #1a0b2e 0%, var(--purple-bg) 100%);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar estilo menú principal */
        #sidebar {
            width: 300px;
            background: rgba(0,0,0,0.2);
            padding: 30px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .menu-logo { font-size: 1.5rem; font-weight: bold; margin-bottom: 40px; color: var(--accent-orange); }

        .nav-item {
            background: var(--purple-card);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            border-color: var(--accent-orange);
            background: #5a3a96;
        }

        /* Área de Contenido */
        #main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        .channel-card {
            background: var(--purple-card);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }

        .channel-card:hover { background: #5a3a96; }

        /* Reproductor */
        #player-side {
            width: 450px;
            background: rgba(0,0,0,0.3);
            padding: 20px;
        }

        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; }

        video { width: 100%; height: 100%; border-radius: 10px; }

        .info-box { margin-top: 20px; color: var(--text-dim); }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="menu-logo">STREAM ONE</div>
        <div class="nav-item active" onclick="location.reload()">🏠 Menú Principal</div>
        <div id="categories-container"></div>
    </div>

    <div id="main-content">
        <div class="header-bar">
            <h1 id="title-display">Canales</h1>
        </div>
        <div id="channels-container"></div>
    </div>

    <div id="player-side">
        <div class="video-box">
            <video id="videoElement" controls autoplay></video>
        </div>
        <div class="info-box">
            <h3 id="playing-title">Selecciona un canal</h3>
        </div>
    </div>

    <script>
        let channelsData = [];
        let mpegtsPlayer = null;

        async function loadPlaylist() {
            const response = await fetch('StreamOne.m3u');
            const data = await response.text();
            parseM3U(data);
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            let currentCategory = "General";
            lines.forEach(line => {
                if (line.startsWith('#EXTINF:')) {
                    const match = line.match(/group-title="([^"]+)"/);
                    if (match) currentCategory = match[1];
                    const name = line.split(',')[1];
                    channelsData.push({ title: name, category: currentCategory, url: '' });
                } else if (line.trim() && !line.startsWith('#')) {
                    channelsData[channelsData.length - 1].url = line.trim();
                }
            });
            render();
        }

        function render() {
            const container = document.getElementById('categories-container');
            const cats = [...new Set(channelsData.map(c => c.category))];
            cats.forEach(cat => {
                const div = document.createElement('div');
                div.className = 'nav-item';
                div.innerText = cat;
                div.onclick = () => filter(cat);
                container.appendChild(div);
            });
        }

        function filter(cat) {
            document.getElementById('title-display').innerText = cat;
            const container = document.getElementById('channels-container');
            container.innerHTML = '';
            channelsData.filter(c => c.category === cat).forEach(ch => {
                const div = document.createElement('div');
                div.className = 'channel-card';
                div.innerHTML = `<span>${ch.title}</span> <span>▶</span>`;
                div.onclick = () => play(ch);
                container.appendChild(div);
            });
        }

        function play(ch) {
            document.getElementById('playing-title').innerText = ch.title;
            const videoElement = document.getElementById('videoElement');
            if (mpegtsPlayer) mpegtsPlayer.destroy();
            
            if (ch.url.includes('.ts')) {
                mpegtsPlayer = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: ch.url });
                mpegtsPlayer.attachMediaElement(videoElement);
                mpegtsPlayer.load();
                mpegtsPlayer.play();
            } else {
                videoElement.src = ch.url;
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
