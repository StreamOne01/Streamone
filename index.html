<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream One - IPTV</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; background: #0b1320; color: white; overflow: hidden; position: relative; }
        
        /* Pantalla de Inicio / Lobby Rediseñada */
        #lobby-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #0b1320 70%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.5s ease; padding: 20px; text-align: center;
        }

        .lobby-logo-container {
            margin-bottom: 25px;
            animation: flotar 3s ease-in-out infinite;
        }

        #lobby-overlay h1 { 
            color: #38bdf8; 
            font-size: 42px; 
            margin: 0 0 8px 0; 
            letter-spacing: 3px; 
            font-weight: 800;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        
        #lobby-overlay p { 
            color: #94a3b8; 
            font-size: 15px; 
            margin: 0; 
        }

        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .upload-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            padding: 25px; 
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.2); 
            width: 100%; 
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .input-enlace {
            width: 100%; 
            padding: 12px 14px; 
            background: #0b1320; 
            color: white;
            border: 1px solid #334155; 
            border-radius: 10px; 
            margin-bottom: 15px;
            font-size: 14px; 
            outline: none;
        }
        .input-enlace:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }

        .btn-accion {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0b1320; 
            padding: 12px;
            border-radius: 10px; 
            cursor: pointer; 
            display: inline-block;
            font-weight: bold; 
            border: none; 
            font-size: 14px; 
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }
        .btn-accion:hover { filter: brightness(1.1); }

        .btn-secundario {
            background: rgba(30, 41, 59, 0.8);
            color: #cbd5e1;
            border: 1px solid #334155;
        }

        .separador-o { 
            color: #64748b; 
            font-size: 12px; 
            margin: 15px 0; 
            font-weight: bold; 
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .separador-o::before, .separador-o::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #1e293b;
            margin: 0 15px;
        }

        /* Estructura de Columnas Base (Desktop) */
        #sidebar-carpetas { width: 280px; min-width: 250px; background: #151f30; padding: 15px; display: flex; flex-direction: column; border-right: 1px solid #2a384c; z-index: 10; }
        #sidebar-canales { width: 320px; min-width: 280px; background: #111827; padding: 15px; display: flex; flex-direction: column; border-right: 1px solid #2a384c; z-index: 9; }
        #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: #0b1320; overflow-y: auto; position: relative; }

        .tabs { display: flex; margin-bottom: 10px; gap: 5px; }
        .tabs button { flex: 1; padding: 8px; background: #1e293b; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .tabs button.active { background: #38bdf8; color: #0b1320; }
        
        .item-lista { padding: 12px 10px; border-bottom: 1px solid #2a384c; cursor: pointer; font-size: 13px; border-radius: 4px; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; }
        .item-lista:hover { background: #2a384c; }
        .folder-item { background: #1e293b; font-weight: bold; border-left: 4px solid #38bdf8; }
        .folder-item.active-folder { background: #1d4ed8; }

        /* Contenedor del reproductor */
        .video-container { position: relative; width: 100%; max-width: 900px; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 480px; background: black; border-radius: 8px; object-fit: contain; }
        
        input { padding: 10px; margin-bottom: 10px; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 4px; width: 100%; font-family: sans-serif; outline: none; }
        #estado { font-size: 11px; color: #94a3b8; margin-bottom: 10px; }
        
        #lista-carpetas, #lista-canales { overflow-y: auto; flex-grow: 1; }
        input[type="file"] { display: none; }

        .btn-volver { background: #334155; color: #38bdf8; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 10px; font-weight: bold; font-size: 12px; text-align: left; }
        .btn-volver:hover { background: #475569; }

        .btn-cambiar-lista { background: #334155; color: #cbd5e1; border: none; padding: 8px 10px; border-radius: 4px; cursor: pointer; margin-bottom: 10px; font-weight: bold; font-size: 11px; width: 100%; text-align: center; }
        .btn-cambiar-lista:hover { background: #475569; color: white; }

        .btn-movil-atras { display: none; background: #1e293b; color: #38bdf8; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 10px; font-weight: bold; font-size: 12px; width: 100%; text-align: left; }

        /* --- MENÚ ZAPPING FLOTANTE SOBRE EL VIDEO --- */
        #zapping-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, rgba(11, 19, 32, 0.95) 0%, rgba(11, 19, 32, 0.75) 45%, rgba(0,0,0,0.1) 100%);
            display: none;
            flex-direction: column;
            padding: 20px;
            z-index: 50;
            border-radius: 8px;
            backdrop-filter: blur(2px);
        }
        #zapping-overlay.activo { display: flex; }
        
        .zapping-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
            padding-bottom: 10px;
        }
        .zapping-header h3 { margin: 0; color: #38bdf8; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        
        .zapping-lista {
            overflow-y: auto;
            flex-grow: 1;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .zapping-item {
            padding: 12px 15px;
            background: rgba(21, 31, 48, 0.85);
            border-left: 4px solid #334155;
            color: #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.15s ease;
        }
        .zapping-item:hover { background: rgba(30, 41, 59, 0.95); color: white; }
        .zapping-item.seleccionado {
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.4) 0%, rgba(15, 23, 42, 0.9) 100%);
            border-left: 5px solid #38bdf8;
            color: white;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .btn-flotante-zapping {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(15, 23, 42, 0.8);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            z-index: 60;
            backdrop-filter: blur(5px);
        }
        .btn-flotante-zapping:hover { background: rgba(56, 189, 248, 0.2); color: white; }

        /* --- DISEÑO ADAPTABLE PARA TELÉFONOS (RESPONSIVE) --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar-carpetas { width: 100%; height: 100%; border-right: none; display: flex; }
            #sidebar-canales { display: none; width: 100%; height: 100%; border-right: none; }
            #main { display: none; width: 100%; height: 100%; padding: 5px; }

            body.vista-canales #sidebar-carpetas { display: none; }
            body.vista-canales #sidebar-canales { display: flex; }
            body.vista-canales .btn-movil-atras { display: block; }

            body.vista-reproductor #sidebar-carpetas { display: none; }
            body.vista-reproductor #sidebar-canales { display: none; }
            body.vista-reproductor #main { display: flex; justify-content: flex-start; padding: 0; background: black; }

            video { height: 100vh; width: 100vw; border-radius: 0; }
            #zapping-overlay { height: 100vh; width: 100vw; border-radius: 0; padding: 15px; background: rgba(11, 19, 32, 0.9); }
            .zapping-lista { max-width: 100%; }
        }
    </style>
    <!-- Librerías de reproducción -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<!-- PANTALLA DE INICIO (LOBBY) -->
<div id="lobby-overlay">
    <div class="lobby-logo-container">
        <h1>STREAM ONE</h1>
        <p>Tu centro de entretenimiento IPTV</p>
    </div>
    
    <div class="upload-card">
        <span style="font-size: 11px; color: #38bdf8; font-weight: bold; display: block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; text-align: left;">Conexión por Enlace</span>
        <input type="text" id="input-url-lobby" class="input-enlace" placeholder="https://ejemplo.com/lista.m3u">
        <button class="btn-accion" onclick="cargarDesdeEnlace()">Cargar Lista</button>
        
        <div class="separador-o">O</div>

        <span style="font-size: 11px; color: #94a3b8; font-weight: bold; display: block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; text-align: left;">Archivo Local</span>
        <label for="input-archivo-lobby" class="btn-accion btn-secundario" style="margin-top: 0; text-align: center; display: block; cursor: pointer;">📁 Buscar Archivo M3U</label>
        <input type="file" id="input-archivo-lobby" accept=".m3u,.m3u8" onchange="cargarDesdeArchivo(event)">
    </div>

    <p id="lobby-status" style="font-size: 13px; margin-top: 20px; color: #38bdf8; font-weight: 500; min-height: 20px;"></p>
</div>

<!-- COLUMNA 1: Categorías -->
<div id="sidebar-carpetas">
    <h3 style="margin-top:0; font-size: 16px; color: #38bdf8; margin-bottom: 5px;">Stream One</h3>
    <div id="estado">Lista cargada correctamente.</div>
    <button class="btn-cambiar-lista" onclick="mostrarLobby()">🔄 Cambiar / Cargar otra lista</button>
    
    <div class="tabs">
        <button id="btn-tv" class="active" onclick="cambiarTipoPrincipal('tv')">TV</button>
        <button id="btn-vod" onclick="cambiarTipoPrincipal('vod')">Pelis</button>
        <button id="btn-series" onclick="cambiarTipoPrincipal('series')">Series</button>
    </div>
    
    <input type="text" id="buscador-carpetas" placeholder="Buscar categoría..." onkeyup="filtrarCarpetas()">
    <div id="lista-carpetas"></div>
</div>

<!-- COLUMNA 2: Canales / Películas / Series -->
<div id="sidebar-canales">
    <button class="btn-movil-atras" onclick="volverACarpetasMovil()">⬅ Volver a Categorías</button>
    <div id="contenedor-navegacion-series"></div>
    <h4 style="margin-top:0; font-size: 14px; color: #94a3b8;" id="titulo-columna-canales">Contenido</h4>
    <input type="text" id="buscador-canales" placeholder="Buscar..." onkeyup="filtrarCanales()">
    <div id="lista-canales">
        <div style="padding: 10px; color: #64748b; font-size: 13px;">Selecciona una categoría a la izquierda.</div>
    </div>
</div>

<!-- COLUMNA 3: Reproductor con Zapping Flotante (Sirve para TV, Películas y Series) -->
<div id="main">
    <button class="btn-movil-atras" onclick="volverACanalesMovil()" style="display: block; width: auto; margin-bottom: 10px;">⬅ Volver a la lista</button>
    
    <div class="video-container" id="video-container-wrapper">
        <!-- Botón flotante encima del video para abrir el menú zapping en TV, Películas y Series -->
        <button class="btn-flotante-zapping" onclick="alternarZapping()" id="btn-texto-zapping">📺 Canales</button>
        
        <video id="video-player" controls autoplay playsinline></video>
        
        <!-- Menú Zapping Lateral Flotante -->
        <div id="zapping-overlay">
            <div class="zapping-header">
                <h3 id="zapping-titulo-categoria">CATEGORÍA</h3>
                <button class="btn-volver" style="margin:0;" onclick="alternarZapping()">✕ Cerrar</button>
            </div>
            <div class="zapping-lista" id="zapping-lista-items">
                <!-- Los elementos de TV, Películas o Series se cargan dinámicamente aquí -->
            </div>
        </div>
    </div>

    <p id="nombre-contenido" style="font-size: 15px; font-weight: bold; margin-top: 15px; text-align: center; padding: 0 10px;">Selecciona un elemento</p>
</div>

<script>
    let datosIPTV = { tv: {}, vod: {}, series: {} };
    let seriesEstructuradas = {}; 
    let tipoActual = 'tv';
    let carpetaActual = null;
    let serieSeleccionada = null;
    let canalesActuales = [];
    let canalActualIndex = 0;
    let mpegtsPlayer = null;
    let hlsPlayer = null;

    window.onload = function() {
        let listaGuardada = localStorage.getItem('streamone_m3u_contenido');
        if (listaGuardada) {
            document.getElementById('lobby-status').textContent = "Cargando lista guardada...";
            try {
                procesarListaM3U(listaGuardada);
                ocultarLobby();
            } catch (e) {
                console.error("Error al cargar la lista guardada:", e);
                localStorage.removeItem('streamone_m3u_contenido');
            }
        }
    };

    function mostrarLobby() {
        const lobby = document.getElementById('lobby-overlay');
        lobby.style.display = 'flex';
        setTimeout(() => { lobby.style.opacity = '1'; }, 10);
    }

    function ocultarLobby() {
        const lobby = document.getElementById('lobby-overlay');
        lobby.style.opacity = '0';
        setTimeout(() => { lobby.style.display = 'none'; }, 500);
    }

    function seleccionarCarpeta(nombreGrupo) {
        carpetaActual = nombreGrupo;
        serieSeleccionada = null;
        document.getElementById('buscador-canales').value = '';
        document.getElementById('contenedor-navegacion-series').innerHTML = '';
        
        document.getElementById('titulo-columna-canales').textContent = nombreGrupo;
        mostrarCarpetas();

        if (tipoActual === 'series') {
            mostrarSeriesDeCategoria(nombreGrupo);
        } else {
            canalesActuales = datosIPTV[tipoActual][nombreGrupo];
            renderizarCanales(canalesActuales);
        }

        if (window.innerWidth <= 768) {
            document.body.classList.add('vista-canales');
        }
    }

    function volverACarpetasMovil() {
        document.body.classList.remove('vista-canales');
    }

    function volverACanalesMovil() {
        if (mpegtsPlayer) { mpegtsPlayer.pause(); mpegtsPlayer.unload(); }
        if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
        document.getElementById('video-player').pause();
        
        document.body.classList.remove('vista-reproductor');
        document.body.classList.add('vista-canales');
    }

    // Funciones del Zapping Flotante (Adapta el texto según TV, Pelis o Series)
    function alternarZapping() {
        const zapping = document.getElementById('zapping-overlay');
        if (!zapping.classList.contains('activo')) {
            poblarZappingFlotante();
        }
        zapping.classList.toggle('activo');
    }

    function poblarZappingFlotante() {
        document.getElementById('zapping-titulo-categoria').textContent = carpetaActual || "CONTENIDO";
        const contenedor = document.getElementById('zapping-lista-items');
        contenedor.innerHTML = '';

        let lista = canalesActuales;
        if (tipoActual === 'series' && serieSeleccionada) {
            lista = seriesEstructuradas[carpetaActual][serieSeleccionada];
        }

        if (!lista || lista.length === 0) {
            contenedor.innerHTML = '<div style="padding:10px; color:#94a3b8;">No hay elementos disponibles.</div>';
            return;
        }

        const fragmento = document.createDocumentFragment();
        lista.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'zapping-item' + (index === canalActualIndex ? ' seleccionado' : '');
            div.innerHTML = `<span>▶</span> <span>${item.nombre}</span>`;
            div.onclick = () => {
                canalActualIndex = index;
                reproducir(item);
                alternarZapping();
            };
            fragmento.appendChild(div);
        });
        contenedor.appendChild(fragmento);
    }

    async function cargarDesdeEnlace() {
        let url = document.getElementById('input-url-lobby').value.trim();
        if (!url) {
            alert("Por favor, ingresa un enlace M3U válido.");
            return;
        }

        document.getElementById('lobby-status').textContent = "Descargando lista...";
        
        try {
            let respuesta = await fetch(url);
            if (!respuesta.ok) throw new Error("No se pudo conectar.");
            let contenido = await respuesta.text();

            if (contenido && contenido.includes('#EXTM3U')) {
                guardarYProcesar(contenido);
            } else {
                throw new Error("Formato inválido.");
            }
        } catch (error) {
            try {
                let proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
                let respuestaProxy = await fetch(proxyUrl);
                let contenidoProxy = await respuestaProxy.text();
                if (contenidoProxy) {
                    guardarYProcesar(contenidoProxy);
                } else {
                    throw new Error("Vacío.");
                }
            } catch (errProxy) {
                document.getElementById('lobby-status').textContent = "";
                alert("Error al descargar la lista. Comprueba el enlace.");
            }
        }
    }

    function cargarDesdeArchivo(event) {
        const archivo = event.target.files[0];
        if (!archivo) return;
        
        document.getElementById('lobby-status').textContent = "Leyendo archivo...";
        const lector = new FileReader();
        lector.readAsText(archivo, "UTF-8");
        
        lector.onload = function(e) {
            try {
                const contenido = e.target.result;
                if (contenido) guardarYProcesar(contenido);
            } catch (error) {
                document.getElementById('lobby-status').textContent = "";
                alert("Error al leer el archivo.");
            }
        };
    }

    function guardarYProcesar(contenido) {
        try {
            localStorage.setItem('streamone_m3u_contenido', contenido);
        } catch (e) {}

        document.getElementById('lobby-status').textContent = "Procesando...";
        setTimeout(() => {
            procesarListaM3U(contenido);
            document.getElementById('lobby-status').textContent = "¡Cargado con éxito!";
            setTimeout(() => { ocultarLobby(); }, 400);
        }, 50);
    }

    function procesarListaM3U(data) {
        datosIPTV = { tv: {}, vod: {}, series: {} };
        seriesEstructuradas = {};
        
        const lineas = data.replace(/\r\n/g, '\n').split('\n');
        let itemActual = null;

        lineas.forEach(linea => {
            linea = linea.trim();
            if (linea.startsWith('#EXTINF:')) {
                itemActual = {};
                let partes = linea.split(',');
                itemActual.nombre = partes[partes.length - 1] || "Sin nombre";

                let matchGrupo = linea.match(/group-title="([^"]+)"/i);
                itemActual.grupo = matchGrupo ? matchGrupo[1] : "General";

                let grupoLower = itemActual.grupo.toLowerCase();
                if (grupoLower.includes('serie') || grupoLower.includes('series') || grupoLower.includes('season')) {
                    itemActual.tipo = 'series';
                } else if (grupoLower.includes('vod') || grupoLower.includes('movie') || grupoLower.includes('pelicula') || grupoLower.includes('cine')) {
                    itemActual.tipo = 'vod';
                } else {
                    itemActual.tipo = 'tv';
                }
            } else if (linea && !linea.startsWith('#') && itemActual) {
                itemActual.url = linea;

                if (itemActual.tipo === 'series') {
                    let nombreLimpio = itemActual.nombre.replace(/s\d+[\s\.\-]*e\d+/gi, '').replace(/\b\d+x\d+\b/g, '').trim();
                    if (nombreLimpio.length < 2) nombreLimpio = itemActual.grupo;

                    if (!seriesEstructuradas[itemActual.grupo]) seriesEstructuradas[itemActual.grupo] = {};
                    if (!seriesEstructuradas[itemActual.grupo][nombreLimpio]) seriesEstructuradas[itemActual.grupo][nombreLimpio] = [];
                    seriesEstructuradas[itemActual.grupo][nombreLimpio].push(itemActual);
                } else {
                    let cat = datosIPTV[itemActual.tipo];
                    if (!cat[itemActual.grupo]) cat[itemActual.grupo] = [];
                    cat[itemActual.grupo].push(itemActual);
                }
                itemActual = null;
            }
        });
        cambiarTipoPrincipal('tv');
    }

    function cambiarTipoPrincipal(tipo) {
        tipoActual = tipo;
        carpetaActual = null;
        serieSeleccionada = null;
        canalesActuales = [];
        
        document.getElementById('buscador-carpetas').value = '';
        document.getElementById('buscador-canales').value = '';
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById(`btn-${tipo}`);
        if(btn) btn.classList.add('active');

        // Cambiar dinámicamente el texto del botón flotante según la sección
        const btnZappingTexto = document.getElementById('btn-texto-zapping');
        if (tipo === 'vod') {
            btnZappingTexto.textContent = "🎬 Películas";
        } else if (tipo === 'series') {
            btnZappingTexto.textContent = "📺 Episodios";
        } else {
            btnZappingTexto.textContent = "📺 Canales";
        }
        
        document.getElementById('contenedor-navegacion-series').innerHTML = '';
        document.getElementById('lista-canales').innerHTML = '<div style="padding: 10px; color: #64748b; font-size: 13px;">Selecciona una categoría.</div>';
        document.getElementById('titulo-columna-canales').textContent = "Contenido";
        mostrarCarpetas();
    }

    function mostrarCarpetas() {
        const contenedor = document.getElementById('lista-carpetas');
        if(!contenedor) return;
        contenedor.innerHTML = '';
        const grupos = tipoActual === 'series' ? seriesEstructuradas : datosIPTV[tipoActual];
        
        const fragmento = document.createDocumentFragment();
        Object.keys(grupos).forEach(nombreGrupo => {
            const count = tipoActual === 'series' ? Object.keys(grupos[nombreGrupo]).length : grupos[nombreGrupo].length;
            const div = document.createElement('div');
            div.className = 'item-lista folder-item' + (carpetaActual === nombreGrupo ? ' active-folder' : '');
            div.innerHTML = `<span>📁 ${nombreGrupo}</span> <span style="font-size:10px; color:#94a3b8;">(${count})</span>`;
            div.onclick = () => seleccionarCarpeta(nombreGrupo);
            fragmento.appendChild(div);
        });
        contenedor.appendChild(fragmento);
    }

    function mostrarSeriesDeCategoria(nombreGrupo) {
        const contenedor = document.getElementById('lista-canales');
        contenedor.innerHTML = '';
        const seriesMap = seriesEstructuradas[nombreGrupo];
        if (!seriesMap) return;

        const fragmento = document.createDocumentFragment();
        Object.keys(seriesMap).forEach(nombreSerie => {
            const div = document.createElement('div');
            div.className = 'item-lista folder-item';
            div.innerHTML = `<span>🎬 ${nombreSerie}</span>`;
            div.onclick = () => seleccionarSerie(nombreSerie);
            fragmento.appendChild(div);
        });
        contenedor.appendChild(fragmento);
    }

    function seleccionarSerie(nombreSerie) {
        serieSeleccionada = nombreSerie;
        document.getElementById('titulo-columna-canales').textContent = nombreSerie;
        document.getElementById('contenedor-navegacion-series').innerHTML = `<button class="btn-volver" onclick="regresarASeries()">⬅ Volver a Series</button>`;
        canalesActuales = seriesEstructuradas[carpetaActual][nombreSerie];
        renderizarCanales(canalesActuales);
    }

    function regresarASeries() {
        serieSeleccionada = null;
        document.getElementById('contenedor-navegacion-series').innerHTML = '';
        document.getElementById('titulo-columna-canales').textContent = carpetaActual;
        mostrarSeriesDeCategoria(carpetaActual);
    }

    function renderizarCanales(listaCanales) {
        const contenedor = document.getElementById('lista-canales');
        contenedor.innerHTML = '';
        if (!listaCanales) return;

        const fragmento = document.createDocumentFragment();
        listaCanales.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'item-lista';
            div.textContent = "▶ " + item.nombre;
            div.onclick = () => {
                canalActualIndex = index;
                reproducir(item);
                if (window.innerWidth <= 768) {
                    document.body.classList.remove('vista-canales');
                    document.body.classList.add('vista-reproductor');
                }
            };
            fragmento.appendChild(div);
        });
        contenedor.appendChild(fragmento);
    }

    function reproducir(item) {
        document.getElementById('nombre-contenido').textContent = item.nombre;
        const videoElement = document.getElementById('video-player');

        if (mpegtsPlayer) { mpegtsPlayer.pause(); mpegtsPlayer.unload(); mpegtsPlayer.destroy(); mpegtsPlayer = null; }
        if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
        videoElement.removeAttribute('src');

        const urlLower = item.url.toLowerCase();

        if (urlLower.endsWith('.ts') || urlLower.includes('.ts?') || (!urlLower.includes('.m3u8') && !urlLower.endsWith('.mp4') && !urlLower.endsWith('.mkv'))) {
            if (mpegts.getFeatureList().mseLivePlayback) {
                mpegtsPlayer = mpegts.createPlayer({ type: 'mse', isLive: true, url: item.url });
                mpegtsPlayer.attachMediaElement(videoElement);
                mpegtsPlayer.load();
                mpegtsPlayer.play().catch(e => {});
            }
        } else if (urlLower.includes('.m3u8')) {
            if (Hls.isSupported()) {
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(item.url);
                hlsPlayer.attachMedia(videoElement);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => videoElement.play().catch(e => {}));
            } else {
                videoElement.src = item.url;
                videoElement.play().catch(e => {});
            }
        } else {
            videoElement.src = item.url;
            videoElement.play().catch(e => {});
        }
    }

    function filtrarCarpetas() {
        const busqueda = document.getElementById('buscador-carpetas').value.toLowerCase();
        const contenedor = document.getElementById('lista-carpetas');
        contenedor.innerHTML = '';
        const grupos = tipoActual === 'series' ? seriesEstructuradas : datosIPTV[tipoActual];
        
        Object.keys(grupos).forEach(nombreGrupo => {
            if (nombreGrupo.toLowerCase().includes(busqueda)) {
                const div = document.createElement('div');
                div.className = 'item-lista folder-item';
                div.innerHTML = `<span>📁 ${nombreGrupo}</span>`;
                div.onclick = () => seleccionarCarpeta(nombreGrupo);
                contenedor.appendChild(div);
            }
        });
    }

    function filtrarCanales() {
        const busqueda = document.getElementById('buscador-canales').value.toLowerCase();
        let baseDatos = canalesActuales;
        if (tipoActual === 'series' && serieSeleccionada) {
            baseDatos = seriesEstructuradas[carpetaActual][serieSeleccionada];
        }
        const filtrados = baseDatos.filter(i => i.nombre.toLowerCase().includes(busqueda));
        renderizarCanales(filtrados);
    }
</script>
</body>
</html>
