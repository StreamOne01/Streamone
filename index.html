<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream One - Completo</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
        :root { --bg-dark: #12091f; --card-bg: rgba(45, 27, 78, 0.85); --card-hover: rgba(69, 43, 117, 0.95); --accent-orange: #ff6600; --text-main: #ffffff; --text-dim: #b3a5c9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }
        
        /* Estructura de 3 columnas */
        .sub-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 100; display: none; padding: 20px; flex-direction: column; }
        .content-layout { display: flex; flex: 1; gap: 15px; height: 90%; }
        .categories-box { width: 25%; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; }
        .list-box { width: 30%; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; }
        .video-panel { flex: 1; background: #000; border-radius: 10px; overflow: hidden; }
        
        .item-row { background: var(--card-bg); padding: 15px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
        .item-row:hover, .item-row.active { border-color: var(--accent-orange); background: var(--card-hover); }
        
        #bottom-nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 50px; }
        .menu-card { background: var(--card-bg); padding: 30px; text-align: center; border-radius: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="app-container" style="display:flex; flex-direction:column; height:100vh;">
        <div id="bottom-nav-grid">
            <div class="menu-card" onclick="document.getElementById('livetv-view').style.display='flex'">📺 Live TV</div>
            <div class="menu-card" onclick="document.getElementById('movies-view').style.display='flex'">🎬 Movies</div>
            <div class="menu-card" onclick="document.getElementById('series-view').style.display='flex'">🍿 Series</div>
        </div>
    </div>

    <!-- VISTA PELÍCULAS -->
    <div id="movies-view" class="sub-view">
        <button onclick="this.parentElement.style.display='none'">⬅ Volver</button>
        <div class="content-layout">
            <div class="categories-box" id="movies-categories"></div>
            <div class="list-box" id="movies-channels"></div>
            <div class="video-panel"><video id="videoMovie" controls autoplay style="width:100%; height:100%"></video></div>
        </div>
    </div>

    <script>
        // FUNCIÓN DE LECTURA ROBUSTA (Para tus películas)
        function parsearM3U(data) {
            const lines = data.split('\n');
            let categorias = {};
            let lastInfo = null;
            lines.forEach(line => {
                line = line.trim();
                if (!line || (line.startsWith('#') && !line.startsWith('#EXTINF:'))) return;
                if (line.startsWith('#EXTINF:')) {
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    let cat = groupMatch ? groupMatch[1].trim() : "General";
                    cat = cat.charAt(0).toUpperCase() + cat.slice(1).toLowerCase();
                    const titleParts = line.split(',');
                    const name = titleParts.length > 1 ? titleParts.slice(1).join(',') : "Sin título";
                    lastInfo = { title: name.trim(), category: cat, url: '' };
                    if (!categorias[cat]) categorias[cat] = [];
                    categorias[cat].push(lastInfo);
                } else if (lastInfo && !line.startsWith('#')) {
                    lastInfo.url = line;
                    lastInfo = null; 
                }
            });
            return categorias;
        }

        async function cargarPeliculas() {
            const url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/Peliculas');
            const res = await fetch(url);
            const data = parsearM3U(await res.text());
            
            const catBox = document.getElementById('movies-categories');
            Object.keys(data).forEach(cat => {
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerText = cat;
                div.onclick = () => {
                    const listBox = document.getElementById('movies-channels');
                    listBox.innerHTML = '';
                    data[cat].forEach(item => {
                        const row = document.createElement('div');
                        row.className = 'item-row';
                        row.innerText = item.title;
                        row.onclick = () => document.getElementById('videoMovie').src = item.url;
                        listBox.appendChild(row);
                    });
                };
                catBox.appendChild(div);
            });
        }
        
        cargarPeliculas();
    </script>
</body>
</html>
