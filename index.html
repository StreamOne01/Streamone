<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream One</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg: #0b1320;
            --card: rgba(15, 23, 42, 0.85);
            --card-hover: rgba(30, 41, 59, 0.95);
            --accent: #38bdf8;
            --text: #ffffff;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        body { 
            background-color: var(--bg); 
            background-image: 
                linear-gradient(rgba(11, 19, 32, 0.88), rgba(11, 19, 32, 0.95)), 
                url('https://github.com/StreamOne01/Streamone/blob/main/fondo%20stream%20one.png?raw=true'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed; 
            color: var(--text); 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        nav { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(10px); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            padding: 0.85rem 1.25rem; 
            display: flex; 
            flex-wrap: wrap;
            justify-content: space-between; 
            align-items: center; 
            gap: 0.75rem;
            border-bottom: 1px solid var(--border); 
        }

        .logo { font-weight: 900; font-size: 1.4rem; letter-spacing: 1.5px; text-transform: uppercase; display: flex; align-items: center; gap: 0.35rem; text-decoration: none; }
        .logo-stream { color: var(--text); }
        .logo-one { color: var(--bg); background: var(--accent); padding: 0.1rem 0.5rem; border-radius: 6px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }

        .nav-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .nav-links { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .nav-btn { background: rgba(15, 23, 42, 0.5); border: 2px solid var(--border); color: var(--text-muted); padding: 0.45rem 0.9rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
        
        .visit-counter { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); color: var(--accent); padding: 0.35rem 0.75rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; gap: 0.4rem; backdrop-filter: blur(5px); }

        .tv-focused { outline: none; border-color: var(--accent) !important; background: var(--card-hover) !important; color: var(--text) !important; transform: scale(1.04); box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); z-index: 10; }
        .nav-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

        .container { max-width: 1800px; width: 100%; margin: 0 auto; padding: 1rem; box-sizing: border-box; flex: 1; display: flex; flex-direction: column; }
        .filters-wrapper { position: sticky; top: 65px; background: rgba(11, 19, 32, 0.8); backdrop-filter: blur(8px); z-index: 90; padding: 0.4rem 0; margin-bottom: 1rem; }
        .filters { display: flex; gap: 0.5rem; overflow-x: auto; padding: 0.2rem; scroll-behavior: smooth; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn { background: var(--card); border: 2px solid var(--border); color: var(--text-muted); padding: 0.4rem 1rem; border-radius: 16px; white-space: nowrap; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; backdrop-filter: blur(5px); }
        .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
        .card { background: var(--card); backdrop-filter: blur(5px); border-radius: 8px; padding: 0.75rem 0.25rem; text-align: center; cursor: pointer; transition: all 0.2s ease; border: 2px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 75px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card p { font-size: 0.75rem; font-weight: 600; margin: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        @media (min-width: 640px) { .grid { grid-template-columns: repeat(6, 1fr); gap: 0.75rem; } }
        @media (min-width: 1536px) { .grid { grid-template-columns: repeat(8, 1fr); gap: 1.25rem; } }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { width: 90%; max-width: 1000px; aspect-ratio: 16/9; background: #000; border-radius: 12px; position: relative; border: 2px solid var(--border); }
        .modal-close { position: absolute; top: -45px; right: 0; background: var(--accent); border: none; color: #000; padding: 5px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <span class="logo-stream">STREAM</span>
            <span class="logo-one">ONE</span>
        </div>
        <div class="nav-right">
            <div class="visit-counter" id="visitCounter">👁️ <span id="countNum">...</span></div>
            <div class="nav-links">
                <button class="nav-btn active tv-focusable" onclick="render('canales', this)">TV</button>
                <button class="nav-btn tv-focusable" onclick="render('peliculas', this)">Cine</button>
                <button class="nav-btn tv-focusable" onclick="render('series', this)">Series</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="filters-wrapper">
            <div id="filter-container" class="filters"></div>
        </div>
        <div id="grid-container" class="grid"></div>
    </div>

    <div class="modal-overlay" id="playerModal">
        <div class="modal-content">
            <button class="modal-close tv-focusable" onclick="closePlayer()">CERRAR (X)</button>
            <video id="videoPlayer" controls autoplay playsinline></video>
        </div>
    </div>

    <script>
        let hls = null;
        let currentUrl = "";
        let currentName = "";

        async function initCounter() {
            try {
                const response = await fetch('https://api.countapi.xyz/hit/streamone01.github.io/visits');
                const data = await response.json();
                document.getElementById('countNum').textContent = data.value.toLocaleString();
            } catch (e) { document.getElementById('countNum').textContent = "---"; }
        }

        async function fetchData(tipo) {
            let url = tipo === 'canales' ? 'https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/canales' :
                      tipo === 'peliculas' ? 'https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/Peliculas' :
                      'https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/Series';
            
            const resp = await fetch(url);
            const text = await resp.text();
            let data = [], cat = "General", nom = "";
            
            text.split('\n').forEach(l => {
                l = l.trim();
                if (l.startsWith('#EXTINF:')) {
                    let m = l.match(/group-title="([^"]+)"/);
                    cat = m ? m[1] : "General";
                    nom = l.split(',')[1] || "";
                } else if (l.startsWith('http')) {
                    if (nom !== "") {
                        data.push({categoria: cat, nombre: nom, url: l});
                    }
                    nom = "";
                }
            });
            return data;
        }

        async function render(tipo, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            
            const rawData = await fetchData(tipo);
            const cleanData = rawData.filter(item => item.nombre && item.url && item.url.startsWith('http'));
            
            const grid = document.getElementById('grid-container');
            grid.innerHTML = cleanData.map(item => `
                <div class="card tv-focusable" onclick="openPlayer('${item.url}', '${item.nombre.replace(/'/g, "\\'")}')">
                    <p>${item.nombre}</p>
                </div>
            `).join('');
        }

        function openPlayer(url, nombre) {
            currentUrl = url;
            currentName = nombre;
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('videoPlayer');
            modal.classList.add('active');

            if (hls) hls.destroy();

            hls = new Hls({
                fragLoadingMaxRetry: 10,
                fragLoadingRetryDelay: 2000,
                manifestLoadingMaxRetry: 5
            });

            hls.loadSource(url);
            hls.attachMedia(video);

            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            hls.recoverMediaError();
                            break;
                        default:
                            hls.destroy();
                            setTimeout(() => openPlayer(currentUrl, currentName), 3000);
                            break;
                    }
                }
            });
        }

        function closePlayer() {
            if (hls) hls.destroy();
            document.getElementById('videoPlayer').pause();
            document.getElementById('playerModal').classList.remove('active');
        }

        initCounter();
        render('canales', document.querySelector('.nav-btn'));
    </script>
</body>
</html>
