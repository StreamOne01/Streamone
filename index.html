<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream One</title>
    <!-- Librería mpegts.js para reproducir formato .TS en la web -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
        :root {
            --bg-color: #0f1016;
            --panel-bg: #1a1c29;
            --accent-color: #0072d2;
            --text-color: #ffffff;
            --text-secondary: #979ba8;
            --border-color: #2b2e43;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar de Categorías */
        #sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        #sidebar h2 {
            font-size: 1.1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-toggle-btn {
            background-color: var(--border-color);
            border: none;
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .menu-toggle-btn:hover {
            background-color: var(--accent-color);
        }

        .category-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 12px 15px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            font-size: 0.95rem;
            transition: background 0.2s, color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-btn:hover {
            background-color: rgba(0, 114, 210, 0.2);
        }

        .category-btn.active {
            background-color: var(--accent-color);
            font-weight: bold;
        }

        /* Panel Central de Canales */
        #main-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #main-content h2 {
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .channel-item {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, transform 0.1s;
        }

        .channel-item:hover {
            border-color: var(--accent-color);
            background-color: #222536;
        }

        .channel-name {
            font-size: 1rem;
            font-weight: 500;
        }

        .channel-badge {
            background-color: #2b2e43;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Panel Derecho del Reproductor */
        #player-panel {
            width: 420px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        #player-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .now-playing {
            background-color: #141621;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .now-playing h4 {
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .now-playing p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* Estilo responsivo para ocultar menú en pantallas chicas si se desea */
        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                overflow: auto;
            }
            #sidebar {
                width: 100%;
                max-height: 250px;
            }
            #player-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR DE CATEGORÍAS -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Categorías</h2>
        </div>
        <div id="categories-container">
            <!-- Se llenará con JavaScript -->
        </div>
    </div>

    <!-- LISTA DE CANALES -->
    <div id="main-content">
        <div class="top-bar">
            <h2 id="current-category-title">Selecciona una categoría</h2>
            <button class="menu-toggle-btn" onclick="resetToHome()">Menú Principal</button>
        </div>
        <div class="channel-list" id="channels-container">
            <!-- Se llenará con JavaScript -->
        </div>
    </div>

    <!-- REPRODUCTOR -->
    <div id="player-panel">
        <h3>Reproductor Integrado</h3>
        <div class="video-container">
            <video id="videoElement" controls autoplay></video>
        </div>
        <div class="now-playing">
            <h4 id="playing-title">Ningún canal seleccionado</h4>
            <p id="playing-category">Haz clic en un canal para empezar</p>
        </div>
    </div>

    <script>
        let channelsData = [];
        let mpegtsPlayer = null;

        async function loadPlaylist() {
            try {
                const response = await fetch('StreamOne.m3u');
                const text = await response.text();
                parseM3U(text);
            } catch (error) {
                console.error("Error al cargar la lista M3U:", error);
                document.getElementById('channels-container').innerHTML = '<p style="color:red;">Error al cargar la lista de canales.</p>';
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            let currentCategory = "GENERAL";
            let currentTitle = "";

            channelsData = [];

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    const catMatch = line.match(/group-title="([^"]+)"/);
                    if (catMatch) currentCategory = catMatch[1];

                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) {
                        currentTitle = line.substring(commaIndex + 1).trim();
                    }
                } else if (line && !line.startsWith('#')) {
                    if (currentTitle) {
                        let type = "M3U8";
                        if (line.includes('.ts') || line.includes(':8080/live/') || line.includes('/live/')) {
                            type = "TS";
                        }
                        
                        channelsData.push({
                            title: currentTitle,
                            url: line,
                            category: currentCategory,
                            type: type
                        });
                    }
                    currentTitle = "";
                }
            }

            renderCategories();
        }

        function renderCategories() {
            const categoriesContainer = document.getElementById('categories-container');
            categoriesContainer.innerHTML = '';

            const categories = {};
            channelsData.forEach(ch => {
                if (!categories[ch.category]) categories[ch.category] = 0;
                categories[ch.category]++;
            });

            const allBtn = document.createElement('button');
            allBtn.className = 'category-btn active';
            allBtn.innerHTML = `<span>Todos (${channelsData.length})</span>`;
            allBtn.onclick = () => filterCategory('TODOS', allBtn);
            categoriesContainer.appendChild(allBtn);

            for (let cat in categories) {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.innerHTML = `<span>${cat}</span> <span class="channel-badge">${categories[cat]}</span>`;
                btn.onclick = () => filterCategory(cat, btn);
                categoriesContainer.appendChild(btn);
            }

            filterCategory('TODOS', allBtn);
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            document.getElementById('current-category-title').innerText = category === 'TODOS' ? 'Todos los Canales Disponibles' : category;

            const container = document.getElementById('channels-container');
            container.innerHTML = '';

            const filtered = category === 'TODOS' ? channelsData : channelsData.filter(ch => ch.category === category);

            filtered.forEach(ch => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.innerHTML = `
                    <span class="channel-name">${ch.title}</span>
                    <span class="channel-badge">${ch.type}</span>
                `;
                item.onclick = () => playChannel(ch);
                container.appendChild(item);
            });
        }

        // Función para el botón Menú (regresa a la vista principal de todos los canales)
        function resetToHome() {
            const allBtn = document.querySelector('.category-btn');
            if (allBtn) {
                filterCategory('TODOS', allBtn);
            }
        }

        function playChannel(channel) {
            const videoElement = document.getElementById('videoElement');
            document.getElementById('playing-title').innerText = channel.title;
            document.getElementById('playing-category').innerText = `Categoría: ${channel.category} • Reproduciendo...`;

            if (mpegtsPlayer) {
                mpegtsPlayer.destroy();
                mpegtsPlayer = null;
            }

            if (channel.type === 'TS' && mpegts.getFeatureList().mseLivePlayback) {
                mpegtsPlayer = mpegts.createPlayer({
                    type: 'mpegts',
                    isLive: true,
                    url: channel.url
                });
                mpegtsPlayer.attachMediaElement(videoElement);
                mpegtsPlayer.load();
                mpegtsPlayer.play().catch(e => console.log("Error de reproducción:", e));
            } else {
                videoElement.src = channel.url;
                videoElement.load();
                videoElement.play().catch(e => console.log("Error de reproducción:", e));
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
