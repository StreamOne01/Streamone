<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream One - Home</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
        :root {
            --bg-dark: #12091f;
            --card-bg: rgba(45, 27, 78, 0.85);
            --card-hover: rgba(69, 43, 117, 0.95);
            --accent-orange: #ff6600;
            --text-main: #ffffff;
            --text-dim: #b3a5c9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

        /* LOGIN */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: #452b75; padding: 40px; border-radius: 20px; text-align: center; width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .login-box h2 { color: var(--accent-orange); margin-bottom: 25px; letter-spacing: 1px; }
        .login-box input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: none; background: #2d1b4e; color: white; font-size: 1rem; outline: none; }
        .login-box button { width: 100%; background: var(--accent-orange); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 15px; transition: opacity 0.2s; }
        .login-box button:hover { opacity: 0.9; }

        /* HOME */
        #app-container { display: none; width: 100%; height: 100vh; flex-direction: column; position: relative; overflow: hidden; }
        .bg-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; z-index: 0; }
        .bg-slide.active { opacity: 1; }
        #app-container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 9, 31, 0.75); z-index: 1; }
        .top-header { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 25px 50px; }
        .brand-logo { font-size: 1.5rem; font-weight: bold; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .brand-logo span { color: var(--accent-orange); }
        .header-right { display: flex; align-items: center; gap: 20px; color: var(--text-dim); }
        .user-greeting { background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; color: var(--text-main); border: 1px solid rgba(255,255,255,0.05); }
        .search-container { position: relative; display: flex; align-items: center; }
        .search-input { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px 6px 32px; border-radius: 15px; color: white; font-size: 0.85rem; outline: none; width: 150px; transition: 0.3s; }
        .search-input:focus { width: 220px; border-color: var(--accent-orange); }
        .search-icon { position: absolute; left: 10px; font-size: 0.85rem; color: var(--text-dim); }
        #clock { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
        .logout-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text-dim); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .logout-btn:hover { background: var(--accent-orange); color: white; border-color: var(--accent-orange); }

        .hero-banner { position: relative; z-index: 2; padding: 20px 50px; max-width: 700px; margin-top: 20px; }
        .hero-banner h1 { font-size: 3rem; font-weight: 700; margin-bottom: 10px; }
        .hero-banner .meta { color: var(--accent-orange); font-size: 1rem; font-weight: bold; margin-bottom: 15px; }
        
        .bottom-nav { position: absolute; bottom: 40px; left: 50px; right: 50px; z-index: 2; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .menu-card { background: var(--card-bg); border: 2px solid transparent; border-radius: 16px; padding: 25px 15px; text-align: center; cursor: pointer; transition: all 0.25s ease; backdrop-filter: blur(10px); }
        .menu-card:hover, .menu-card.active { background: var(--card-hover); border-color: var(--accent-orange); transform: translateY(-5px); box-shadow: 0 10px 25px rgba(255, 102, 0, 0.3); }
        .menu-card .icon { font-size: 1.8rem; margin-bottom: 10px; display: block; }
        .menu-card span { font-size: 1rem; font-weight: 600; color: var(--text-main); }

        /* VISTAS */
        .sub-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 10; display: none; padding: 40px; flex-direction: column; overflow-y: auto; }
        .sub-view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--accent-orange); color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .content-layout { display: flex; flex: 1; gap: 30px; overflow: hidden; height: calc(100vh - 120px); }
        .list-box { width: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .item-row { background: var(--card-bg); padding: 15px; border-radius: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .item-row:hover { border-color: var(--accent-orange); background: var(--card-hover); }
        .video-panel { flex: 1; display: flex; flex-direction: column; background: #000; border-radius: 12px; overflow: hidden; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* ADMIN */
        .admin-panel-container { max-width: 900px; margin: 0 auto; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .admin-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; margin-bottom: 25px; align-items: end; }
        .admin-form input { padding: 12px; background: #1a0b2e; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; outline: none; }
        .admin-form button { background: var(--accent-orange); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        table.users-table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        table.users-table th, table.users-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        table.users-table th { color: var(--accent-orange); font-size: 0.9rem; }
        .btn-status { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .btn-on { background: #28a745; color: white; }
        .btn-off { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>STREAM ONE</h2>
            <input type="text" id="userInput" placeholder="Usuario">
            <input type="password" id="passInput" placeholder="Contraseña">
            <button onclick="realizarLogin()">Ingresar</button>
        </div>
    </div>

    <!-- HOME -->
    <div id="app-container">
        <div class="bg-slide active" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop');"></div>
        <div class="top-header">
            <div class="brand-logo">📺 STREAM <span>ONE</span></div>
            <div class="header-right">
                <div class="user-greeting">👤 <span id="logged-username">Usuario</span></div>
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="globalSearch" placeholder="Buscar canal..." oninput="filtrarGlobal(this.value)">
                </div>
                <span id="clock"></span>
                <button class="logout-btn" onclick="location.reload()">Salir</button>
            </div>
        </div>
        <div class="hero-banner">
            <h1 id="hero-title">Stream One Pro</h1>
            <p>Selecciona una categoría para continuar.</p>
        </div>
        <div class="bottom-nav" id="bottom-nav-grid"></div>
    </div>

    <!-- VISTAS -->
    <div id="livetv-view" class="sub-view"><div class="sub-view-header"><button class="back-btn" onclick="cerrarSubViews()">⬅ Volver</button><h2>Live TV</h2></div><div class="content-layout"><div class="list-box" id="channels-container"></div><div class="video-panel"><video id="videoLive" controls autoplay></video></div></div></div>
    <div id="movies-view" class="sub-view"><div class="sub-view-header"><button class="back-btn" onclick="cerrarSubViews()">⬅ Volver</button><h2>Movies</h2></div><div class="content-layout"><div class="list-box" id="movies-container"></div><div class="video-panel"><video id="videoMovie" controls autoplay></video></div></div></div>
    <div id="series-view" class="sub-view"><div class="sub-view-header"><button class="back-btn" onclick="cerrarSubViews()">⬅ Volver</button><h2>Series</h2></div><div class="content-layout"><div class="list-box" id="series-container"></div><div class="video-panel"><video id="videoSeries" controls autoplay></video></div></div></div>
    <div id="admin-view" class="sub-view"><div class="sub-view-header"><button class="back-btn" onclick="cerrarSubViews()">⬅ Volver</button><h2>Admin</h2></div><div class="admin-panel-container"><div class="admin-form"><div><label>User:</label><input type="text" id="newUsername"></div><div><label>Pass:</label><input type="text" id="newPassword"></div><button onclick="agregarUsuario()">Crear</button></div><table class="users-table"><tbody id="admin-users-list"></tbody></table></div></div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2bElfqnPuLh1qW-APJ9FdpSdbw4hSpDwg8BDwSyLdFSltJWhxBmxoXvoiqP4_1ND6NQ/exec';
        
        let listaUsuariosGlobal = [];
        let channelsData = [], moviesData = [], seriesData = [];
        let activePlayer = null;

        setInterval(() => {
            const now = new Date();
            const clockEl = document.getElementById('clock');
            if(clockEl) clockEl.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        async function realizarLogin() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;

            if(!user || !pass) {
                alert("Por favor ingresa usuario y contraseña.");
                return;
            }

            try {
                const response = await fetch(SCRIPT_URL);
                const users = await response.json();
                listaUsuariosGlobal = users;
                const found = users.find(u => u.usuario == user && u.password == pass && u.estado == "ON");

                if (found) {
                    document.getElementById('logged-username').innerText = found.usuario;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app-container').style.display = 'flex';
                    
                    construirBotonera(found.usuario);
                    cargarTodoDeGolpe();
                } else {
                    alert("Acceso denegado: Usuario incorrecto o cuenta inactiva.");
                }
            } catch (e) {
                alert("Error de conexión con la base de datos.");
            }
        }

        function construirBotonera(username) {
            const grid = document.getElementById('bottom-nav-grid');
            grid.innerHTML = `
                <div class="menu-card" onclick="abrirLiveTV()">
                    <i class="icon">📺</i>
                    <span>Live TV</span>
                </div>
                <div class="menu-card" onclick="abrirPeliculas()">
                    <i class="icon">🎬</i>
                    <span>Movies</span>
                </div>
                <div class="menu-card" onclick="abrirSeries()">
                    <i class="icon">🍿</i>
                    <span>Series</span>
                </div>
            `;

            if (username.toLowerCase() === 'admin') {
                grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
                grid.innerHTML += `
                    <div class="menu-card" onclick="abrirAdminPanel()">
                        <i class="icon">⚙️</i>
                        <span>Admin Users</span>
                    </div>
                `;
            } else {
                grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
            }
        }

        function abrirLiveTV() { document.getElementById('livetv-view').style.display = 'flex'; }
        function abrirPeliculas() { document.getElementById('movies-view').style.display = 'flex'; }
        function abrirSeries() { document.getElementById('series-view').style.display = 'flex'; }
        function abrirAdminPanel() { document.getElementById('admin-view').style.display = 'flex'; renderizarTablaAdmin(); }

        function cerrarSubViews() {
            document.querySelectorAll('.sub-view').forEach(v => v.style.display = 'none');
            if (activePlayer) {
                activePlayer.destroy();
                activePlayer = null;
            }
            const v1 = document.getElementById('videoLive');
            const v2 = document.getElementById('videoMovie');
            const v3 = document.getElementById('videoSeries');
            if(v1) v1.pause();
            if(v2) v2.pause();
            if(v3) v3.pause();
        }

        async function cargarTodoDeGolpe() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=init`);
                const json = await res.json();
                if (json.canales) { channelsData = parsearM3U(json.canales); renderizarLista('channels-container', channelsData, 'videoLive'); }
                if (json.peliculas) { moviesData = parsearM3U(json.peliculas); renderizarLista('movies-container', moviesData, 'videoMovie'); }
                if (json.series) { seriesData = parsearM3U(json.series); renderizarLista('series-container', seriesData, 'videoSeries'); }
            } catch(e) { console.error("Error carga:", e); }
        }

        function parsearM3U(data) {
            if (!data) return [];
            const lines = data.split('\n');
            let cat = "General";
            let lista = [];
            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const catMatch = line.match(/group-title="([^"]+)"/);
                    if (catMatch) cat = catMatch[1];
                    const name = line.split(',')[1] || "Sin nombre";
                    lista.push({ title: name.trim(), category: cat, url: '' });
                } else if (line.length > 5 && !line.startsWith('#')) {
                    if (lista.length > 0 && lista[lista.length - 1].url === '') lista[lista.length - 1].url = line;
                }
            });
            return lista.filter(item => item.url !== '');
        }

        function renderizarLista(containerId, lista, videoId) {
            const container = document.getElementById(containerId);
            if(!container) return;
            container.innerHTML = '';
            lista.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerHTML = `<strong>${item.title}</strong><br><small style="color:var(--text-dim);">${item.category}</small>`;
                div.onclick = () => reproducirMedia(item, videoId);
                container.appendChild(div);
            });
        }

        function reproducirMedia(item, videoId) {
            const videoElement = document.getElementById(videoId);
            if (activePlayer) {
                activePlayer.destroy();
                activePlayer = null;
            }
            if (item.url.includes('.ts') || item.url.includes(':8080')) {
                if (mpegts.getFeatureList().mseLivePlayback) {
                    activePlayer = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: item.url });
                    activePlayer.attachMediaElement(videoElement);
                    activePlayer.load();
                    activePlayer.play().catch(e => console.log(e));
                }
            } else {
                videoElement.src = item.url;
                videoElement.load();
                videoElement.play().catch(e => console.log(e));
            }
        }

        function renderizarTablaAdmin() {
            const tbody = document.getElementById('admin-users-list');
            if(!tbody) return;
            tbody.innerHTML = '';
            listaUsuariosGlobal.forEach((u, index) => {
                const tr = document.createElement('tr');
                const estadoBadge = u.estado === "ON" 
                    ? `<span style="color:#28a745; font-weight:bold;">● ON</span>` 
                    : `<span style="color:#dc3545; font-weight:bold;">● OFF</span>`;
                
                const botonAccion = u.estado === "ON"
                    ? `<button class="btn-status btn-off" onclick="cambiarEstado(${index}, 'OFF')">Apagar</button>`
                    : `<button class="btn-status btn-on" onclick="cambiarEstado(${index}, 'ON')">Encender</button>`;

                tr.innerHTML = `
                    <td>${u.usuario}</td>
                    <td>${u.password}</td>
                    <td>${estadoBadge}</td>
                    <td>${botonAccion}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function cambiarEstado(index, nuevoEstado) {
            const usuarioObj = listaUsuariosGlobal[index];
            usuarioObj.estado = nuevoEstado;

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'updateStatus',
                        usuario: usuarioObj.usuario,
                        estado: nuevoEstado
                    })
                });
                renderizarTablaAdmin();
            } catch (e) {
                alert("Error al actualizar el estado en la base de datos.");
            }
        }

        async function agregarUsuario() {
            const nuevoUser = document.getElementById('newUsername').value.trim();
            const nuevoPass = document.getElementById('newPassword').value.trim();

            if(!nuevoUser || !nuevoPass) {
                alert("Completa ambos campos para crear el usuario.");
                return;
            }

            const nuevoRegistro = { usuario: nuevoUser, password: nuevoPass, estado: "ON" };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'addUser',
                        usuario: nuevoUser,
                        password: nuevoPass,
                        estado: 'ON'
                    })
                });
                const result = await response.json();
                
                if(result.status === "success") {
                    listaUsuariosGlobal.push(nuevoRegistro);
                    document.getElementById('newUsername').value = '';
                    document.getElementById('newPassword').value = '';
                    renderizarTablaAdmin();
                    alert("Usuario agregado con éxito.");
                } else {
                    alert("El servidor no pudo guardar el usuario.");
                }
            } catch (e) {
                alert("Error al conectar con la base de datos.");
            }
        }

        function filtrarGlobal(query) {
            const q = query.toLowerCase();
            const filtLive = channelsData.filter(ch => ch.title.toLowerCase().includes(q));
            renderizarLista('channels-container', filtLive, 'videoLive');
            if(q.length > 0) abrirLiveTV();
        }
    </script>
</body>
</html>
