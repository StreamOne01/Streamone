<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitamina Espiritual SUD</title>
    <style>
        :root {
            --text-color: #ffffff;
            --badge-bg: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .bg-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            filter: brightness(0.5);
        }

        .slide.active {
            opacity: 1;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            z-index: 1;
        }

        .card {
            background-color: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            padding: 25px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.25);
            animation: fadeIn 0.8s ease-out;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .badge {
            background-color: var(--badge-bg);
            color: #ffffff;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: bold;
        }

        .music-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-info {
            font-size: 0.7rem;
            color: #93c5fd;
            text-align: right;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .play-music-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .play-music-btn:hover {
            background-color: #2563eb;
            transform: scale(1.08);
        }

        .hidden-player {
            display: none;
        }

        .content-text {
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 12px 0;
            color: #f8fafc;
            font-style: italic;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
            max-height: 200px;
            overflow-y: auto;
            padding: 0 5px;
        }

        .content-reference {
            font-size: 1rem;
            font-weight: bold;
            color: #93c5fd;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .content-source-detail {
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-bottom: 15px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: rgba(59, 130, 246, 0.85);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background-color: rgba(37, 99, 235, 0.95);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Panel Oculto */
        .admin-panel {
            display: none;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
        }

        .admin-panel input, .admin-panel textarea, .admin-panel select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            padding: 6px 10px;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }

        .admin-panel textarea {
            resize: vertical;
            height: 50px;
        }

        .admin-panel label {
            font-size: 0.7rem;
            color: #cbd5e1;
            display: block;
            margin-bottom: 2px;
        }

        .secret-trigger {
            cursor: pointer;
            user-select: none;
        }

        .footer-note {
            margin-top: 12px;
            font-size: 0.65rem;
            color: #cbd5e1;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 8px;
        }

        .creator-credits {
            margin-top: 2px;
            font-size: 0.7rem;
            color: #93c5fd;
            letter-spacing: 0.5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-slider" id="bg-slider">
        <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?q=80&w=1920&auto=format&fit=crop');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?q=80&w=1920&auto=format&fit=crop');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920&auto=format&fit=crop');"></div>
    </div>

    <div class="hidden-player" id="youtube-container"></div>

    <div class="container">
        <div class="card">
            <div class="top-bar">
                <div class="badge" id="content-type">📖 Cargando...</div>
                <div class="music-control">
                    <div class="music-info" id="music-title">🎵 Melodía Sagrada</div>
                    <button class="play-music-btn" id="playBtn" onclick="toggleAudio()" title="Reproducir / Pausar">▶</button>
                </div>
            </div>
            
            <div id="item-container">
                <p class="content-text" id="i-text">Sincronizando con la nube...</p>
                <h3 class="content-reference" id="i-ref"></h3>
                <div class="content-source-detail" id="i-source-detail"></div>
            </div>
            
            <div class="btn-group" style="margin-top: 15px;">
                <button class="btn" onclick="getRandomItem()">Otro versículo</button>
                <button class="btn btn-secondary" onclick="getDailyItem()">Volver a hoy</button>
            </div>

            <!-- Panel de Administración Oculto -->
            <div class="admin-panel" id="adminPanel">
                <div style="font-size: 0.75rem; font-weight: bold; color: #93c5fd; margin-bottom: 6px;">⚙️ Panel Cloud (Google Sheets)</div>
                
                <label>Tipo de Escrito / Fuente:</label>
                <select id="newType">
                    <option value="📖 Libro de Mormón">📖 Libro de Mormón</option>
                    <option value="📖 La Biblia">📖 La Biblia</option>
                    <option value="📖 Doctrina y Convenios">📖 Doctrina y Convenios</option>
                    <option value="📖 Perla de Gran Precio">📖 Perla de Gran Precio</option>
                    <option value="📖 Revista Liahona">📖 Revista Liahona</option>
                </select>
                
                <label>Texto o Pensamiento:</label>
                <textarea id="newText" placeholder="Escribe el fragmento o mensaje inspirador..."></textarea>
                
                <label>Referencia o Autor:</label>
                <input type="text" id="newRef" placeholder="Ej: 1 Nefi 3:7 o Pdte. Nelson">

                <label>Enlace de Biblioteca (URL):</label>
                <input type="text" id="newUrl" placeholder="https://www.churchofjesuschrist.org/...">
                
                <button class="btn" style="width: 100%; margin-top: 5px;" onclick="addNewVerse()">Guardar en la Nube</button>
            </div>

            <!-- Nota al pie con la "J" secreta interactiva -->
            <div class="footer-note">Iglesia de <span class="secret-trigger" onclick="toggleAdminPanel()" title="Oculto">J</span>esucristo de los Santos de los Últimos Días</div>
            <div class="creator-credits">
                Creado por <strong>Carlos Muñoz</strong>
            </div>
        </div>
    </div>

    <script>
        // URL de tu API de Google Apps Script ya integrada
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyd6knK-Cgn_2zIzHM2_Kpdq3nyBYB8yyfnxDfwrrJ79j1TvYUAgqbm36VHUIVXnsg29Q/exec";

        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        setInterval(nextSlide, 6000);

        let spiritualVitamins = [
            { type: "📖 Libro de Mormón", text: "Y ocurrió que yo, Nefi, dije a mi padre: Iré y haré lo que el Señor ha mandado...", ref: "1 Nefi 3:7", url: "https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/3?lang=spa" }
        ];

        async function loadContentFromCloud() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                if (data && data.length > 0) {
                    spiritualVitamins = data;
                    getDailyItem();
                }
            } catch (error) {
                console.error("Error al cargar datos de la nube:", error);
                getDailyItem();
            }
        }

        let player;
        let isPlaying = false;
        const playBtn = document.getElementById("playBtn");
        const musicTitle = document.getElementById("music-title");
        const videoId = "FcyfyVJmuqQ"; 

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-container', {
                height: '0',
                width: '0',
                videoId: videoId,
                playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': videoId },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                playBtn.innerText = "⏸";
                isPlaying = true;
            } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
                playBtn.innerText = "▶";
                isPlaying = false;
            }
        }

        function getDailyItem() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = (now - start) + ((start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000);
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);
            
            const index = dayOfYear % spiritualVitamins.length;
            displayItem(index);
        }

        function getRandomItem() {
            const randomIndex = Math.floor(Math.random() * spiritualVitamins.length);
            displayItem(randomIndex);
        }

        function displayItem(index) {
            const item = spiritualVitamins[index];
            document.getElementById("content-type").innerText = item.type;
            document.getElementById("i-text").innerText = `"${item.text}"`;
            document.getElementById("i-ref").innerText = item.ref;
            document.getElementById("i-source-detail").style.display = "none";
            musicTitle.innerText = "🎵 Melodía Sagrada";
        }

        function toggleAudio() {
            if (!player) return;
            if (isPlaying) { player.pauseVideo(); } else { player.playVideo(); }
        }

        function toggleAdminPanel() {
            const panel = document.getElementById("adminPanel");
            panel.style.display = panel.style.display === "block" ? "none" : "block";
        }

        async function addNewVerse() {
            const type = document.getElementById("newType").value;
            const text = document.getElementById("newText").value.trim();
            const ref = document.getElementById("newRef").value.trim();
            let url = document.getElementById("newUrl").value.trim();

            if (!text || !ref) {
                alert("Por favor completa al menos el texto y la referencia.");
                return;
            }

            if (!url) {
                url = type.includes("Liahona") 
                    ? "https://www.churchofjesuschrist.org/study/liahona?lang=spa" 
                    : "https://www.churchofjesuschrist.org/study/scriptures?lang=spa";
            }

            const newEntry = { type: type, text: text, ref: ref, url: url };

            alert("Guardando en la nube, por favor espera...");

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(newEntry)
                });

                spiritualVitamins.push(newEntry);
                document.getElementById("newText").value = "";
                document.getElementById("newRef").value = "";
                document.getElementById("newUrl").value = "";
                document.getElementById("adminPanel").style.display = "none";

                alert("¡Contenido guardado en la nube con éxito! Todos podrán verlo.");
                displayItem(spiritualVitamins.length - 1);
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Hubo un error al guardar en la nube.");
            }
        }

        window.onload = loadContentFromCloud;
    </script>
</body>
</html>
