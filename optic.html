<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIGA NODE</title>
    
    <!-- Favicon SVG integrado -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230072d2'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/%3E%3C/svg%3E">

    <style>
        :root {
            --bg-main: #0b1320;
            --bg-card: #0f172a;
            --accent: #0072d2;
            --accent-hover: #005bb5;
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .app-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #0072d2, #004d99);
            border-radius: 16px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(0, 114, 210, 0.3);
        }

        .app-logo svg {
            width: 38px;
            height: 38px;
            fill: #ffffff;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 4px;
            font-weight: 700;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        #lobbyScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            text-align: center;
        }

        .lobby-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.3);
        }

        .lobby-card h2 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .lobby-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .user-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }

        .user-banner span {
            color: var(--accent);
            font-weight: 600;
        }

        .btn-switch {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            background-color: var(--bg-card);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        input[readonly] {
            background-color: #162032;
            color: var(--text-muted);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .gps-container {
            display: flex;
            gap: 8px;
        }

        .gps-container input {
            flex: 1;
        }

        .btn-gps {
            background-color: #334155;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 14px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .lock-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #131d31;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px dashed var(--accent);
            margin-bottom: 16px;
        }

        .lock-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .lock-container label {
            color: var(--text-main);
            margin-bottom: 0;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-primary:active {
            background-color: var(--accent-hover);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            font-size: 0.85rem;
        }

        .history-item strong {
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .history-item p {
            color: var(--text-muted);
            margin-top: 3px;
        }

        .btn-mapa {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: var(--success);
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 8px;
            width: 100%;
        }

        .btn-editar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #334155;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
            width: 100%;
        }

        .no-records {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 20px;
        }

        .loading-text {
            text-align: center;
            color: var(--accent);
            font-size: 0.85rem;
            padding: 15px;
        }
        
        .badge-poste {
            background-color: #0284c7;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOBBY -->
        <div id="lobbyScreen">
            <header>
                <div class="app-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </div>
                <h1>GIGA NODE</h1>
                <p>Control de Infraestructura y GPS en Poste</p>
            </header>
            <div class="lobby-card">
                <h2>Acceso de Técnicos</h2>
                <p>Selecciona tu nombre e ingresa tu contraseña.</p>
                
                <div class="form-group">
                    <label for="selectTecnicoLobby">Técnico Operativo</label>
                   <select id="selectTecnicoLobby">
                        <option value="">Seleccione su nombre...</option>
                        <option value="Carlos Muñoz">Carlos Muñoz</option>
                        <option value="Jorge García">Jorge García</option>
                        <option value="Jared Acosta">Jared Acosta</option>
                        <option value="Jose Castro">Jose Castro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="inputPasswordLobby">Contraseña</label>
                    <input type="password" id="inputPasswordLobby" placeholder="Introduce tu clave...">
                </div>

                <button type="button" class="btn-primary" onclick="iniciarSesionTecnico()">Comenzar Turno</button>
            </div>
        </div>

        <!-- APP PRINCIPAL -->
        <div id="mainApp" style="display: none;">
            <header>
                <div class="app-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </div>
                <h1>GIGA NODE</h1>
                <p>Control de Infraestructura y GPS en Poste</p>
            </header>

            <div class="user-banner">
                <div>Técnico: <span id="displayTecnicoActivo"></span></div>
                <button class="btn-switch" onclick="cambiarTecnico()">Cambiar</button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="cambiarTab('registro', event)">Registrar</button>
                <button class="tab-btn" onclick="cambiarTab('verificar', event)">Verificar</button>
                <button class="tab-btn" onclick="cambiarTab('buscar', event)">Buscar</button>
                <button class="tab-btn" onclick="cambiarTab('lista', event)">Lista</button>
            </div>

            <!-- REGISTRO -->
            <div id="tab-registro" class="tab-content active">
                <div class="card">
                    <form id="registroForm">
                        <input type="hidden" id="editIndex" value="">
                        <input type="hidden" id="editIdUnico" value="">
                        
                        <div class="form-group">
                            <label for="tecnico">Técnico Responsable</label>
                            <input type="text" id="tecnico" readonly>
                        </div>

                        <div class="form-group">
                            <label for="codigoCliente">Códigos de Clientes (Puedes pegar hasta 30 separados por comas o saltos de línea)</label>
                            <textarea id="codigoCliente" required placeholder="Ej. CLI-001, CLI-002, CLI-003..."></textarea>
                        </div>

                        <div class="form-group">
                            <label for="poste">Número de Poste</label>
                            <input type="text" id="poste" placeholder="Ej. P-4052 (O dejar N/D si no tiene)">
                        </div>

                        <div class="form-group">
                            <label for="tap">Número de TAP</label>
                            <input type="text" id="tap" placeholder="Ej. TAP-04">
                        </div>

                        <div class="form-group">
                            <label for="nap">Caja NAP</label>
                            <input type="text" id="nap" placeholder="Ej. NAP-02-L4">
                        </div>

                        <div class="form-group">
                            <label for="gps">Coordenadas GPS</label>
                            <div class="gps-container">
                                <input type="text" id="gps" placeholder="Lat, Lon" readonly>
                                <button type="button" class="btn-gps" onclick="obtenerGPS()">Obtener GPS</button>
                            </div>
                        </div>

                        <!-- CASILLA PARA FIJAR DATOS -->
                        <div class="lock-container" id="contenedorFijar">
                            <input type="checkbox" id="fijarPoste">
                            <label for="fijarPoste">📌 Mantener Poste, TAP, NAP y GPS para el siguiente registro</label>
                        </div>

                        <button type="submit" id="btnGuardar" class="btn-primary">Guardar Lote de Registros</button>
                    </form>
                </div>
            </div>

            <!-- VERIFICAR -->
            <div id="tab-verificar" class="tab-content">
                <div class="card">
                    <div class="form-group">
                        <label for="tipoVerificacion">Método de Verificación</label>
                        <select id="tipoVerificacion" onchange="cambiarMetodoVerificacion()">
                            <option value="poste">Por Número de Poste</option>
                            <option value="gps">Por Coordenadas GPS</option>
                        </select>
                    </div>

                    <div id="seccionVerificarPoste" class="form-group" style="margin-bottom: 0;">
                        <label for="inputVerificarPoste">Número de Poste a Consultar</label>
                        <input type="text" id="inputVerificarPoste" placeholder="Ej. P-4052..." oninput="ejecutarVerificacion()">
                    </div>

                    <div id="seccionVerificarGps" class="form-group" style="display: none; margin-bottom: 0;">
                        <label for="inputVerificarGps">Coordenadas GPS (Lat, Lon)</label>
                        <div class="gps-container">
                            <input type="text" id="inputVerificarGps" placeholder="Ej. 15.758412, -86.791234" oninput="ejecutarVerificacion()">
                            <button type="button" class="btn-gps" onclick="obtenerGpsActualVerificacion()">Mi GPS</button>
                        </div>
                    </div>
                </div>

                <div id="resultadoVerificacion" class="history-list">
                    <div class="no-records">Selecciona el método de arriba para verificar la infraestructura.</div>
                </div>
            </div>

            <!-- BUSCAR -->
            <div id="tab-buscar" class="tab-content">
                <div class="card">
                    <div class="form-group">
                        <label for="inputBuscar">Buscar por Código o Poste</label>
                        <input type="text" id="inputBuscar" placeholder="Escribe para filtrar..." oninput="filtrarRegistros()">
                    </div>
                </div>
                <div id="resultadoBusqueda" class="history-list">
                    <div class="no-records">Usa el buscador para filtrar registros.</div>
                </div>
            </div>

            <!-- LISTA GENERAL -->
            <div id="tab-lista" class="tab-content">
                <div id="historyList" class="history-list">
                    <!-- Se llenará con la nube -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzN0DM2Lmsjlke-Sv6CdpgPK-diKQveDRYskUjSiN2BsnM69YlcvjN0G8-J93qGuCIv/exec';

        const CLAVES_TECNICOS = {
            "Carlos Muñoz": "94532043",    
            "Jorge García": "94530917",  
            "Jose Castro": "93930345",    
            "Jared Acosta": "94559577"    
        };

        document.addEventListener('DOMContentLoaded', () => {
            verificarSesion();
        });

        function verificarSesion() {
            const tecnicoGuardado = localStorage.getItem('tecnico_activo_fiber');
            if (tecnicoGuardado) {
                activarApp(tecnicoGuardado);
            } else {
                document.getElementById('lobbyScreen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        }

        function iniciarSesionTecnico() {
            const select = document.getElementById('selectTecnicoLobby');
            const passwordInput = document.getElementById('inputPasswordLobby');
            const tecnicoSeleccionado = select.value;
            const passwordIngresada = passwordInput.value.trim();

            if (!tecnicoSeleccionado) {
                alert('Por favor selecciona tu nombre.');
                return;
            }

            if (!passwordIngresada) {
                alert('Por favor introduce tu contraseña.');
                return;
            }

            if (CLAVES_TECNICOS[tecnicoSeleccionado] !== passwordIngresada) {
                alert('❌ Contraseña incorrecta para ' + tecnicoSeleccionado);
                passwordInput.value = '';
                return;
            }

            localStorage.setItem('tecnico_activo_fiber', tecnicoSeleccionado);
            passwordInput.value = '';
            activarApp(tecnicoSeleccionado);
        }

        function activarApp(nombreTecnico) {
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('displayTecnicoActivo').textContent = nombreTecnico;
            document.getElementById('tecnico').value = nombreTecnico;
            cargarRegistrosDesdeNube();
        }

        function cambiarTecnico() {
            localStorage.removeItem('tecnico_activo_fiber');
            document.getElementById('selectTecnicoLobby').value = '';
            document.getElementById('inputPasswordLobby').value = '';
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('lobbyScreen').style.display = 'flex';
        }

        function cambiarTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }

            if (tabName === 'lista' || tabName === 'buscar') {
                cargarRegistrosDesdeNube();
            }
        }

        function cambiarMetodoVerificacion() {
            const tipo = document.getElementById('tipoVerificacion').value;
            const secPoste = document.getElementById('seccionVerificarPoste');
            const secGps = document.getElementById('seccionVerificarGps');
            const contenedor = document.getElementById('resultadoVerificacion');

            if (tipo === 'poste') {
                secPoste.style.display = 'block';
                secGps.style.display = 'none';
                contenedor.innerHTML = '<div class="no-records">Escribe el número del poste para consultar...</div>';
            } else {
                secPoste.style.display = 'none';
                secGps.style.display = 'block';
                contenedor.innerHTML = '<div class="no-records">Introduce coordenadas o usa "Mi GPS" para buscar registros cercanos.</div>';
            }
        }

        function obtenerGPS() {
            const gpsInput = document.getElementById('gps');
            if (!navigator.geolocation) {
                alert('La geolocalización no es compatible con este navegador.');
                return;
            }

            gpsInput.value = 'Buscando satélites (alta precisión)...';
            const opcionesGPS = { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 };

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lon = position.coords.longitude.toFixed(6);
                    gpsInput.value = `${lat}, ${lon}`;
                },
                (error) => {
                    let mensaje = 'No se pudo obtener la ubicación.';
                    if (error.code === error.TIMEOUT) mensaje = 'El GPS tardó demasiado. Sal al aire libre.';
                    else if (error.code === error.PERMISSION_DENIED) mensaje = 'Permiso de ubicación denegado.';
                    alert(mensaje);
                    gpsInput.value = '';
                },
                opcionesGPS
            );
        }

        function obtenerGpsActualVerificacion() {
            const gpsInput = document.getElementById('inputVerificarGps');
            if (!navigator.geolocation) {
                alert('La geolocalización no es compatible con este navegador.');
                return;
            }

            gpsInput.value = 'Buscando...';
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lon = position.coords.longitude.toFixed(6);
                    gpsInput.value = `${lat}, ${lon}`;
                    ejecutarVerificacion();
                },
                (error) => {
                    alert('No se pudo obtener la ubicación actual.');
                    gpsInput.value = '';
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const editIdUnico = document.getElementById('editIdUnico').value;
            const tecnicoActual = localStorage.getItem('tecnico_activo_fiber') || 'Carlos Muñoz';
            const mantenerDatos = document.getElementById('fijarPoste').checked;
            
            const rawInput = document.getElementById('codigoCliente').value;
            const codigosArray = rawInput
                .split(/[\n,]+/)
                .map(c => c.trim())
                .filter(c => c.length > 0);

            if (codigosArray.length === 0) {
                alert('Por favor ingresa al menos un código de cliente.');
                return;
            }

            const btnGuardar = document.getElementById('btnGuardar');
            let registrosLocales = JSON.parse(localStorage.getItem('registros_fiber_dog')) || [];
            const fechaActual = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // SI ESTAMOS EDITANDO UN REGISTRO ESPECÍFICO
            if (editIdUnico !== "") {
                btnGuardar.textContent = `Actualizando registro...`;
                btnGuardar.disabled = true;

                const registroModificado = {
                    id: Number(editIdUnico),
                    tecnico: tecnicoActual,
                    codigoCliente: codigosArray[0], // Toma el primer código ingresado al editar
                    poste: document.getElementById('poste').value || 'N/D',
                    tap: document.getElementById('tap').value || 'N/D',
                    nap: document.getElementById('nap').value || 'N/D',
                    gps: document.getElementById('gps').value || 'Sin coordenadas',
                    fecha: fechaActual
                };

                // Actualizar local
                registrosLocales = registrosLocales.map(r => r.id == editIdUnico ? registroModificado : r);
                localStorage.setItem('registros_fiber_dog', JSON.stringify(registrosLocales));

                try {
                    const datosFormulario = new URLSearchParams();
                    datosFormulario.append('data', JSON.stringify(registroModificado));
                    await fetch(WEB_APP_URL, { method: 'POST', body: datosFormulario });
                    alert('¡Registro actualizado con éxito en la nube!');
                } catch (err) {
                    alert('⚠️ Actualizado localmente (se sincronizará al conectar).');
                }

                finalizarGuardado(false, tecnicoActual);
                return;
            }

            // MODO NUEVO LOTE (Hasta 30 o más)
            btnGuardar.textContent = `Guardando ${codigosArray.length} registro(s) en lote...`;
            btnGuardar.disabled = true;

            let nuevosRegistros = [];
            codigosArray.forEach((codigo, idx) => {
                nuevosRegistros.push({
                    id: Date.now() + idx,
                    tecnico: tecnicoActual,
                    codigoCliente: codigo,
                    poste: document.getElementById('poste').value || 'N/D',
                    tap: document.getElementById('tap').value || 'N/D',
                    nap: document.getElementById('nap').value || 'N/D',
                    gps: document.getElementById('gps').value || 'Sin coordenadas',
                    fecha: fechaActual
                });
            });

            registrosLocales = [...nuevosRegistros, ...registrosLocales];
            localStorage.setItem('registros_fiber_dog', JSON.stringify(registrosLocales));

            try {
                const datosFormulario = new URLSearchParams();
                datosFormulario.append('data', JSON.stringify(nuevosRegistros));
                await fetch(WEB_APP_URL, { method: 'POST', body: datosFormulario });
                alert(`¡Se guardaron y sincronizarán ${nuevosRegistros.length} cliente(s) con éxito en la nube!`);
            } catch (err) {
                console.warn("Error de red:", err);
                alert(`⚠️ Se guardaron ${nuevosRegistros.length} cliente(s) localmente.`);
            }

            finalizarGuardado(mantenerDatos, tecnicoActual);
        });

        function finalizarGuardado(mantenerDatos, tecnicoActual) {
            document.getElementById('codigoCliente').value = '';
            document.getElementById('editIdUnico').value = "";
            document.getElementById('contenedorFijar').style.display = 'flex';
            
            if (!mantenerDatos) {
                document.getElementById('poste').value = '';
                document.getElementById('tap').value = '';
                document.getElementById('nap').value = '';
                document.getElementById('gps').value = '';
            }

            document.getElementById('tecnico').value = tecnicoActual;
            const btnGuardar = document.getElementById('btnGuardar');
            btnGuardar.textContent = "Guardar Lote de Registros";
            btnGuardar.disabled = false;
            
            cargarRegistrosDesdeNube();
            cambiarTab('lista', null);
        }

        function cargarRegistrosDesdeNube() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '<div class="loading-text">Sincronizando con la nube...</div>';

            const urlConAntiCache = `${WEB_APP_URL}?nocache=${new Date().getTime()}`;

            fetch(urlConAntiCache)
                .then(response => {
                    if (!response.ok) throw new Error('Error en el servidor');
                    return response.json();
                })
                .then(registros => {
                    localStorage.setItem('registros_fiber_dog', JSON.stringify(registros));

                    if (!registros || registros.length === 0) {
                        historyList.innerHTML = '<div class="no-records">No hay registros en la hoja de cálculo todavía.</div>';
                        return;
                    }

                    let html = '';
                    registros.forEach((reg) => {
                        html += renderizarItem(reg);
                    });
                    historyList.innerHTML = html;
                })
                .catch(err => {
                    console.warn("Error al obtener datos de la nube:", err);
                    const registrosLocales = JSON.parse(localStorage.getItem('registros_fiber_dog')) || [];
                    
                    if (registrosLocales.length > 0) {
                        let html = '';
                        registrosLocales.forEach((reg) => {
                            html += renderizarItem(reg);
                        });
                        historyList.innerHTML = '<div style="color: #f59e0b; font-size: 0.75rem; text-align:center; margin-bottom: 8px;">⚠️ Modo sin conexión (Mostrando caché local)</div>' + html;
                    } else {
                        historyList.innerHTML = '<div class="no-records">No se pudo conectar a la nube y no hay registros locales.</div>';
                    }
                });
        }

        function renderizarItem(reg) {
            let botonMapa = '';
            if (reg.gps && reg.gps !== 'Sin coordenadas' && reg.gps.includes(',')) {
                const coords = reg.gps.replace(/\s+/g, '');
                const urlGoogleMaps = `https://www.google.com/maps/search/?api=1&query=${coords}`;
                
                botonMapa = `
                    <a href="${urlGoogleMaps}" target="_blank" class="btn-mapa">
                        📍 Abrir ruta en el Mapa
                    </a>
                `;
            }

            // Serializamos los datos del registro para enviarlos de forma segura a la función editarRegistro
            const regJson = encodeURIComponent(JSON.stringify(reg));

            return `
                <div class="history-item">
                    <strong>Código: ${reg.codigoCliente}</strong>
                    <p><strong>Técnico:</strong> ${reg.tecnico}</p>
                    <p>Poste: ${reg.poste} | TAP: ${reg.tap} | NAP: ${reg.nap}</p>
                    <p>GPS: ${reg.gps}</p>
                    ${botonMapa}
                    <button type="button" class="btn-editar" onclick="cargarRegistroParaEditar('${regJson}')">
                        ✏️ Editar Registro
                    </button>
                    <p><small style="color: var(--text-muted); margin-top: 6px; display: block;">${reg.fecha}</small></p>
                </div>
            `;
        }

        function cargarRegistroParaEditar(regJsonEncoded) {
            const reg = JSON.parse(decodeURIComponent(regJsonEncoded));

            // Rellenar formulario con los datos de ese registro
            document.getElementById('editIdUnico').value = reg.id;
            document.getElementById('codigoCliente').value = reg.codigoCliente;
            document.getElementById('poste').value = reg.poste;
            document.getElementById('tap').value = reg.tap;
            document.getElementById('nap').value = reg.nap;
            document.getElementById('gps').value = reg.gps;
            document.getElementById('tecnico').value = reg.tecnico;

            // Ocultar opción de fijar datos y cambiar texto del botón principal
            document.getElementById('contenedorFijar').style.display = 'none';
            document.getElementById('btnGuardar').textContent = 'Actualizar Registro';

            // Cambiar a la pestaña de registro
            cambiarTab('registro', { currentTarget: document.querySelector('.tab-btn') });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function ejecutarVerificacion() {
            const tipo = document.getElementById('tipoVerificacion').value;
            if (tipo === 'poste') {
                verificarPosteEnBase();
            } else {
                verificarGpsEnBase();
            }
        }

        function verificarPosteEnBase() {
            const query = document.getElementById('inputVerificarPoste').value.trim().toLowerCase();
            const contenedor = document.getElementById('resultadoVerificacion');
            let registros = JSON.parse(localStorage.getItem('registros_fiber_dog')) || [];

            if (!query) {
                contenedor.innerHTML = '<div class="no-records">Escribe el número del poste para consultar...</div>';
                return;
            }

            if (registros.length === 0) {
                contenedor.innerHTML = '<div class="no-records">⚠️ No hay registros locales. Ve a la pestaña "Lista" para sincronizar la base de datos.</div>';
                return;
            }

            const encontrados = registros.filter(reg => {
                const posteReg = (reg.poste || "").toString().toLowerCase();
                return posteReg.includes(query);
            });

            if (encontrados.length === 0) {
                contenedor.innerHTML = `<div class="no-records" style="color: #ef4444;">❌ El poste "<strong>${query}</strong>" NO está registrado en la base de datos. ¡Poste libre o nuevo!</div>`;
                return;
            }

            const primerMatch = encontrados[0];
            let botonMapa = '';
            if (primerMatch.gps && primerMatch.gps !== 'Sin coordenadas' && primerMatch.gps.includes(',')) {
                const coords = primerMatch.gps.replace(/\s+/g, '');
                botonMapa = `<a href="https://www.google.com/maps/search/?api=1&query=${coords}" target="_blank" class="btn-mapa">📍 Ver Ubicación GPS del Poste</a>`;
            }

            contenedor.innerHTML = `
                <div class="history-item" style="border-color: var(--success);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span class="badge-poste">POSTE REGISTRADO</span>
                        <small style="color: var(--text-muted);">${primerMatch.fecha}</small>
                    </div>
                    <strong>Poste: ${primerMatch.poste}</strong>
                    <p><strong>TAP:</strong> ${primerMatch.tap} | <strong>NAP:</strong> ${primerMatch.nap}</p>
                    <p style="margin-top: 6px;"><strong>Clientes asociados:</strong></p>
                    <p style="color: var(--text-main);">${encontrados.map(r => r.codigoCliente).join(', ')}</p>
                    ${botonMapa}
                </div>
            `;
        }

        function verificarGpsEnBase() {
            const query = document.getElementById('inputVerificarGps').value.trim();
            const contenedor = document.getElementById('resultadoVerificacion');
            let registros = JSON.parse(localStorage.getItem('registros_fiber_dog')) || [];

            if (!query || !query.includes(',')) {
                contenedor.innerHTML = '<div class="no-records">Introduce coordenadas válidas (Lat, Lon) o usa "Mi GPS".</div>';
                return;
            }

            if (registros.length === 0) {
                contenedor.innerHTML = '<div class="no-records">⚠️ No hay registros locales para comparar.</div>';
                return;
            }

            const partes = query.split(',');
            const targetLat = parseFloat(partes[0]);
            const targetLon = parseFloat(partes[1]);

            if (isNaN(targetLat) || isNaN(targetLon)) {
                contenedor.innerHTML = '<div class="no-records" style="color: #ef4444;">❌ Formato de coordenadas inválido.</div>';
                return;
            }

            const TOLERANCIA = 0.0003; 
            const encontrados = registros.filter(reg => {
                if (!reg.gps || !reg.gps.includes(',')) return false;
                const pGps = reg.gps.split(',');
                const regLat = parseFloat(pGps[0]);
                const regLon = parseFloat(pGps[1]);
                if (isNaN(regLat) || isNaN(regLon)) return false;

                return Math.abs(regLat - targetLat) <= TOLERANCIA && Math.abs(regLon - targetLon) <= TOLERANCIA;
            });

            if (encontrados.length === 0) {
                contenedor.innerHTML = `<div class="no-records" style="color: #ef4444;">❌ No se encontraron registros cercanos a estas coordenadas. ¡Zona libre!</div>`;
                return;
            }

            let html = `<div style="color: var(--success); font-size: 0.8rem; margin-bottom: 8px; text-align: center;">✅ ¡Se encontraron ${encontrados.length} registro(s) en esta ubicación!</div>`;
            encontrados.forEach((reg) => {
                html += renderizarItem(reg);
            });
            contenedor.innerHTML = html;
        }

        function filtrarRegistros() {
            const query = document.getElementById('inputBuscar').value.trim().toLowerCase();
            const contenedor = document.getElementById('resultadoBusqueda');
            let registros = JSON.parse(localStorage.getItem('registros_fiber_dog')) || [];

            if (!query) {
                contenedor.innerHTML = '<div class="no-records">Usa el buscador para filtrar registros.</div>';
                return;
            }

            const encontrados = registros.filter(reg => {
                const codigo = (reg.codigoCliente || "").toLowerCase();
                const poste = (reg.poste || "").toLowerCase();
                return codigo.includes(query) || poste.includes(query);
            });

            if (encontrados.length === 0) {
                contenedor.innerHTML = '<div class="no-records">No se encontraron coincidencias.</div>';
                return;
            }

            let html = '';
            encontrados.forEach((reg) => {
                html += renderizarItem(reg);
            });
            contenedor.innerHTML = html;
        }
    </script>
</body>
</html>
