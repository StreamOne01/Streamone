<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream One - Móvil y PC</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-base: #8b0000;
            --bg-overlay: rgba(20, 0, 0, 0.95);
            --bg-card: rgba(50, 0, 0, 0.6);
            --bg-card-hover: rgba(255, 183, 3, 0.2);
            --accent: #ffb703;
            --text-main: #ffffff;
            --text-muted: #d0d0d0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #a50000 0%, #3a0000 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Pantalla de Bienvenida */
        #welcomeScreen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 0, 0, 0.98);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .welcome-card {
            background: rgba(30, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .welcome-logo {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .welcome-logo span { color: var(--accent); }

        .welcome-card p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .input-group input[type="text"]:focus { border-color: var(--accent); }

        .file-upload-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            color: #fff;
            margin-top: 12px;
        }

        .btn-start {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 15px;
            width: 100%;
        }

        /* Cabecera Principal */
        header {
            background: rgba(25, 0, 0, 0.95);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-logo-header { font-size: 13px; font-weight: 800; color: #fff; background: rgba(0, 0, 0, 0.4); padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); }
        .header-right { display: flex; align-items: center; gap: 10px; font-size: 12px; }

        /* Botón de retroceso para móviles (oculto en PC) */
        .mobile-back-btn {
            display: none;
            background: rgba(255, 183, 3, 0.2);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        /* Contenedor Adaptable (Grid en PC, Flex/Paso a paso en Móvil) */
        .app-container {
            display: grid;
            grid-template-columns: 280px 320px 1fr;
            gap: 15px;
            padding: 75px 15px 15px 15px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            flex: 1;
        }

        .column-box {
            background: var(--bg-overlay);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: calc(100vh - 90px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .column-header {
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0,0,0,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .column-content {
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .list-item {
            background: var(--bg-card);
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
        }
        .list-item:hover { background: var(--bg-card-hover); border-color: rgba(255, 183, 3, 0.3); }
        .list-item.active { background: rgba(255, 183, 3, 0.25); border-color: var(--accent); color: #fff; }

        .player-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: transparent;
            border: none;
            height: auto;
        }

        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        video { width: 100%; height: 100%; object-fit: contain; }

        .epg-bar {
            background: var(--bg-overlay);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .epg-info h2 { margin: 0 0 4px 0; font-size: 15px; color: #fff; font-weight: 700; }
        .epg-info p { margin: 0; font-size: 12px; color: var(--text-muted); }

        /* ================= MEDIA QUERY PARA CELULARES ================= */
        @media (max-width: 1024px) {
            .app-container {
                display: block; /* Se desactiva el grid de PC */
                padding: 65px 10px 10px 10px;
                height: auto;
            }

            /* Por defecto en móvil solo mostramos la columna de carpetas */
            .column-box {
                display: none;
                height: calc(100vh - 80px);
                width: 100%;
            }

            .column-box.mobile-active {
                display: flex; /* Muestra solo la columna activa */
            }

            .player-column {
                display: none;
                width: 100%;
            }

            .player-column.mobile-active {
                display: flex;
            }

            .mobile-back-btn {
                display: inline-block; /* Aparece el botón de regresar en el celular */
            }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="welcomeScreen">
        <div class="welcome-card">
            <div class="welcome-logo">Stream <span>One</span></div>
            <p>Ingresa tu enlace M3U para comenzar</p>
            
            <div class="input-group">
                <label>Enlace M3U (URL)</label>
                <input type="text" id="m3uUrlInput" placeholder="https://ejemplo.com/lista.m3u" value="https://raw.githubusercontent.com/StreamOne01/Streamone/main/Peliculas.m3u">
            </div>

            <div class="file-upload-btn" onclick="document.getElementById('m3uFileInput').click()">
                📂 Cargar archivo .m3u local
            </div>
            <input type="file" id="m3uFileInput" accept=".m3u" style="display: none;" onchange="cargarArchivoLocal(this)">

            <button class="btn-start" onclick="iniciarStreamOne()">Iniciar Aplicación</button>
        </div>
    </div>

    <!-- Cabecera -->
    <header>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button id="backBtn" class="mobile-back-btn" onclick="volverPasoAnterior()">⬅ Volver</button>
            <div class="brand-logo-header">📺 Stream One</div>
        </div>
        <div class="header-right">
            <button onclick="location.reload()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color:#fff; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 11px;">🔄 Cambiar</button>
            <span id="reloj">11:46 PM</span>
        </div>
    </header>

    <!-- Interfaz adaptable -->
    <div class="app-container">
        
        <!-- Columna 1: Carpetas -->
        <div class="column-box mobile-active" id="colCarpetas">
            <div class="column-header">📁 Carpetas</div>
            <div id="folderList" class="column-content">
                <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Cargando...</div>
            </div>
        </div>

        <!-- Columna 2: Elementos de la carpeta -->
        <div class="column-box" id="colElementos">
            <div class="column-header" id="itemsHeaderTitle">📄 Elementos</div>
            <div id="itemList" class="column-content"></div>
        </div>

        <!-- Columna 3: Reproductor -->
        <div class="player-column" id="colReproductor">
            <div class="video-box">
                <video id="videoPlayer" controls playsinline autoplay></video>
            </div>
            <div class="epg-bar">
                <div class="epg-info">
                    <h2 id="currentTitle">Selecciona un archivo</h2>
                    <p id="currentDesc">Listo para reproducir</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const folderList = document.getElementById('folderList');
        const itemList = document.getElementById('itemList');
        const currentTitle = document.getElementById('currentTitle');
        const currentDesc = document.getElementById('currentDesc');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const m3uUrlInput = document.getElementById('m3uUrlInput');
        const itemsHeaderTitle = document.getElementById('itemsHeaderTitle');
        const backBtn = document.getElementById('backBtn');

        const colCarpetas = document.getElementById('colCarpetas');
        const colElementos = document.getElementById('colElementos');
        const colReproductor = document.getElementById('colReproductor');

        let hls = null;
        let baseDatosCategorias = {};
        let pasoMovilActual = 1; // 1: Carpetas, 2: Elementos, 3: Reproductor

        window.onload = function() {
            setInterval(actualizarReloj, 1000);
        };

        function actualizarReloj() {
            const ahora = new Date();
            let horas = ahora.getHours();
            const minutos = ahora.getMinutes().toString().padStart(2, '0');
            const ampm = horas >= 12 ? 'PM' : 'AM';
            horas = horas % 12 || 12;
            document.getElementById('reloj').textContent = `${horas}:${minutos} ${ampm}`;
        }

        async function iniciarStreamOne() {
            const url = m3uUrlInput.value.trim();
            if (!url) {
                alert("Ingresa un enlace M3U válido");
                return;
            }

            try {
                folderList.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Cargando lista...</div>';
                welcomeScreen.style.display = 'none';

                const respuesta = await fetch(url);
                if (!respuesta.ok) throw new Error("Error de red");
                const texto = await respuesta.text();
                parsearM3UenCarpetas(texto);
            } catch (error) {
                welcomeScreen.style.display = 'flex';
                alert("No se pudo cargar la lista. Verifica la URL.");
            }
        }

        function cargarArchivoLocal(input) {
            const archivo = input.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                welcomeScreen.style.display = 'none';
                parsearM3UenCarpetas(e.target.result);
            };
            lector.readAsText(archivo);
        }

        function parsearM3UenCarpetas(contenido) {
            const lineas = contenido.split('\n');
            baseDatosCategorias = {};

            let nombreActual = "Sin nombre";
            let categoriaActual = "General";

            lineas.forEach(linea => {
                linea = linea.trim();
                if (linea.startsWith('#EXTINF:')) {
                    const matchGroup = linea.match(/group-title="([^"]+)"/);
                    if (matchGroup && matchGroup[1]) {
                        categoriaActual = matchGroup[1].trim();
                    } else {
                        categoriaActual = "General";
                    }

                    const partes = linea.split(',');
                    if (partes.length > 1) {
                        nombreActual = partes.slice(1).join(',').trim();
                    }
                } else if (linea && !linea.startsWith('#')) {
                    if (!baseDatosCategorias[categoriaActual]) {
                        baseDatosCategorias[categoriaActual] = [];
                    }

                    baseDatosCategorias[categoriaActual].push({
                        nombre: nombreActual,
                        url: linea
                    });

                    nombreActual = "Sin nombre";
                }
            });

            renderizarCarpetas();
        }

        function renderizarCarpetas() {
            folderList.innerHTML = '';
            const categorias = Object.keys(baseDatosCategorias);

            if (categorias.length === 0) {
                folderList.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Sin carpetas</div>';
                return;
            }

            categorias.forEach((cat, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.textContent = `📁 ${cat} (${baseDatosCategorias[cat].length})`;
                div.onclick = () => seleccionarCarpeta(cat, div);
                folderList.appendChild(div);
            });
        }

        function seleccionarCarpeta(nombreCarpeta, elementoDiv) {
            document.querySelectorAll('#folderList .list-item').forEach(el => el.classList.remove('active'));
            elementoDiv.classList.add('active');

            itemsHeaderTitle.textContent = `📄 ${nombreCarpeta}`;
            const elementos = baseDatosCategorias[nombreCarpeta] || [];
            renderizarElementos(elementos);

            // Si estamos en teléfono, pasamos a la vista de elementos automáticamente
            if (window.innerWidth <= 1024) {
                colCarpetas.classList.remove('mobile-active');
                colElementos.classList.add('mobile-active');
                pasoMovilActual = 2;
                backBtn.style.display = 'inline-block';
            }
        }

        function renderizarElementos(elementos) {
            itemList.innerHTML = '';

            if (elementos.length === 0) {
                itemList.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Carpeta vacía</div>';
                return;
            }

            elementos.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.textContent = item.nombre;
                div.title = item.nombre;
                div.onclick = () => reproducirItem(item.url, item.nombre, div);
                itemList.appendChild(div);
            });
        }

        function reproducirItem(url, nombre, elementoDiv) {
            document.querySelectorAll('#itemList .list-item').forEach(el => el.classList.remove('active'));
            elementoDiv.classList.add('active');

            currentTitle.textContent = nombre;
            currentDesc.textContent = "Reproduciendo • Stream One";

            // Si estamos en teléfono, pasamos a la vista del reproductor automáticamente
            if (window.innerWidth <= 1024) {
                colElementos.classList.remove('mobile-active');
                colReproductor.classList.add('mobile-active');
                pasoMovilActual = 3;
            }

            if (hls) hls.destroy();

            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => console.log(e)));
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => video.play().catch(e => console.log(e)));
                } else {
                    alert('HLS no compatible');
                }
            } else {
                video.src = url;
                video.load();
                video.play().catch(e => console.log(e));
            }
        }

        function volverPasoAnterior() {
            if (window.innerWidth <= 1024) {
                if (pasoMovilActual === 3) {
                    // Del reproductor regresamos a la lista de elementos
                    colReproductor.classList.remove('mobile-active');
                    colElementos.classList.add('mobile-active');
                    pasoMovilActual = 2;
                } else if (pasoMovilActual === 2) {
                    // De los elementos regresamos a las carpetas y ocultamos el botón de volver
                    colElementos.classList.remove('mobile-active');
                    colCarpetas.classList.add('mobile-active');
                    pasoMovilActual = 1;
                    backBtn.style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
