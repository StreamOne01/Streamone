<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream One Player - Panel Remoto</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at 10% 20%, #ff1e27 0%, #b80009 45%, #600004 90%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sparkles-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(circle at 85% 15%, rgba(255, 215, 0, 0.6) 0%, transparent 12%),
        radial-gradient(circle at 92% 30%, rgba(255, 255, 255, 0.7) 0%, transparent 6%),
        radial-gradient(circle at 15% 80%, rgba(255, 215, 0, 0.4) 0%, transparent 15%),
        radial-gradient(circle at 28% 50%, rgba(255, 200, 100, 0.5) 0%, transparent 8%),
        radial-gradient(circle at 70% 85%, rgba(255, 255, 255, 0.5) 0%, transparent 10%);
      pointer-events: none;
      z-index: 1;
    }

    .header {
      position: relative;
      z-index: 10;
      height: 60px;
      padding: 10px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-box {
      background: #fff;
      color: #d30008;
      border-radius: 8px;
      padding: 4px 8px;
      font-weight: 900;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
    }

    .app-version {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 10px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .tab-btn.active {
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
    }

    .tab-btn.kids {
      color: #ffeb3b;
      font-weight: 900;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .load-m3u-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .membership-btn {
      background: linear-gradient(135deg, #ffd700, #ff9800);
      color: #5d3a00;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .main-content {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      padding: 10px 25px 20px 25px;
      gap: 15px;
      height: calc(100% - 60px);
    }

    .categories-panel {
      width: 220px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .items-panel {
      width: 280px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-count-badge {
      font-size: 0.7rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .scroll-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 4px;
    }

    .scroll-list::-webkit-scrollbar {
      width: 4px;
    }
    .scroll-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }

    .list-card {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 6px;
      cursor: pointer;
      border: 1.5px solid transparent;
      font-size: 0.82rem;
      font-weight: 600;
      gap: 8px;
    }

    .list-card:hover, .list-card.active {
      background: rgba(0, 0, 0, 0.65);
      border-color: #fff;
    }

    .channel-logo-container {
      width: 36px;
      height: 24px;
      background: #111;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .channel-logo {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .player-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .video-container {
      flex: 1;
      background: #000;
      border-radius: 8px 8px 0 0;
      overflow: hidden;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .expand-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    .player-bar {
      height: 52px;
      background: #800000;
      border-radius: 0 0 8px 8px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      justify-content: space-between;
    }

    .current-channel-info {
      display: flex;
      flex-direction: column;
    }

    .current-channel-title {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
    }

    .epg-show-title {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .epg-time-badge {
      background: rgba(0, 0, 0, 0.35);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #ffd700;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* PANTALLA DE ACTIVACIÓN Y BLOQUEO */
    .activation-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5,0,1,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
    }

    .activation-box {
      background: #1a0002;
      border: 2px solid rgba(255, 215, 0, 0.5);
      border-radius: 16px;
      padding: 30px;
      width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-align: center;
    }

    .device-code-display {
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px dashed #ffd700;
      color: #ffd700;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 6px;
      padding: 12px 20px;
      border-radius: 8px;
      width: 100%;
    }

    .activation-box button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ffd700, #ff9800);
      border: none;
      border-radius: 8px;
      color: #5d3a00;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 15px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #ff1e27;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE ACTIVACIÓN -->
  <div class="activation-overlay" id="activationScreen">
    <div class="activation-box">
      <div style="font-size: 2.2rem; color: #ffd700;"><i class="fa-solid fa-tv"></i></div>
      <h3 style="color: #fff; font-size: 1.2rem;">Activación de Dispositivo</h3>
      <p style="font-size: 0.82rem; color: #ccc;">Tu código único de 6 dígitos es:</p>
      
      <div class="device-code-display" id="uniqueDeviceCode">------</div>
      
      <p style="font-size: 0.78rem; color: #aaa;" id="statusLicencia">Esperando activación en el panel...</p>
      
      <button onclick="verificarLicenciaNube()">Verificar Activación</button>
    </div>
  </div>

  <!-- PANTALLA DE CARGA -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <h3 style="color: #fff; font-size: 1.1rem;">Cargando Stream One...</h3>
    <p style="color: #aaa; font-size: 0.85rem;" id="loadingStatus">Sincronizando canales...</p>
  </div>

  <div class="app-container">
    <div class="sparkles-overlay"></div>

    <header class="header">
      <div style="display: flex; align-items: center;">
        <div class="brand-section">
          <div class="logo-box"><i class="fa-solid fa-play"></i></div>
          <span class="app-title">Stream One</span>
          <span class="app-version" id="deviceBadge">TV Box</span>
        </div>

        <nav class="nav-tabs" id="navTabs">
          <button class="tab-btn active" data-category="LIVE">LIVE</button>
          <button class="tab-btn" data-category="MOVIES">MOVIES</button>
          <button class="tab-btn" data-category="SERIES">SERIES</button>
          <button class="tab-btn kids" data-category="KIDS">KIDS</button>
          <button class="tab-btn" data-category="FREE">FREE</button>
          <button class="tab-btn" data-category="EXPLORAR">EXPLORAR</button>
        </nav>
      </div>

      <div class="header-actions">
        <button class="load-m3u-btn" onclick="verificarLicenciaNube()">
          <i class="fa-solid fa-rotate"></i> Recargar
        </button>
        <button class="membership-btn"><i class="fa-solid fa-gem"></i> Get membership</button>
      </div>
    </header>

    <main class="main-content">
      <section class="categories-panel">
        <div class="panel-title"><span>Categorías</span></div>
        <div class="scroll-list" id="categoriesContainer"></div>
      </section>

      <section class="items-panel">
        <div class="panel-title">
          <span id="itemsPanelTitle">Contenido</span>
          <span class="item-count-badge" id="itemCount">0</span>
        </div>
        <div class="scroll-list" id="itemsContainer"></div>
      </section>

      <section class="player-panel">
        <div class="video-container">
          <video id="videoPlayer" autoplay controls></video>
          <button class="expand-btn" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
        </div>
        <div class="player-bar">
          <div class="current-channel-info">
            <div class="current-channel-title" id="currentChannelName">Selecciona un canal</div>
            <div class="epg-show-title" id="epgShowTitle">Transmisión en directo</div>
          </div>
          <div class="epg-time-badge" id="epgTimeBadge">LIVE</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const PANEL_JSON_URL = "https://raw.githubusercontent.com/StreamOne01/Streamone/refs/heads/main/licencias.json";

    let m3uUrl = ""; 
    let allItems = [];
    let currentCategory = "LIVE";
    let hls = null;
    let heartbeatInterval = null;
    const video = document.getElementById('videoPlayer');

    function obtenerCodigoDispositivo() {
      let code = localStorage.getItem('streamone_device_id');
      if (!code || code.length !== 6) {
        code = Math.floor(100000 + Math.random() * 900000).toString();
        localStorage.setItem('streamone_device_id', code);
      }
      return code;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const codigoUnico = obtenerCodigoDispositivo();
      document.getElementById('uniqueDeviceCode').textContent = codigoUnico;

      document.getElementById('activationScreen').style.display = 'flex';
      verificarLicenciaNube();
    });

    async function verificarLicenciaNube() {
      const codigoActual = obtenerCodigoDispositivo();
      const statusText = document.getElementById('statusLicencia');
      statusText.textContent = `Buscando código ${codigoActual} en la nube...`;

      try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(PANEL_JSON_URL + '?t=' + new Date().getTime())}`;
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error("No se pudo conectar al servidor.");
        
        const data = await res.json();
        const licencias = JSON.parse(data.contents);

        const dispositivo = licencias.find(item => item.codigo === codigoActual);

        if (!dispositivo) {
          statusText.textContent = `Dispositivo no registrado. Tu código es: ${codigoActual}`;
          return;
        }

        if (dispositivo.activo !== true) {
          statusText.textContent = `Código ${codigoActual}: Esperando activación en el panel.`;
          return;
        }

        const hoy = new Date().toISOString().split('T')[0];
        if (dispositivo.fechaFin && hoy > dispositivo.fechaFin) {
          statusText.textContent = `Suscripción vencida el ${dispositivo.fechaFin}.`;
          return;
        }

        if (!dispositivo.m3uUrl) {
          statusText.textContent = `Licencia activa, pero falta asignar la m3uUrl en el JSON.`;
          return;
        }

        m3uUrl = dispositivo.m3uUrl;

        statusText.textContent = "¡Activado con éxito! Cargando...";
        setTimeout(() => {
          document.getElementById('activationScreen').style.display = 'none';
          iniciarApp();
        }, 800);

      } catch (e) {
        statusText.textContent = `Error de lectura. Tu código único es: ${codigoActual}`;
      }
    }

    function iniciarApp() {
      detectarDispositivoUI();
      descargarListaM3U();
    }

    function detectarDispositivoUI() {
      const ua = navigator.userAgent.toLowerCase();
      let tipo = "PC";
      if (ua.includes('googletv') || ua.includes('android tv') || ua.includes('aftb') || ua.includes('smarttv')) {
        tipo = "TV Box";
      } else if (/android|iphone|ipad|ipod|mobile/i.test(ua)) {
        tipo = "Móvil";
      }
      document.getElementById('deviceBadge').textContent = tipo;
    }

    document.querySelectorAll('#navTabs .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#navTabs .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-category');
        buildCategoriesList();
      });
    });

    async function descargarListaM3U() {
      const statusText = document.getElementById('loadingStatus');
      document.getElementById('loadingOverlay').style.display = 'flex';
      statusText.textContent = "Sincronizando M3U...";

      const apiProxy = `https://api.allorigins.win/get?url=${encodeURIComponent(m3uUrl)}`;

      try {
        const response = await fetch(apiProxy);
        if (!response.ok) throw new Error();
        
        const data = await response.json();
        if (!data || !data.contents) throw new Error();

        allItems = parseAndClassifyM3U(data.contents);
        document.getElementById('loadingOverlay').style.display = 'none';
        buildCategoriesList();
      } catch (error) {
        statusText.textContent = "Error al descargar el enlace M3U del panel.";
        document.getElementById('loadingOverlay').style.display = 'none';
      }
    }

    function parseAndClassifyM3U(content) {
      const lines = content.split('\n');
      const items = [];
      let currentItem = {};
      let counter = 1;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          const logo = logoMatch ? logoMatch[1] : '';
          const groupMatch = line.match(/group-title="([^"]+)"/);
          const group = groupMatch ? groupMatch[1].trim() : 'GENERAL';
          const parts = line.split(',');
          const name = parts.length > 1 ? parts.slice(1).join(',').trim() : `Canal ${counter}`;
          currentItem = { name, logo, group, number: counter };
        } else if (line.length > 0 && !line.startsWith('#')) {
          currentItem.url = line;
          const n = (currentItem.name || '').toLowerCase();
          const g = (currentItem.group || '').toLowerCase();
          const u = (currentItem.url || '').toLowerCase();

          if (
            g.includes('serie') || 
            g.includes('series') || 
            n.includes('temporada') || 
            n.match(/s\d{1,2}\s*e\d{1,2}/i) || 
            u.includes('/series/')
          ) {
            currentItem.category = 'SERIES';
          } else if (
            g.includes('kids') || 
            g.includes('infantil') || 
            n.includes('disney') || 
            n.includes('cartoon')
          ) {
            currentItem.category = 'KIDS';
          } else if (
            g.includes('movie') || 
            g.includes('pelicula') || 
            g.includes('cine') || 
            u.endsWith('.mp4') || 
            u.endsWith('.mkv') || 
            u.includes('/movie/')
          ) {
            currentItem.category = 'MOVIES';
          } else if (
            g.includes('free') || 
            g.includes('gratis')
          ) {
            currentItem.category = 'FREE';
          } else {
            currentItem.category = 'LIVE';
          }

          items.push(currentItem);
          counter++;
          currentItem = {};
        }
      }
      return items;
    }

    function buildCategoriesList() {
      const catItems = currentCategory === 'EXPLORAR' ? allItems : allItems.filter(i => i.category === currentCategory);
      const groups = [...new Set(catItems.map(i => i.group))];

      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';

      if (groups.length === 0) {
        container.innerHTML = '<div style="font-size:0.8rem; padding:10px; color:#aaa;">Sin categorías</div>';
        document.getElementById('itemsContainer').innerHTML = '';
        document.getElementById('itemCount').textContent = '0';
        return;
      }

      groups.forEach((group, idx) => {
        const card = document.createElement('div');
        card.className = `list-card ${idx === 0 ? 'active' : ''}`;
        card.innerHTML = `<i class="fa-solid fa-folder"></i> <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${group}</span>`;
        card.onclick = () => {
          document.querySelectorAll('#categoriesContainer .list-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          loadItemsForGroup(group, catItems);
        };
        container.appendChild(card);
      });

      loadItemsForGroup(groups[0], catItems);
    }

    function loadItemsForGroup(groupName, catItems) {
      const groupItems = catItems.filter(i => i.group === groupName);
      document.getElementById('itemsPanelTitle').textContent = groupName;
      document.getElementById('itemCount').textContent = groupItems.length;

      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      groupItems.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `list-card ${index === 0 ? 'active' : ''}`;
        card.onclick = () => {
          document.querySelectorAll('#itemsContainer .list-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          playItem(item);
        };

        const logoSrc = item.logo || 'https://via.placeholder.com/100/111111/FFFFFF?text=TV';
        card.innerHTML = `
          <div class="channel-logo-container">
            <img src="${logoSrc}" class="channel-logo" onerror="this.src='https://via.placeholder.com/100/111111/FFFFFF?text=TV'">
          </div>
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">${item.name}</span>
        `;
        container.appendChild(card);
      });

      if (groupItems.length > 0) playItem(groupItems[0]);
    }

    function playItem(item) {
      document.getElementById('currentChannelName').textContent = item.name;
      document.getElementById('epgShowTitle').textContent = item.group;

      if (Hls.isSupported() && (item.url.includes('.m3u8') || !item.url.includes('.'))) {
        if (hls) hls.destroy();
        hls = new Hls({ maxBufferLength: 30, backBufferLength: 60 });
        hls.loadSource(item.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => {}));
      } else {
        if (hls) hls.destroy();
        video.src = item.url;
        video.play().catch(e => {});
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.querySelector('.video-container').requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
