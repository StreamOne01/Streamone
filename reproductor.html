<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream One - 3 Columnas Centrado</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-base: #8b0000;
            --bg-overlay: rgba(20, 0, 0, 0.9);
            --bg-card: rgba(50, 0, 0, 0.5);
            --bg-card-hover: rgba(255, 183, 3, 0.15);
            --accent: #ffb703;
            --text-main: #ffffff;
            --text-muted: #d0d0d0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #a50000 0%, #3a0000 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Pantalla de Bienvenida */
        #welcomeScreen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 0, 0, 0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .welcome-card {
            background: rgba(30, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .welcome-logo {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .welcome-logo span { color: var(--accent); }

        .welcome-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .input-group input[type="text"]:focus { border-color: var(--accent); }

        .file-upload-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            color: #fff;
            margin-top: 15px;
        }
        .file-upload-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .btn-start {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 20px;
            width: 100%;
        }
        .btn-start:hover { opacity: 0.9; }

        /* Cabecera Principal */
        header {
            background: rgba(25, 0, 0, 0.95);
            padding: 12px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-logo-header { font-size: 14px; font-weight: 800; color: #fff; background: rgba(0, 0, 0, 0.4); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); }
        .header-right { display: flex; align-items: center; gap: 15px; font-size: 13px; }

        /* Contenedor de 3 Columnas */
        .app-container {
            display: grid;
            grid-template-columns: 290px 330px 1fr;
            gap: 20px;
            padding: 85px 20px 20px 20px;
            max-width: 1650px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .app-container { grid-template-columns: 1fr; height: auto; }
        }

        .column-box {
            background: var(--bg-overlay);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: calc(100vh - 105px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .column-header {
            padding: 16px 20px;
            font-size: 14px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0,0,0,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            text-align: center;
        }

        .column-content {
            overflow-y: auto;
            padding: 16px; /* Mejor margen interno general */
            display: flex;
            flex-direction: column;
            gap: 12px; /* Mayor separación entre filas para que respiren mejor */
            flex: 1;
            justify-content: flex-start;
        }

        /* Elementos de lista centrados y mejor distribuidos */
        .list-item {
            background: var(--bg-card);
            padding: 14px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }
        .list-item:hover { 
            background: var(--bg-card-hover); 
            border-color: rgba(255, 183, 3, 0.3);
            transform: translateX(3px);
        }
        .list-item.active { 
            background: rgba(255, 183, 3, 0.25); 
            border-color: var(--accent); 
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 183, 3, 0.15);
        }

        /* Columna Derecha: Reproductor */
        .player-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: transparent;
            border: none;
            height: auto;
        }

        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        video { width: 100%; height: 100%; object-fit: contain; }

        .epg-bar {
            background: var(--bg-overlay);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .epg-info h2 { margin: 0 0 6px 0; font-size: 16px; color: #fff; font-weight: 700; }
        .epg-info p { margin: 0; font-size: 13px; color: var(--text-muted); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="welcomeScreen">
        <div class="welcome-card">
            <div class="welcome-logo">Stream <span>One</span></div>
            <p>Ingresa tu enlace M3U para explorar el contenido</p>
            
            <div class="input-group">
                <label>Enlace M3U (URL)</label>
                <input type="text" id="m3uUrlInput" placeholder="https://ejemplo.com/lista.m3u" value="https://raw.githubusercontent.com/StreamOne01/Streamone/main/Peliculas.m3u">
            </div>

            <div class="file-upload-btn" onclick="document.getElementById('m3uFileInput').click()">
                📂 Cargar archivo .m3u local
            </div>
            <input type="file" id="m3uFileInput" accept=".m3u" style="display: none;" onchange="cargarArchivoLocal(this)">

            <button class="btn-start" onclick="iniciarStreamOne()">Iniciar Explorador</button>
        </div>
    </div>

    <!-- Cabecera -->
    <header>
        <div class="brand-logo-header">📺 Stream One - Explorador</div>
        <div class="header-right">
            <span>👤 Carlos Muñoz</span>
            <button onclick="location.reload()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color:#fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">🔄 Cambiar Lista</button>
            <span id="reloj">11:46 PM</span>
        </div>
    </header>

    <!-- Interfaz de 3 Columnas -->
    <div class="app-container">
        
        <!-- Columna 1: Carpetas / Categorías -->
        <div class="column-box">
            <div class="column-header">📁 Carpetas</div>
            <div id="folderList" class="column-content">
                <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Esperando lista...</div>
            </div>
        </div>

        <!-- Columna 2: Contenido de la Carpeta Seleccionada -->
        <div class="column-box">
            <div class="column-header" id="itemsHeaderTitle">📄 Elementos</div>
            <div id="itemList" class="column-content">
                <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Selecciona una carpeta</div>
            </div>
        </div>

        <!-- Columna 3: Reproductor y EPG -->
        <div class="player-column">
            <div class="video-box">
                <video id="videoPlayer" controls playsinline autoplay></video>
            </div>
            <div class="epg-bar">
                <div class="epg-info">
                    <h2 id="currentTitle">Selecciona un archivo</h2>
                    <p id="currentDesc">Listo para reproducir</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const folderList = document.getElementById('folderList');
        const itemList = document.getElementById('itemList');
        const currentTitle = document.getElementById('currentTitle');
        const currentDesc = document.getElementById('currentDesc');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const m3uUrlInput = document.getElementById('m3uUrlInput');
        const itemsHeaderTitle = document.getElementById('itemsHeaderTitle');

        let hls = null;
        let baseDatosCategorias = {};

        window.onload = function() {
            setInterval(actualizarReloj, 1000);
        };

        function actualizarReloj() {
            const ahora = new Date();
            let horas = ahora.getHours();
            const minutos = ahora.getMinutes().toString().padStart(2, '0');
            const ampm = horas >= 12 ? 'PM' : 'AM';
            horas = horas % 12 || 12;
            document.getElementById('reloj').textContent = `${horas}:${minutos} ${ampm}`;
        }

        async function iniciarStreamOne() {
            const url = m3uUrlInput.value.trim();
            if (!url) {
                alert("Por favor ingresa un enlace M3U válido");
                return;
            }

            try {
                folderList.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Cargando...</div>';
                welcomeScreen.style.display = 'none';

                const respuesta = await fetch(url);
                if (!respuesta.ok) throw new Error("Error de conexión");
                const texto = await respuesta.text();
                parsearM3UenCarpetas(texto);
            } catch (error) {
                welcomeScreen.style.display = 'flex';
                alert("No se pudo cargar la lista. Verifica la URL.");
            }
        }

        function cargarArchivoLocal(input) {
            const archivo = input.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                welcomeScreen.style.display = 'none';
                parsearM3UenCarpetas(e.target.result);
            };
            lector.readAsText(archivo);
        }

        function parsearM3UenCarpetas(contenido) {
            const lineas = contenido.split('\n');
            baseDatosCategorias = {};

            let nombreActual = "Sin nombre";
            let categoriaActual = "General";

            lineas.forEach(linea => {
                linea = linea.trim();
                if (linea.startsWith('#EXTINF:')) {
                    const matchGroup = linea.match(/group-title="([^"]+)"/);
                    if (matchGroup && matchGroup[1]) {
                        categoriaActual = matchGroup[1].trim();
                    } else {
                        categoriaActual = "General";
                    }

                    const partes = linea.split(',');
                    if (partes.length > 1) {
                        nombreActual = partes.slice(1).join(',').trim();
                    }
                } else if (linea && !linea.startsWith('#')) {
                    if (!baseDatosCategorias[categoriaActual]) {
                        baseDatosCategorias[categoriaActual] = [];
                    }

                    baseDatosCategorias[categoriaActual].push({
                        nombre: nombreActual,
                        url: linea
                    });

                    nombreActual = "Sin nombre";
                }
            });

            renderizarCarpetas();
        }

        function renderizarCarpetas() {
            folderList.innerHTML = '';
            const categorias = Object.keys(baseDatosCategorias);

            if (categorias.length === 0) {
                folderList.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">No se encontraron carpetas</div>';
                return;
            }

            categorias.forEach((cat, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.id = `folder-${index}`;
                div.textContent = `📁 ${cat} (${baseDatosCategorias[cat].length})`;
                div.onclick = () => seleccionarCarpeta(cat, div);
                folderList.appendChild(div);
            });

            if (categorias.length > 0) {
                document.getElementById('folder-0').click();
            }
        }

        function seleccionarCarpeta(nombreCarpeta, elementoDiv) {
            document.querySelectorAll('#folderList .list-item').forEach(el => el.classList.remove('active'));
            elementoDiv.classList.add('active');

            itemsHeaderTitle.textContent = `📄 ${nombreCarpeta}`;
            const elementos = baseDatosCategorias[nombreCarpeta] || [];
            renderizarElementos(elementos);
        }

        function renderizarElementos(elementos) {
            itemList.innerHTML = '';

            if (elementos.length === 0) {
                itemList.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Carpeta vacía</div>';
                return;
            }

            elementos.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.id = `item-${index}`;
                div.textContent = item.nombre;
                div.title = item.nombre;
                div.onclick = () => reproducirItem(item.url, item.nombre, div);
                itemList.appendChild(div);
            });
        }

        function reproducirItem(url, nombre, elementoDiv) {
            document.querySelectorAll('#itemList .list-item').forEach(el => el.classList.remove('active'));
            elementoDiv.classList.add('active');

            currentTitle.textContent = nombre;
            currentDesc.textContent = "Reproduciendo • Stream One";

            if (hls) hls.destroy();

            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => console.log(e)));
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => video.play().catch(e => console.log(e)));
                } else {
                    alert('HLS no compatible en este navegador');
                }
            } else {
                video.src = url;
                video.load();
                video.play().catch(e => console.log(e));
            }
        }
    </script>
</body>
</html>
