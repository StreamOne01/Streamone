<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stream One Player - Multidispositivo</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: #000;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at 10% 20%, #ff1e27 0%, #b80009 45%, #600004 90%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sparkles-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(circle at 85% 15%, rgba(255, 215, 0, 0.6) 0%, transparent 12%),
        radial-gradient(circle at 92% 30%, rgba(255, 255, 255, 0.7) 0%, transparent 6%),
        radial-gradient(circle at 15% 80%, rgba(255, 215, 0, 0.4) 0%, transparent 15%),
        radial-gradient(circle at 28% 50%, rgba(255, 200, 100, 0.5) 0%, transparent 8%),
        radial-gradient(circle at 70% 85%, rgba(255, 255, 255, 0.5) 0%, transparent 10%);
      pointer-events: none;
      z-index: 1;
    }

    .header {
      position: relative;
      z-index: 10;
      height: 60px;
      padding: 10px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-box {
      background: #fff;
      color: #d30008;
      border-radius: 8px;
      padding: 4px 8px;
      font-weight: 900;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
    }

    .app-version {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 10px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s, border 0.2s;
    }

    .tab-btn.active, .tab-btn:focus {
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      outline: none;
    }

    .tab-btn.kids {
      color: #ffeb3b;
      font-weight: 900;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .load-m3u-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .load-m3u-btn:focus {
      border-color: #ffd700;
      outline: none;
    }

    .membership-btn {
      background: linear-gradient(135deg, #ffd700, #ff9800);
      color: #5d3a00;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .main-content {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      padding: 10px 25px 20px 25px;
      gap: 15px;
      height: calc(100% - 60px);
      overflow: hidden;
    }

    .categories-panel {
      width: 220px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .items-panel {
      width: 280px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .item-count-badge {
      font-size: 0.7rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .scroll-list {
      flex: 1 1 auto;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 4px;
      min-height: 0;
    }

    .scroll-list::-webkit-scrollbar {
      width: 4px;
    }
    .scroll-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }

    .list-card {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 6px;
      cursor: pointer;
      border: 1.5px solid transparent;
      font-size: 0.82rem;
      font-weight: 600;
      gap: 8px;
      flex-shrink: 0;
      outline: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .list-card:hover, .list-card.active, .list-card:focus {
      background: rgba(0, 0, 0, 0.65);
      border-color: #ffd700;
    }

    .channel-logo-container {
      width: 36px;
      height: 24px;
      background: #111;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .channel-logo {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .player-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .video-container {
      flex: 1;
      background: #000;
      border-radius: 8px 8px 0 0;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: translateZ(0);
    }

    .expand-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }
    .expand-btn:focus {
      border-color: #ffd700;
      outline: none;
    }

    .player-bar {
      height: 52px;
      background: #800000;
      border-radius: 0 0 8px 8px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .current-channel-info {
      display: flex;
      flex-direction: column;
    }

    .current-channel-title {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
    }

    .epg-show-title {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .epg-time-badge {
      background: rgba(0, 0, 0, 0.35);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #ffd700;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    @media screen and (max-width: 950px) and (orientation: landscape) {
      .header {
        height: 40px;
        padding: 4px 12px;
      }
      .brand-section .logo-box {
        font-size: 0.85rem;
        padding: 2px 6px;
      }
      .app-title {
        font-size: 0.9rem;
      }
      .app-version {
        font-size: 0.55rem;
        padding: 1px 4px;
      }
      .tab-btn {
        font-size: 0.68rem;
        padding: 3px 8px;
      }
      .load-m3u-btn, .membership-btn {
        font-size: 0.68rem;
        padding: 3px 8px;
      }
      .main-content {
        padding: 5px 10px 10px 10px;
        gap: 8px;
        height: calc(100% - 40px);
      }
      .categories-panel {
        width: 140px;
      }
      .items-panel {
        width: 170px;
      }
      .panel-title {
        font-size: 0.72rem;
        margin-bottom: 4px;
      }
      .list-card {
        padding: 4px 6px;
        font-size: 0.7rem;
        gap: 6px;
      }
      .channel-logo-container {
        width: 28px;
        height: 18px;
      }
      .player-bar {
        height: 38px;
        padding: 0 10px;
      }
      .current-channel-title {
        font-size: 0.75rem;
      }
      .epg-show-title {
        font-size: 0.58rem;
      }
      .epg-time-badge {
        font-size: 0.6rem;
        padding: 2px 6px;
      }
      .expand-btn {
        width: 26px;
        height: 26px;
        bottom: 8px;
        right: 8px;
        font-size: 0.8rem;
      }
    }

    @media screen and (max-width: 768px) and (orientation: portrait) {
      .header {
        height: 50px;
        padding: 5px 12px;
      }
      .brand-section .app-title {
        font-size: 1rem;
      }
      .nav-tabs {
        display: none; 
      }
      .header-actions .load-m3u-btn {
        display: none;
      }

      .main-content {
        flex-direction: column;
        padding: 8px;
        gap: 8px;
        height: calc(100% - 50px);
      }

      .player-panel {
        height: 35vh;
        flex: none;
      }

      .video-container {
        border-radius: 8px 8px 0 0;
      }

      .player-bar {
        height: 42px;
        padding: 0 12px;
        border-radius: 0 0 8px 8px;
      }

      .current-channel-title {
        font-size: 0.85rem;
      }
      .epg-show-title {
        font-size: 0.65rem;
      }

      .mobile-tabs-container {
        display: flex;
        background: rgba(0,0,0,0.4);
        border-radius: 8px 8px 0 0;
        overflow-x: auto;
        flex-shrink: 0;
      }
      .mobile-tab-btn {
        flex: 1;
        padding: 8px;
        background: transparent;
        border: none;
        color: #ccc;
        font-size: 0.75rem;
        font-weight: 700;
        text-align: center;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .mobile-tab-btn.active {
        color: #fff;
        background: rgba(0,0,0,0.3);
        border-bottom-color: #ff1e27;
      }

      .mobile-section-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: rgba(0,0,0,0.2);
        border-radius: 0 0 8px 8px;
        overflow: hidden;
        padding: 8px;
      }

      .categories-panel, .items-panel {
        width: 100%;
        height: 100%;
      }

      .categories-panel {
        display: flex; 
      }
      .items-panel {
        display: none;
      }
    }

    .mobile-tabs-container {
      display: none;
    }

    .activation-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5,0,1,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
    }

    .activation-box {
      background: #1a0002;
      border: 2px solid rgba(255, 215, 0, 0.5);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-align: center;
    }

    .device-code-display {
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px dashed #ffd700;
      color: #ffd700;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 6px;
      padding: 12px 20px;
      border-radius: 8px;
      width: 100%;
    }

    .activation-box button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ffd700, #ff9800);
      border: none;
      border-radius: 8px;
      color: #5d3a00;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 15px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #ff1e27;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="activation-overlay" id="activationScreen">
    <div class="activation-box">
      <div style="font-size: 2.2rem; color: #ffd700;"><i class="fa-solid fa-tv"></i></div>
      <h3 style="color: #fff; font-size: 1.2rem;">Activación de Dispositivo</h3>
      <p style="font-size: 0.82rem; color: #ccc;">Tu código único de 6 dígitos es:</p>
      
      <div class="device-code-display" id="uniqueDeviceCode">------</div>
      
      <p style="font-size: 0.78rem; color: #aaa;" id="statusLicencia">Verificando en la base de datos...</p>
      
      <button onclick="verificarLicenciaNube()">Verificar Activación</button>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <h3 style="color: #fff; font-size: 1.1rem;">Cargando Stream One...</h3>
    <p style="color: #aaa; font-size: 0.85rem;" id="loadingStatus">Sincronizando lista...</p>
  </div>

  <div class="app-container">
    <div class="sparkles-overlay"></div>

    <header class="header">
      <div style="display: flex; align-items: center;">
        <div class="brand-section">
          <div class="logo-box"><i class="fa-solid fa-play"></i></div>
          <span class="app-title">Stream One</span>
          <span class="app-version" id="deviceBadge">TV Box</span>
        </div>

        <nav class="nav-tabs" id="navTabs">
          <button class="tab-btn active" data-category="LIVE">LIVE</button>
          <button class="tab-btn" data-category="MOVIES">MOVIES</button>
          <button class="tab-btn" data-category="SERIES">SERIES</button>
          <button class="tab-btn kids" data-category="KIDS">KIDS</button>
          <button class="tab-btn" data-category="FREE">FREE</button>
          <button class="tab-btn" data-category="EXPLORAR">EXPLORAR</button>
        </nav>
      </div>

      <div class="header-actions">
        <button class="load-m3u-btn" onclick="verificarLicenciaNube()">
          <i class="fa-solid fa-rotate"></i> Recargar
        </button>
        <button class="membership-btn"><i class="fa-solid fa-gem"></i> Premium</button>
      </div>
    </header>

    <main class="main-content">
      
      <div style="display:flex; flex-direction:column; flex:1; width:100%; height:100%;" id="mobileWrapper">
        <div class="mobile-tabs-container" id="mobileTabsContainer">
          <button class="mobile-tab-btn active" onclick="switchMobileTab('cat')">Categorías</button>
          <button class="mobile-tab-btn" onclick="switchMobileTab('channels')">Canales</button>
          <button class="mobile-tab-btn" onclick="switchMobileTab('menu')">Menú / Secciones</button>
        </div>

        <div class="mobile-section-container" id="mobileSectionContainer" style="display:flex; flex-direction:row; flex:1; gap:15px; background:transparent; padding:0; min-height:0;">
          
          <!-- Panel de Categorías -->
          <section class="categories-panel" id="categoriesPanel">
            <div class="panel-title"><span>Categorías</span></div>
            <div class="scroll-list" id="categoriesContainer"></div>
          </section>

          <!-- Panel de Ítems / Canales -->
          <section class="items-panel" id="itemsPanel">
            <div class="panel-title">
              <span id="itemsPanelTitle">Contenido</span>
              <span class="item-count-badge" id="itemCount">0</span>
            </div>
            <div class="scroll-list" id="itemsContainer"></div>
          </section>

          <!-- Panel del Reproductor de Video -->
          <section class="player-panel">
            <div class="video-container">
              <video id="videoPlayer" autoplay controls></video>
              <button class="expand-btn" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
            </div>
            <div class="player-bar">
              <div class="current-channel-info">
                <div class="current-channel-title" id="currentChannelName">Selecciona un canal</div>
                <div class="epg-show-title" id="epgShowTitle">Transmisión en vivo</div>
              </div>
              <div class="epg-time-badge" id="epgTimeBadge">LIVE</div>
            </div>
          </section>

        </div>
      </div>

    </main>
  </div>

  <script>
    const PANEL_JSON_URL = "https://script.google.com/macros/s/AKfycbxA4K8laxiKMaMvv6I05BLqblTxKlySm23e0kvvroTJUbJ_QOzP4oPkDfLnvtKci6Yb/exec";

    let m3uUrl = ""; 
    let allItems = [];
    let currentCategory = "LIVE";
    let hls = null;
    let canalActual = "";
    let monitorInterval = null;
    let mobileActiveTab = 'cat'; 
    const video = document.getElementById('videoPlayer');

    function obtenerCodigoDispositivo() {
      let code = localStorage.getItem('streamone_device_id');
      if (!code || code.length !== 6) {
        code = Math.floor(100000 + Math.random() * 900000).toString();
        localStorage.setItem('streamone_device_id', code);
      }
      return code;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const codigoUnico = obtenerCodigoDispositivo();
      document.getElementById('uniqueDeviceCode').textContent = codigoUnico;

      document.getElementById('activationScreen').style.display = 'flex';
      verificarLicenciaNube();
      
      setInterval(verificarLicenciaNube, 60000);
      window.addEventListener('resize', checkMobileLayout);
      checkMobileLayout();
      initRemoteControlNavigation();
    });

    /* SOPORTE DE NAVEGACIÓN UNIVERSAL CON CONTROL REMOTO (D-PAD) / TECLADO */
    function initRemoteControlNavigation() {
      window.addEventListener('keydown', (e) => {
        const focusableElements = Array.from(document.querySelectorAll(
          '.list-card, .tab-btn, .load-m3u-btn, .expand-btn, button'
        )).filter(el => el.offsetParent !== null);

        const currentIndex = focusableElements.indexOf(document.activeElement);

        if (['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
          e.preventDefault();
          if (currentIndex === -1) {
            if (focusableElements.length > 0) focusableElements[0].focus();
            return;
          }

          let nextIndex = currentIndex;
          if (e.key === 'ArrowDown') {
            nextIndex = Math.min(currentIndex + 1, focusableElements.length - 1);
          } else if (e.key === 'ArrowUp') {
            nextIndex = Math.max(currentIndex - 1, 0);
          } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
            // Salto rápido entre paneles (Categorías -> Canales -> Reproductor)
            const categoriesBox = document.getElementById('categoriesContainer');
            const itemsBox = document.getElementById('itemsContainer');
            
            if (e.key === 'ArrowRight' && categoriesBox.contains(document.activeElement)) {
              const firstItem = itemsBox.querySelector('.list-card');
              if (firstItem) { firstItem.focus(); return; }
            } else if (e.key === 'ArrowLeft' && itemsBox.contains(document.activeElement)) {
              const firstCat = categoriesBox.querySelector('.list-card');
              if (firstCat) { firstCat.focus(); return; }
            }
          }

          focusableElements[nextIndex].focus();
          focusableElements[nextIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    }

    function isMobilePortrait() {
      return window.innerWidth <= 768 && window.innerHeight > window.innerWidth;
    }

    function checkMobileLayout() {
      const catPanel = document.getElementById('categoriesPanel');
      const itemsPanel = document.getElementById('itemsPanel');
      
      if (isMobilePortrait()) {
        if (mobileActiveTab === 'cat') {
          catPanel.style.display = 'flex';
          itemsPanel.style.display = 'none';
        } else if (mobileActiveTab === 'channels') {
          catPanel.style.display = 'none';
          itemsPanel.style.display = 'flex';
        } else if (mobileActiveTab === 'menu') {
          catPanel.style.display = 'flex';
          itemsPanel.style.display = 'none';
        }
      } else {
        catPanel.style.display = 'flex';
        itemsPanel.style.display = 'flex';
      }
    }

    function switchMobileTab(tab) {
      mobileActiveTab = tab;
      const buttons = document.querySelectorAll('.mobile-tab-btn');
      buttons.forEach(b => b.classList.remove('active'));

      if (tab === 'cat') {
        buttons[0].classList.add('active');
        currentCategory = "LIVE"; 
      } else if (tab === 'channels') {
        buttons[1].classList.add('active');
      } else if (tab === 'menu') {
        buttons[2].classList.add('active');
        mostrarMenuSeccionesMovil();
        return;
      }
      checkMobileLayout();
    }

    function mostrarMenuSeccionesMovil() {
      const catPanel = document.getElementById('categoriesPanel');
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      
      const categoriasPrincipales = [
        {name: 'LIVE', icon: 'fa-tv', label: 'En Vivo (LIVE)'},
        {name: 'MOVIES', icon: 'fa-film', label: 'Películas (MOVIES)'},
        {name: 'SERIES', icon: 'fa-video', label: 'Series (SERIES)'},
        {name: 'KIDS', icon: 'fa-child', label: 'Infantil (KIDS)'},
        {name: 'FREE', icon: 'fa-gift', label: 'Gratis (FREE)'},
        {name: 'EXPLORAR', icon: 'fa-compass', label: 'Explorar Todo'}
      ];

      categoriasPrincipales.forEach(cat => {
        const card = document.createElement('div');
        card.className = `list-card ${currentCategory === cat.name ? 'active' : ''}`;
        card.tabIndex = 0;
        card.innerHTML = `<i class="fa-solid ${cat.icon}"></i> <span style="font-weight:700;">${cat.label}</span>`;
        card.onclick = () => {
          currentCategory = cat.name;
          switchMobileTab('cat');
          buildCategoriesList();
        };
        container.appendChild(card);
      });
      catPanel.style.display = 'flex';
      document.getElementById('itemsPanel').style.display = 'none';
    }

    async function verificarLicenciaNube() {
      const codigoActual = obtenerCodigoDispositivo();
      const statusText = document.getElementById('statusLicencia');

      try {
        const res = await fetch(`${PANEL_JSON_URL}?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("Error de conexión");
        
        const licencias = await res.json();
        const dispositivo = licencias.find(item => String(item.codigo) === String(codigoActual));

        if (!dispositivo) {
          statusText.textContent = `Código no registrado. Se creará automáticamente la solicitud.`;
          reportarEstadoServidor("Esperando Activación");
          return;
        }

        if (dispositivo.activo !== true) {
          statusText.textContent = `Código ${codigoActual}: Suspendido o esperando activación.`;
          document.getElementById('activationScreen').style.display = 'flex';
          if (video) video.pause();
          return;
        }

        if (dispositivo.fechaFin) {
          const hoy = new Date().toISOString().split('T')[0];
          const fechaLimite = String(dispositivo.fechaFin).substring(0, 10);
          if (hoy > fechaLimite) {
            statusText.textContent = `Servicio vencido el ${fechaLimite}.`;
            document.getElementById('activationScreen').style.display = 'flex';
            if (video) video.pause();
            return;
          }
        }

        if (!dispositivo.m3uUrl) {
          statusText.textContent = `Licencia activa, pero falta asignar la URL M3U en Google Sheets.`;
          document.getElementById('activationScreen').style.display = 'flex';
          return;
        }

        if (m3uUrl === dispositivo.m3uUrl && allItems.length > 0) {
          document.getElementById('activationScreen').style.display = 'none';
          return;
        }

        m3uUrl = dispositivo.m3uUrl;
        statusText.textContent = "¡Activación confirmada! Cargando contenido...";

        setTimeout(() => {
          document.getElementById('activationScreen').style.display = 'none';
          iniciarApp();
        }, 600);

      } catch (e) {
        statusText.textContent = `Sin conexión. Reintentando código: ${codigoActual}`;
      }
    }

    async function reportarEstadoServidor(nombreContenido) {
      const codigoActual = obtenerCodigoDispositivo();
      try {
        await fetch(PANEL_JSON_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            codigo: codigoActual,
            viendo: nombreContenido || "Menú Principal"
          })
        });
      } catch (e) {}
    }

    function iniciarApp() {
      detectarDispositivoUI();
      descargarListaM3U();

      if (monitorInterval) clearInterval(monitorInterval);
      monitorInterval = setInterval(() => {
        if (canalActual) reportarEstadoServidor(canalActual);
      }, 30000);
    }

    function detectarDispositivoUI() {
      const ua = navigator.userAgent.toLowerCase();
      let tipo = "PC / Tablet";
      if (ua.includes('googletv') || ua.includes('android tv') || ua.includes('aftb') || ua.includes('smarttv')) {
        tipo = "TV Box";
      } else if (isMobilePortrait()) {
        tipo = "Móvil (Vertical)";
      }
      document.getElementById('deviceBadge').textContent = tipo;
    }

    document.querySelectorAll('#navTabs .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#navTabs .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-category');
        buildCategoriesList();
      });
    });

    async function descargarListaM3U() {
      const statusText = document.getElementById('loadingStatus');
      document.getElementById('loadingOverlay').style.display = 'flex';
      statusText.textContent = "Obteniendo lista M3U...";

      const apiProxy = `https://api.allorigins.win/get?url=${encodeURIComponent(m3uUrl)}`;

      try {
        const response = await fetch(apiProxy);
        if (!response.ok) throw new Error();
        
        const data = await response.json();
        if (!data || !data.contents) throw new Error();

        allItems = parseAndClassifyM3U(data.contents);
        document.getElementById('loadingOverlay').style.display = 'none';
        buildCategoriesList();
      } catch (error) {
        statusText.textContent = "Error al obtener o procesar la lista M3U.";
        document.getElementById('loadingOverlay').style.display = 'none';
      }
    }

    function parseAndClassifyM3U(content) {
      const lines = content.split('\n');
      const items = [];
      let currentItem = {};
      let counter = 1;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          const logo = logoMatch ? logoMatch[1] : '';
          const groupMatch = line.match(/group-title="([^"]+)"/);
          const group = groupMatch ? groupMatch[1].trim() : 'GENERAL';
          const parts = line.split(',');
          const name = parts.length > 1 ? parts.slice(1).join(',').trim() : `Canal ${counter}`;
          currentItem = { name, logo, group, number: counter };
        } else if (line.length > 0 && !line.startsWith('#')) {
          currentItem.url = line;
          const n = (currentItem.name || '').toLowerCase();
          const g = (currentItem.group || '').toLowerCase();
          const u = (currentItem.url || '').toLowerCase();

          if (g.includes('serie') || g.includes('series') || n.includes('temporada') || n.match(/s\d{1,2}\s*e\d{1,2}/i) || u.includes('/series/')) {
            currentItem.category = 'SERIES';
          } else if (g.includes('kids') || g.includes('infantil') || n.includes('disney') || n.includes('cartoon')) {
            currentItem.category = 'KIDS';
          } else if (g.includes('movie') || g.includes('pelicula') || g.includes('cine') || u.endsWith('.mp4') || u.endsWith('.mkv') || u.includes('/movie/')) {
            currentItem.category = 'MOVIES';
          } else if (g.includes('free') || g.includes('gratis')) {
            currentItem.category = 'FREE';
          } else {
            currentItem.category = 'LIVE';
          }

          items.push(currentItem);
          counter++;
          currentItem = {};
        }
      }
      return items;
    }

    function buildCategoriesList() {
      const catItems = currentCategory === 'EXPLORAR' ? allItems : allItems.filter(i => i.category === currentCategory);
      const groups = [...new Set(catItems.map(i => i.group))];

      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';

      if (groups.length === 0) {
        container.innerHTML = '<div style="font-size:0.8rem; padding:10px; color:#aaa;">Sin categorías</div>';
        document.getElementById('itemsContainer').innerHTML = '';
        document.getElementById('itemCount').textContent = '0';
        return;
      }

      groups.forEach((group, idx) => {
        const card = document.createElement('div');
        card.className = `list-card ${idx === 0 ? 'active' : ''}`;
        card.tabIndex = 0; // Permite que el control remoto y teclado enfoquen la tarjeta
        card.innerHTML = `<i class="fa-solid fa-folder"></i> <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${group}</span>`;
        card.onclick = () => {
          document.querySelectorAll('#categoriesContainer .list-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          loadItemsForGroup(group, catItems);
          
          if (isMobilePortrait()) {
            switchMobileTab('channels'); 
          }
        };
        container.appendChild(card);
      });

      loadItemsForGroup(groups[0], catItems);
    }

    function loadItemsForGroup(groupName, catItems) {
      const groupItems = catItems.filter(i => i.group === groupName);
      document.getElementById('itemsPanelTitle').textContent = groupName;
      document.getElementById('itemCount').textContent = groupItems.length;

      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      groupItems.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `list-card ${index === 0 ? 'active' : ''}`;
        card.tabIndex = 0; // Permite navegación con control remoto
        card.onclick = () => {
          document.querySelectorAll('#itemsContainer .list-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          playItem(item);
        };

        const logoSrc = item.logo || 'https://via.placeholder.com/100/111111/FFFFFF?text=TV';
        card.innerHTML = `
          <div class="channel-logo-container">
            <img src="${logoSrc}" class="channel-logo" onerror="this.src='https://via.placeholder.com/100/111111/FFFFFF?text=TV'">
          </div>
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">${item.name}</span>
        `;
        container.appendChild(card);
      });

      if (groupItems.length > 0) playItem(groupItems[0]);
    }

    function playItem(item) {
      document.getElementById('currentChannelName').textContent = item.name;
      document.getElementById('epgShowTitle').textContent = item.group;

      canalActual = `${item.name} (${item.group})`;
      reportarEstadoServidor(canalActual);

      if (Hls.isSupported() && (item.url.includes('.m3u8') || !item.url.includes('.'))) {
        if (hls) hls.destroy();
        hls = new Hls({ maxBufferLength: 30, backBufferLength: 60 });
        hls.loadSource(item.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => {}));
      } else {
        if (hls) hls.destroy();
        video.src = item.url;
        video.play().catch(e => {});
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.querySelector('.video-container').requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  </script>
